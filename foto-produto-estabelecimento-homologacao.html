<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Fotos dos produtos</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4;--ok:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:20px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;padding:13px;border-radius:12px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.produto{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;border-top:1px solid #263247;padding:16px 0}.produto:first-child{border-top:0}.foto{width:120px;height:120px;border:1px dashed #536078;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#0b1424}.foto img{width:100%;height:100%;object-fit:cover}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}.sec{background:#3c4b61}.danger{background:#b42318}.muted{font-size:12px;color:var(--muted)}input[type=file]{max-width:100%;margin:8px 0}.msg{color:#86efac;font-size:13px;min-height:18px}@media(max-width:650px){.produto{grid-template-columns:1fr}.foto{width:100%;height:210px}}</style></head><body><div class="top">Interfood · Fotos dos produtos</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cada foto pertence exclusivamente a este estabelecimento.</div><div class="card"><h2 id="titulo">Carregando...</h2><p class="muted">Escolha JPG, PNG ou WEBP de até 5 MB. A pré-visualização aparece antes de salvar.</p><button class="btn sec" onclick="voltar()">Voltar ao cardápio</button></div><div id="lista" class="card">Carregando produtos...</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-interfood-config-teste.js"></script><script src="firebase-auth-interfood-teste.js"></script><script>const q=new URLSearchParams(location.search),fid=q.get('franquia'),loja=q.get('loja');let db,auth,storage,lojaRef,perfil;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function path(id){return 'interfood/'+fid+'/estabelecimentos/'+loja+'/produtos/'+id+'/foto'}async function iniciar(){try{({db,auth}=await InterfoodAuthTeste.iniciar());storage=auth.app.storage();await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok(u):no(Error('Faça login como estabelecimento.'))})});const s=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get();if(!s.exists)throw Error('Vínculo não encontrado.');perfil=s.data();if(perfil.ativo!==true||perfil.perfil!=='estabelecimento'||perfil.franquiaId!==fid||perfil.lojaId!==loja)throw Error('Acesso não autorizado para esta loja.');lojaRef=db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja);const sl=await lojaRef.get();$('titulo').textContent=(sl.data()?.nome||'Estabelecimento')+' · Fotos dos produtos';await listar()}catch(e){$('lista').innerHTML='<b>Acesso bloqueado:</b> '+esc(e.message)}}async function listar(){const s=await lojaRef.collection('cardapio').get(),arr=[];s.forEach(d=>arr.push({id:d.id,...d.data()}));arr.sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.nome||'').localeCompare(b.nome||''));$('lista').innerHTML=arr.length?arr.map(p=>'<div class="produto"><div id="foto-'+p.id+'" class="foto">Sem foto</div><div><b>'+esc(p.nome)+'</b><div class="muted">'+esc(p.categoria||'')+'</div><input id="file-'+p.id+'" type="file" accept="image/jpeg,image/png,image/webp" onchange="preview(\''+p.id+'\',this)"><br><button class="btn" onclick="salvar(\''+p.id+'\')">Salvar foto</button><button class="btn danger" onclick="remover(\''+p.id+'\')">Remover</button><div id="msg-'+p.id+'" class="msg"></div></div></div>').join(''):'Nenhum produto cadastrado.';for(const p of arr)carregar(p.id)}async function carregar(id){try{const u=await storage.ref(path(id)).getDownloadURL();$('foto-'+id).innerHTML='<img src="'+esc(u)+'" alt="Foto do produto">'}catch(e){}}function preview(id,input){const f=input.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){input.value='';return $('msg-'+id).textContent='Formato inválido.'}if(f.size>5*1024*1024){input.value='';return $('msg-'+id).textContent='Imagem maior que 5 MB.'}const u=URL.createObjectURL(f);$('foto-'+id).innerHTML='<img src="'+u+'" alt="Pré-visualização">';$('msg-'+id).textContent='Pré-visualização carregada. Clique em Salvar foto para confirmar.'}async function salvar(id){const input=$('file-'+id),f=input.files?.[0];if(!f)return $('msg-'+id).textContent='Escolha uma imagem primeiro.';try{$('msg-'+id).textContent='Enviando...';await storage.ref(path(id)).put(f,{contentType:f.type});const u=await storage.ref(path(id)).getDownloadURL();$('foto-'+id).innerHTML='<img src="'+esc(u)+'" alt="Foto do produto">';input.value='';$('msg-'+id).textContent='Foto salva com sucesso ✅'}catch(e){$('msg-'+id).textContent='Não foi possível salvar: '+e.message}}async function remover(id){try{try{await storage.ref(path(id)).delete()}catch(e){if(e.code!=='storage/object-not-found')throw e}$('foto-'+id).textContent='Sem foto';$('file-'+id).value='';$('msg-'+id).textContent='Foto removida.'}catch(e){$('msg-'+id).textContent='Não foi possível remover: '+e.message}}function voltar(){location.href='cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)}iniciar();</script></body></html>
