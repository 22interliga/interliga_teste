<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração do estabelecimento · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:860px;margin:auto;padding:20px}.notice,.card,.estado{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd)}.estado{margin:12px 0;font-weight:900;border:1px solid var(--bd)}.aberta{border-color:#22c55e;background:#22c55e18;color:#7cf0a4}.fechada{border-color:#ef4444;background:#ef444418;color:#ff8f9e}label{display:block;margin:11px 0 6px;color:var(--muted);font-size:13px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0a1322;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin-top:14px}.sec{background:#334155}.ok{color:#62e993;margin-top:12px}.bad{color:#ff7188;margin-top:12px}.switch{display:flex;gap:10px;align-items:center;margin-top:8px}.switch input{width:auto}.small{font-size:12px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">Interfood · Configuração da loja</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — somente o estabelecimento autenticado pode alterar os dados operacionais da própria loja.</div><div class="card"><h2 id="titulo">Carregando loja...</h2><div id="estadoServidor" class="estado">Consultando servidor...</div><div class="switch"><input id="aceitandoPedidos" type="checkbox"><label for="aceitandoPedidos" style="margin:0">Aceitando novos pedidos</label></div><div class="grid"><div><label>Categoria</label><input id="categoria" placeholder="Ex.: Lanches, Pizzaria, Restaurante"></div><div><label>Telefone da loja</label><input id="telefoneLoja" maxlength="30"></div></div><label>Endereço da loja</label><input id="enderecoLoja" maxlength="220"><div class="grid"><div><label>Horário de abertura</label><input id="horarioAbertura" type="time"></div><div><label>Horário de fechamento</label><input id="horarioFechamento" type="time"></div></div><div class="grid"><div><label>Taxa de entrega (R$)</label><input id="taxaEntrega" type="number" min="0" step="0.01"></div><div><label>Raio de entrega (km)</label><input id="raioEntregaKm" type="number" min="0" step="0.1"></div></div><button id="salvar" class="btn" onclick="salvarConfig()">Salvar configurações</button> <button class="btn sec" onclick="voltar()">Voltar ao painel</button><div id="msg"></div><p class="small">Após salvar, esta tela relê o documento diretamente do servidor e confirma o estado real da loja.</p></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const qs=k=>new URLSearchParams(location.search).get(k),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let ctx,perfil,ref;const el=id=>document.getElementById(id);function voltar(){location.href='painel-estabelecimento-firebase-teste.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}function mostrarEstado(valor){const e=el('estadoServidor');if(valor===true){e.className='estado aberta';e.textContent='SERVIDOR: LOJA ABERTA — aceitando pedidos';}else if(valor===false){e.className='estado fechada';e.textContent='SERVIDOR: LOJA FECHADA — não aceitando pedidos';}else{e.className='estado fechada';e.textContent='SERVIDOR: campo aceitandoPedidos ausente ou inválido';}}async function lerServidorEPreencher(){const d=await ref.get({source:'server'});if(!d.exists)throw new Error('Loja não encontrada.');const v=d.data()||{};el('titulo').textContent=v.nome||'Estabelecimento';el('aceitandoPedidos').checked=v.aceitandoPedidos===true;el('categoria').value=v.categoria||'';el('telefoneLoja').value=v.telefoneLoja||'';el('enderecoLoja').value=v.enderecoLoja||'';el('horarioAbertura').value=v.horarioAbertura||'';el('horarioFechamento').value=v.horarioFechamento||'';el('taxaEntrega').value=Number(v.taxaEntrega||0);el('raioEntregaKm').value=Number(v.raioEntregaKm||0);mostrarEstado(v.aceitandoPedidos);return v;}async function iniciar(){try{const x=await InterfoodAuthTeste.iniciar();ctx=x;await new Promise((res,rej)=>{const off=x.auth.onAuthStateChanged(u=>{off();u?res(u):rej(new Error('Sessão Firebase não encontrada.'))},rej)});const u=x.auth.currentUser,s=await x.db.collection('usuariosEstabelecimentos').doc(u.uid).get({source:'server'});if(!s.exists)throw new Error('Vínculo do estabelecimento não encontrado.');perfil=s.data()||{};if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw new Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw new Error('A URL não corresponde à loja autenticada.');ref=x.db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);await lerServidorEPreencher();}catch(e){el('msg').innerHTML='<div class="bad">'+esc(e.message||e)+'</div>';el('salvar').disabled=true}}async function salvarConfig(){if(!ref)return;const cat=el('categoria').value.trim(),tel=el('telefoneLoja').value.trim(),end=el('enderecoLoja').value.trim(),ha=el('horarioAbertura').value,hf=el('horarioFechamento').value,tx=Number(el('taxaEntrega').value||0),raio=Number(el('raioEntregaKm').value||0),aberta=el('aceitandoPedidos').checked===true;if(cat.length<2){el('msg').innerHTML='<div class="bad">Informe a categoria da loja.</div>';return}if(tx<0||raio<0){el('msg').innerHTML='<div class="bad">Taxa e raio não podem ser negativos.</div>';return}el('salvar').disabled=true;el('salvar').textContent='Salvando...';el('msg').innerHTML='';try{await ref.update({aceitandoPedidos:aberta,categoria:cat,telefoneLoja:tel,enderecoLoja:end,horarioAbertura:ha,horarioFechamento:hf,taxaEntrega:tx,raioEntregaKm:raio,operacaoAtualizadaEm:firebase.firestore.FieldValue.serverTimestamp()});const v=await lerServidorEPreencher();if(v.aceitandoPedidos!==aberta)throw new Error('O servidor não confirmou o estado solicitado. Esperado '+aberta+' e retornou '+String(v.aceitandoPedidos)+'.');el('msg').innerHTML='<div class="ok">Configurações salvas e confirmadas no servidor ✅<br>aceitandoPedidos = <b>'+String(v.aceitandoPedidos)+'</b></div>';}catch(e){el('msg').innerHTML='<div class="bad">Não foi possível confirmar a gravação: '+esc(e.message||e)+'</div>';}finally{el('salvar').disabled=false;el('salvar').textContent='Salvar configurações';}}iniciar();</script></body></html>
