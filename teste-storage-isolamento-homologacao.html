<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Storage · Interfood Homologação</title>
<style>
body{margin:0;background:#07101f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#101827;border:1px solid #2b3648;border-radius:14px;padding:18px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.btn[disabled]{opacity:.55}.ok{color:#7df0a5}.bad{color:#ff8b9b}.muted{color:#aab4c4;font-size:13px}.linha{padding:10px 0;border-bottom:1px solid #263247}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h2>Teste de isolamento do Firebase Storage</h2>
<p class="muted">HOMOLOGAÇÃO. Não altera produção. Cria apenas arquivos temporários de teste.</p>
<div id="status" class="linha muted">Página carregada. Clique no botão.</div>
<button id="btn" class="btn" type="button" onclick="executarTesteStorage()">Executar teste</button>
<div id="out"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script src="firebase-interfood-config-teste.js?v=2026.09.09.2"></script>
<script>
const $=id=>document.getElementById(id);
function linha(texto,classe){const d=document.createElement('div');d.className='linha '+(classe||'');d.textContent=texto;$('out').appendChild(d)}
function erroTexto(e){return String((e&&e.code)||(e&&e.message)||e||'erro desconhecido')}

async function aguardarUsuario(auth){
  if(auth.currentUser)return auth.currentUser;
  return new Promise((resolve,reject)=>{
    let off=null;
    const timer=setTimeout(()=>{if(off)off();reject(new Error('Sessão não encontrada. Entre novamente como estabelecimento.'))},8000);
    off=auth.onAuthStateChanged(u=>{clearTimeout(timer);if(off)off();u?resolve(u):reject(new Error('Faça login como estabelecimento antes do teste.'))},e=>{clearTimeout(timer);if(off)off();reject(e)});
  });
}

window.executarTesteStorage=async function(){
  const btn=$('btn');
  btn.disabled=true;btn.textContent='Executando...';$('out').innerHTML='';
  try{
    $('status').textContent='Iniciando teste...';$('status').className='linha muted';
    if(!window.firebase)throw new Error('Firebase não carregou.');
    if(typeof firebase.storage!=='function')throw new Error('Firebase Storage não carregou.');
    const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;
    if(!cfg||cfg.projectId!=='interliga-homologacao-eb0f2')throw new Error('Configuração de homologação inválida.');

    const nomeApp='interligaEstabelecimentoHomologacao';
    let app=(firebase.apps||[]).find(a=>a.name===nomeApp);
    if(!app)app=firebase.initializeApp(cfg,nomeApp);
    const auth=app.auth(),db=app.firestore(),storage=app.storage();
    const u=await aguardarUsuario(auth);
    const s=await db.collection('usuariosEstabelecimentos').doc(u.uid).get();
    if(!s.exists)throw new Error('Vínculo do estabelecimento não encontrado.');
    const p=s.data()||{};
    if(p.ativo!==true||p.perfil!=='estabelecimento'||!p.franquiaId||!p.lojaId)throw new Error('Perfil não autorizado.');

    linha('Conta autenticada: '+(u.email||u.uid));
    linha('Loja vinculada: '+p.franquiaId+' / '+p.lojaId);

    const bytes=new Uint8Array([137,80,78,71,13,10,26,10,0,0,0,0]);
    const meta={contentType:'image/png'};
    const ts=Date.now();
    const base=`interfood/${p.franquiaId}/estabelecimentos`;
    const proprio=`${base}/${p.lojaId}/produtos/__teste_storage_${ts}/foto`;
    const outro=`${base}/__loja_nao_autorizada__/produtos/__teste_storage_${ts}/foto`;
    const txt=`${base}/${p.lojaId}/produtos/__teste_storage_${ts}/arquivo.txt`;

    const refProprio=storage.ref(proprio);
    try{
      await refProprio.put(bytes,meta);
      linha('1. Escrita na própria loja: PERMITIDA ✅','ok');
      await refProprio.delete();
      linha('2. Limpeza do temporário: CONCLUÍDA ✅','ok');
    }catch(e){
      linha('1. Escrita na própria loja: BLOQUEADA ❌ — '+erroTexto(e),'bad');
      throw e;
    }

    try{
      await storage.ref(outro).put(bytes,meta);
      linha('3. Outra loja: INDEVIDAMENTE PERMITIDA ❌','bad');
      try{await storage.ref(outro).delete()}catch(_){ }
    }catch(e){linha('3. Outra loja: BLOQUEADA ✅ — '+erroTexto(e),'ok')}

    try{
      await storage.ref(txt).putString('teste','raw',{contentType:'text/plain'});
      linha('4. Arquivo não-imagem: INDEVIDAMENTE PERMITIDO ❌','bad');
      try{await storage.ref(txt).delete()}catch(_){ }
    }catch(e){linha('4. Arquivo não-imagem: BLOQUEADO ✅ — '+erroTexto(e),'ok')}

    $('status').textContent='Teste concluído. Envie um print.';$('status').className='linha ok';
  }catch(e){
    $('status').textContent='Falha: '+erroTexto(e);$('status').className='linha bad';
    linha('Detalhe: '+erroTexto(e),'bad');
  }finally{btn.disabled=false;btn.textContent='Executar teste'}
};
</script>
</body>
</html>
