<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente Interfood · Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:460px;margin:5vh auto;padding:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}.test{color:#65e89a;font-size:12px;margin-bottom:16px}.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#172235;color:#fff;margin:7px 0}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--p);color:#fff;font-weight:900;margin-top:10px;cursor:pointer}.sec{background:#334155}.msg{font-size:13px;margin-top:12px;min-height:18px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border-radius:9px;border:1px solid var(--bd);background:#172235;color:#fff;cursor:pointer}.tab.ativa{border-color:var(--p)}.hidden{display:none}.small{font-size:12px;color:var(--muted)}</style></head><body><div class="wrap"><div class="card"><h2>Cliente · Interfood</h2><div class="test">AMBIENTE DE HOMOLOGAÇÃO — conta do cliente isolada no Firebase de teste.</div><div class="tabs"><button id="tLogin" class="tab ativa" onclick="aba('login')">Entrar</button><button id="tCadastro" class="tab" onclick="aba('cadastro')">Criar conta</button></div><div id="login"><input id="emailLogin" class="inp" type="email" placeholder="E-mail"><input id="senhaLogin" class="inp" type="password" placeholder="Senha"><button class="btn" onclick="entrar()">Entrar</button><button class="btn sec" onclick="resetar()">Esqueci minha senha</button></div><div id="cadastro" class="hidden"><input id="nome" class="inp" placeholder="Nome completo"><input id="telefone" class="inp" placeholder="Telefone"><input id="emailCad" class="inp" type="email" placeholder="E-mail"><input id="senhaCad" class="inp" type="password" placeholder="Senha (mínimo 6 caracteres)"><button class="btn" onclick="cadastrar()">Criar conta</button></div><div id="msg" class="msg"></div><p class="small">Após entrar, você poderá fazer e acompanhar seus pedidos.</p></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore(),msg=document.getElementById('msg');const q=new URLSearchParams(location.search),dest=q.get('destino')||'painel-cliente-interfood-homologacao.html?franquia=candeias&loja=ljc6GjET9wAoBBdQNE8g&nome=TESTE%20TESTE';function aba(x){document.getElementById('login').classList.toggle('hidden',x!=='login');document.getElementById('cadastro').classList.toggle('hidden',x!=='cadastro');document.getElementById('tLogin').classList.toggle('ativa',x==='login');document.getElementById('tCadastro').classList.toggle('ativa',x==='cadastro');msg.textContent=''}async function entrar(){msg.textContent='Entrando...';try{await auth.signInWithEmailAndPassword(emailLogin.value.trim(),senhaLogin.value);location.href=dest}catch(e){msg.textContent='Não foi possível entrar: '+(e.message||e)}}async function cadastrar(){msg.textContent='Criando conta...';try{const n=nome.value.trim(),t=telefone.value.trim(),e=emailCad.value.trim(),s=senhaCad.value;if(n.length<2)throw new Error('Informe seu nome.');const c=await auth.createUserWithEmailAndPassword(e,s);await db.collection('clientes').doc(c.user.uid).set({nome:n,telefone:t,email:e,ativo:true,perfil:'cliente',criadoEm:firebase.firestore.FieldValue.serverTimestamp()});location.href=dest}catch(e){msg.textContent='Não foi possível criar a conta: '+(e.message||e)}}async function resetar(){const e=emailLogin.value.trim();if(!e){msg.textContent='Digite seu e-mail primeiro.';return}try{await auth.sendPasswordResetEmail(e);msg.textContent='E-mail de redefinição enviado.'}catch(x){msg.textContent='Não foi possível enviar: '+(x.message||x)}}auth.onAuthStateChanged(u=>{if(u&&!u.isAnonymous)msg.textContent='Sessão de cliente ativa: '+u.email});</script></body></html>
