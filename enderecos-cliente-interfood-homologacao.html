<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endereços · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:820px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);margin-bottom:12px}label{display:block;margin:10px 0 6px;color:var(--muted);font-size:13px}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0a1322;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.sec{background:#334155}.danger{background:#b42318}.okbtn{background:#16803c}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.ok{color:#62e993}.bad{color:#ff7188}.principal{display:inline-block;margin-left:8px;padding:4px 7px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="top">Interfood · Endereços</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — endereços vinculados somente à conta autenticada.</div><div class="card"><h3 id="tituloForm">Novo endereço</h3><div class="grid"><div><label>Apelido</label><input id="apelido" placeholder="Casa, Trabalho..."></div><div><label>CEP</label><input id="cep" maxlength="12"></div></div><label>Endereço</label><input id="logradouro" placeholder="Rua, avenida, número"><div class="grid"><div><label>Bairro</label><input id="bairro"></div><div><label>Cidade</label><input id="cidade"></div></div><div class="grid"><div><label>UF</label><input id="uf" maxlength="2"></div><div><label>Complemento</label><input id="complemento"></div></div><label style="display:flex;align-items:center;gap:8px"><input id="principal" type="checkbox" style="width:auto"> Usar como endereço principal</label><button class="btn" id="salvar" onclick="salvarEndereco()">Salvar endereço</button> <button class="btn sec" id="cancelarEdicao" onclick="limparForm()" style="display:none">Cancelar edição</button> <button class="btn sec" onclick="voltar()">Voltar</button><div id="msg"></div></div><div id="lista"><div class="card">Carregando endereços...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nomeLoja=q.get('nome')||'TESTE TESTE';let cache={},editandoId=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function voltar(){location.href='painel-cliente-interfood-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nomeLoja)}auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){location.href='login-cliente-firebase-teste.html';return}const p=await db.collection('clientes').doc(u.uid).get();if(!p.exists||p.data().ativo!==true||p.data().perfil!=='cliente'){lista.innerHTML='<div class="card bad">Cliente sem acesso ativo.</div>';return}db.collection('clientes').doc(u.uid).collection('enderecos').orderBy('criadoEm','desc').onSnapshot(render,e=>lista.innerHTML='<div class="card bad">'+esc(e.message||e)+'</div>')});function render(s){cache={};s.forEach(d=>cache[d.id]=d.data());if(s.empty){lista.innerHTML='<div class="card small">Nenhum endereço salvo ainda.</div>';return}lista.innerHTML=s.docs.map(d=>{const x=d.data();const linha=[x.logradouro,x.bairro,x.cidade,x.uf].filter(Boolean).join(' · ');return '<div class="card"><div class="row"><div><b>'+esc(x.apelido||'Endereço')+'</b>'+(x.principal?'<span class="principal">PRINCIPAL</span>':'')+'<div style="margin-top:6px">'+esc(linha)+'</div><div class="small">CEP: '+esc(x.cep||'-')+(x.complemento?' · '+esc(x.complemento):'')+'</div></div><div class="actions"><button class="btn sec" onclick="editar(\''+d.id+'\')">Editar</button>'+(x.principal?'':'<button class="btn okbtn" onclick="definirPrincipal(\''+d.id+'\')">Definir principal</button>')+'<button class="btn danger" onclick="excluir(\''+d.id+'\')">Excluir</button></div></div></div>'}).join('')}function editar(id){const x=cache[id];if(!x)return;editandoId=id;tituloForm.textContent='Editar endereço';apelido.value=x.apelido||'';cep.value=x.cep||'';logradouro.value=x.logradouro||'';bairro.value=x.bairro||'';cidade.value=x.cidade||'';uf.value=x.uf||'';complemento.value=x.complemento||'';principal.checked=x.principal===true;cancelarEdicao.style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function limparForm(){editandoId=null;tituloForm.textContent='Novo endereço';apelido.value=cep.value=logradouro.value=bairro.value=cidade.value=uf.value=complemento.value='';principal.checked=false;cancelarEdicao.style.display='none';msg.innerHTML=''}async function desligarOutrosPrincipal(exceto){const u=auth.currentUser,s=await db.collection('clientes').doc(u.uid).collection('enderecos').where('principal','==',true).get(),ops=[];s.forEach(d=>{if(d.id!==exceto)ops.push(d.ref.update({principal:false,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()}))});await Promise.all(ops)}async function salvarEndereco(){const u=auth.currentUser;if(!u)return;const a=apelido.value.trim(),c=cep.value.trim(),l=logradouro.value.trim(),b=bairro.value.trim(),ci=cidade.value.trim(),uF=uf.value.trim().toUpperCase(),co=complemento.value.trim(),pr=principal.checked;if(a.length<2||l.length<4||ci.length<2||uF.length!==2){msg.innerHTML='<div class="bad">Preencha apelido, endereço, cidade e UF corretamente.</div>';return}salvar.disabled=true;try{const col=db.collection('clientes').doc(u.uid).collection('enderecos');if(editandoId){if(pr)await desligarOutrosPrincipal(editandoId);await col.doc(editandoId).update({apelido:a,cep:c,logradouro:l,bairro:b,cidade:ci,uf:uF,complemento:co,principal:pr,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<div class="ok">Endereço atualizado ✅</div>'}else{const ref=col.doc();if(pr)await desligarOutrosPrincipal(ref.id);await ref.set({apelido:a,cep:c,logradouro:l,bairro:b,cidade:ci,uf:uF,complemento:co,principal:pr,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<div class="ok">Endereço salvo ✅</div>'}limparForm()}catch(e){msg.innerHTML='<div class="bad">Não foi possível salvar: '+esc(e.message||e)+'</div>'}finally{salvar.disabled=false}}async function definirPrincipal(id){try{await desligarOutrosPrincipal(id);await db.collection('clientes').doc(auth.currentUser.uid).collection('enderecos').doc(id).update({principal:true,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert(e.message||e)}}async function excluir(id){if(!confirm('Excluir este endereço?'))return;try{await db.collection('clientes').doc(auth.currentUser.uid).collection('enderecos').doc(id).delete();if(editandoId===id)limparForm()}catch(e){alert(e.message||e)}}</script></body></html>
