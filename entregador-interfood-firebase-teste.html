<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entregador Interfood Firebase</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{padding:16px 20px;background:var(--p);font-weight:900}.wrap{max-width:900px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #22c55e66;background:#22c55e15;color:#65e89a;border-radius:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:12px;color:#9da9ba}.badge{padding:6px 9px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin:10px 8px 0 0}.danger{background:#b42318}.secondary{background:#334155}.empty{text-align:center;padding:28px}.ok{color:#65e89a;font-size:12px}.warn{color:#fbbf24;font-size:12px;margin-top:8px}.loading{display:flex;gap:10px;align-items:center}.spinner{width:18px;height:18px;border:3px solid #334155;border-top-color:var(--p);border-radius:50%;animation:girar .8s linear infinite}.alertBox{display:none;position:sticky;top:8px;z-index:20;background:#7c2d12;border:2px solid #fb923c;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 8px 28px #0008}.alertBox.on{display:flex;justify-content:space-between;gap:12px;align-items:center;animation:pulse 1.1s infinite}.alertTitle{font-size:18px;font-weight:900}.alertSub{font-size:12px;color:#fed7aa;margin-top:3px}@keyframes girar{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 0 5px #fb923c44}}@media(max-width:600px){.row{flex-direction:column;align-items:flex-start}.btn{width:100%}.alertBox.on{align-items:stretch;flex-direction:column}}</style></head><body><div class="top">Entregador · Interfood</div><div class="wrap"><div class="test">HOMOLOGAÇÃO — entregador autenticado, limitado à própria franquia e às transições autorizadas.</div><div id="alertBox" class="alertBox"><div><div id="alertTitle" class="alertTitle">🔔 Nova entrega disponível</div><div id="alertSub" class="alertSub">Há um pedido pronto para retirada.</div></div><button class="btn secondary" onclick="silenciarAlerta()">Entendi</button></div><div id="perfil" class="card">Validando acesso...</div><div id="app"><div class="card loading"><div class="spinner"></div><span>Carregando entregas ativas...</span></div></div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;const app=firebase.apps.find(a=>a.name==='interligaEntregadorHomologacao')||firebase.initializeApp(cfg,'interligaEntregadorHomologacao');const auth=app.auth(),db=app.firestore();const qs=new URLSearchParams(location.search),fid=qs.get('franquia');let perfil=null,unsubs=[],lojas=[],pedidosPorLoja=new Map(),statusAnteriores=new Map(),lojasInicializadas=new Set(),somAtivo=false,audioCtx=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function actionFor(s){return s==='Pronto'?['Aceitar entrega','Entregador aceitou','aceitoEm']:s==='Entregador aceitou'?['Confirmar coleta','Coletado','coletadoEm']:s==='Coletado'?['Iniciar entrega','Saiu para entrega','saiuEntregaEm']:s==='Saiu para entrega'?['Confirmar entrega','Concluído','concluidoEm']:null}function refPedido(lojaId,pedidoId){return db.collection('franquias').doc(fid).collection('estabelecimentos').doc(lojaId).collection('pedidos').doc(pedidoId)}async function mudar(lojaId,pedidoId,statusAtual){const a=actionFor(statusAtual);if(!a)return;const patch={status:a[1]};patch[a[2]]=firebase.firestore.FieldValue.serverTimestamp();if(statusAtual==='Pronto')patch.entregador={uid:auth.currentUser.uid,nome:perfil.nome||auth.currentUser.email,veiculo:perfil.veiculo||'',placa:perfil.placa||''};try{await refPedido(lojaId,pedidoId).update(patch)}catch(e){alert('Operação bloqueada: '+(e.message||e));}}async function desistir(lojaId,pedidoId){const motivo=prompt('Informe o motivo da desistência desta entrega:');if(motivo===null)return;const m=motivo.trim();if(m.length<3||m.length>300)return alert('Informe um motivo entre 3 e 300 caracteres.');if(!confirm('Confirmar desistência? O pedido voltará a ficar disponível para outro entregador.'))return;try{await refPedido(lojaId,pedidoId).update({status:'Pronto',entregador:firebase.firestore.FieldValue.delete(),motivoDesistenciaEntrega:m,desistiuEntregaEm:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert('Desistência bloqueada: '+(e.message||e));}}async function reportarProblema(lojaId,pedidoId,statusAtual){const motivo=prompt('Descreva o problema com a entrega:');if(motivo===null)return;const m=motivo.trim();if(m.length<3||m.length>300)return alert('Informe um problema entre 3 e 300 caracteres.');try{await refPedido(lojaId,pedidoId).update({incidenteEntrega:{uid:auth.currentUser.uid,nome:perfil.nome||auth.currentUser.email,motivo:m,statusNoMomento:statusAtual},incidenteEntregaEm:firebase.firestore.FieldValue.serverTimestamp()});alert('Problema registrado. A entrega continua atribuída a você até tratamento operacional.')}catch(e){alert('Registro bloqueado: '+(e.message||e));}}async function ativarAlertas(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();somAtivo=true;if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();const b=$('alertasBtn');if(b)b.textContent='🔔 Alertas ativados';tocarSom()}catch(e){alert('Não foi possível ativar os alertas neste navegador.')}}function tocarSom(){if(!somAtivo||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(880,audioCtx.currentTime);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45);o.start();o.stop(audioCtx.currentTime+.45)}catch(e){}}function dispararAlerta(p,lojaNome){$('alertTitle').textContent='🔔 Nova entrega disponível';$('alertSub').textContent='Pedido '+(p.numero||p.id)+' · Retirada: '+(lojaNome||'Estabelecimento');$('alertBox').classList.add('on');document.title='🔔 NOVA ENTREGA · Interfood';tocarSom();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Interfood · Nova entrega',{body:'Pedido '+(p.numero||p.id)+' pronto para retirada em '+(lojaNome||'estabelecimento'),tag:'interfood-entrega-'+p.id})}catch(e){}}}function silenciarAlerta(){$('alertBox').classList.remove('on');document.title='Entregador Interfood Firebase'}function render(){let itens=[];for(const l of lojas){const ps=pedidosPorLoja.get(l.id)||[];for(const p of ps){if(p.status==='Pronto'||p.entregador?.uid===auth.currentUser.uid)itens.push({id:p.id,lojaId:l.id,loja:l.nome||l.id,...p});}}itens.sort((a,b)=>String(a.numero||a.id).localeCompare(String(b.numero||b.id)));$('app').innerHTML=itens.length?itens.map(p=>{const a=actionFor(p.status),meu=p.entregador?.uid===auth.currentUser.uid;return '<div class="card"><div class="row"><div><b>Pedido '+esc(p.numero||p.id)+'</b><div class="small">Retirada: '+esc(p.loja)+' · Cliente: '+esc(p.cliente||'-')+'</div></div><span class="badge">'+esc(p.status)+'</span></div><div class="small">Valor: R$ '+Number(p.valor||0).toFixed(2).replace('.',',')+'</div>'+(p.endereco?'<div class="small">Entrega: '+esc(p.endereco)+'</div>':'')+(p.entregador?'<p class="ok">Atribuído a '+esc(p.entregador.nome)+'</p>':'')+(p.motivoDesistenciaEntrega?'<div class="warn">Última desistência: '+esc(p.motivoDesistenciaEntrega)+'</div>':'')+(p.incidenteEntrega&&meu?'<div class="warn">⚠ Problema registrado: '+esc(p.incidenteEntrega.motivo||'')+'</div>':'')+(a?'<button class="btn" onclick="mudar(\''+esc(p.lojaId)+'\',\''+esc(p.id)+'\',\''+esc(p.status)+'\')">'+a[0]+'</button>':'')+(p.status==='Entregador aceitou'&&meu?'<button class="btn danger" onclick="desistir(\''+esc(p.lojaId)+'\',\''+esc(p.id)+'\')">Desistir da entrega</button>':'')+((p.status==='Coletado'||p.status==='Saiu para entrega')&&meu?'<button class="btn secondary" onclick="reportarProblema(\''+esc(p.lojaId)+'\',\''+esc(p.id)+'\',\''+esc(p.status)+'\')">Reportar problema</button>':'')+'</div>'}).join(''):'<div class="card empty">Nenhuma entrega disponível para esta franquia.</div>';}function pararTempoReal(){unsubs.forEach(fn=>{try{fn()}catch(e){}});unsubs=[];pedidosPorLoja.clear();statusAnteriores.clear();lojasInicializadas.clear()}async function iniciarTempoReal(){pararTempoReal();$('app').innerHTML='<div class="card loading"><div class="spinner"></div><span>Carregando entregas ativas...</span></div>';const snap=await db.collection('franquias').doc(fid).collection('estabelecimentos').get({source:'server'});lojas=snap.docs.map(d=>({id:d.id,nome:d.data().nome||d.id,ref:d.ref}));if(!lojas.length){render();return}let carregadas=0;for(const l of lojas){const q=l.ref.collection('pedidos').where('status','in',['Pronto','Entregador aceitou','Coletado','Saiu para entrega']);const off=q.onSnapshot(ps=>{const atual=ps.docs.map(p=>({id:p.id,...p.data()}));pedidosPorLoja.set(l.id,atual);const primeira=!lojasInicializadas.has(l.id);for(const p of atual){const chave=l.id+'::'+p.id,antes=statusAnteriores.get(chave);if(!primeira&&p.status==='Pronto'&&antes!=='Pronto')dispararAlerta(p,l.nome);statusAnteriores.set(chave,p.status)}lojasInicializadas.add(l.id);carregadas++;if(carregadas>=lojas.length||pedidosPorLoja.size===lojas.length)render()},e=>{$('app').innerHTML='<div class="card"><div class="warn">Não foi possível acompanhar as entregas de '+esc(l.nome)+': '+esc(e.message||e)+'</div></div>'});unsubs.push(off)}}auth.onAuthStateChanged(async u=>{if(!u){pararTempoReal();location.href='login-entregador-firebase-teste.html?v=2026.09.05.1';return}try{const s=await db.collection('usuariosEntregadores').doc(u.uid).get({source:'server'});if(!s.exists)throw new Error('Perfil não encontrado');perfil=s.data();if(perfil.ativo!==true||perfil.perfil!=='entregador'||perfil.franquiaId!==fid)throw new Error('Acesso incompatível com a franquia');$('perfil').innerHTML='<b>'+esc(perfil.nome||u.email)+'</b><div class="small">Franquia: '+esc(fid)+' · '+esc(perfil.veiculo||'')+' '+esc(perfil.placa||'')+'</div><div class="small">Atualização de entregas em tempo real.</div><button id="alertasBtn" class="btn secondary" onclick="ativarAlertas()">🔔 Ativar alertas</button><button class="btn secondary" onclick="auth.signOut()">Sair</button>';await iniciarTempoReal()}catch(e){pararTempoReal();$('perfil').textContent='Acesso bloqueado: '+(e.message||e);}});</script></body></html>
