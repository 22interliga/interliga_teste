<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comissões Interfood · Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;border-radius:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.row{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #243047}.row:last-child{border:0}.inp{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px;width:100%}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.btn2{background:#3c4b61}.actions{display:flex;gap:8px;margin-bottom:14px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#22c55e1c;color:#86efac;font-size:11px}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .loja{grid-column:1/-1}}</style></head><body><div class="top"><div class="brand" id="brand">Comissões · Interfood</div><div class="sub" id="city">Homologação</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — configuração financeira limitada à franquia autenticada. Produção não é alterada.</div><div class="actions"><button class="btn btn2" onclick="voltar()">← Voltar ao financeiro</button></div><div id="app"><div class="card">Carregando estabelecimentos...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k),APP_NAME='interligaFranqueadoHomologacao';let app,auth,db,perfil,lojas=[],taxaPadrao=12;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function voltar(){location.href='financeiro-interfood-franqueado-homologacao.html?franquia='+encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}function render(){const linhas=lojas.map(l=>{const propria=Number(l.taxaComissaoInterfood??l.taxaInterfood),tem=Number.isFinite(propria)&&propria>=0,t=tem?propria:taxaPadrao;return'<div class="row"><div class="loja"><b>'+esc(l.nome||l.id)+'</b><div class="small">'+esc(l.categoria||'Estabelecimento')+'</div></div><div><div class="small">Taxa aplicada</div><span class="pill">'+t.toLocaleString('pt-BR')+'%</span><div class="small">'+(tem?'Taxa própria':'Usando taxa padrão')+'</div></div><div><div class="small">Nova taxa (%)</div><input id="t-'+l.id+'" class="inp" type="number" min="0" max="100" step="0.01" value="'+(tem?propria:'')+'" placeholder="'+taxaPadrao+'"></div><button class="btn" onclick="salvar(\''+l.id+'\')">Salvar</button></div>'}).join('');$('app').innerHTML='<div class="card"><b>Taxa padrão da franquia: '+taxaPadrao.toLocaleString('pt-BR')+'%</b><div class="small" style="margin-top:5px">Uma taxa própria da loja substitui a taxa padrão apenas para aquele estabelecimento.</div></div><div class="card">'+linhas+'</div>'}async function salvar(id){const el=$('t-'+id),txt=el.value.trim().replace(',','.');if(!txt){alert('Informe uma taxa entre 0 e 100.');return}const n=Number(txt);if(!Number.isFinite(n)||n<0||n>100){alert('Taxa inválida. Use um valor entre 0 e 100.');return}if(!confirm('Confirmar comissão de '+n.toLocaleString('pt-BR')+'% para este estabelecimento?'))return;try{await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(id).update({taxaComissaoInterfood:n,taxaComissaoInterfoodAtualizadaEm:firebase.firestore.FieldValue.serverTimestamp(),taxaComissaoInterfoodAtualizadaPor:auth.currentUser.uid});alert('Comissão salva na homologação.');const l=lojas.find(x=>x.id===id);if(l){l.taxaComissaoInterfood=n;l.taxaComissaoInterfoodAtualizadaPor=auth.currentUser.uid}render()}catch(e){alert('Não foi possível salvar: '+e.message)}}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});const ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');$('brand').textContent='Comissões · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId;const fs=await db.collection('franquias').doc(perfil.franquiaId).get({source:'server'});if(fs.exists){const d=fs.data()||{},n=Number(d.taxaInterfood??d.taxa);if(Number.isFinite(n)&&n>=0)taxaPadrao=n}const es=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();lojas=es.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));render()}catch(e){$('app').innerHTML='<div class="card"><h2>Acesso bloqueado</h2><p>'+esc(e.message||e)+'</p></div>'}}carregar();</script></body></html>
