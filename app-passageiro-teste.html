<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passageiro — Teste Franquia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07101f;color:#fff}.top{padding:18px;background:#1270c2;display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:13px;background:#fff;display:grid;place-items:center;color:#111;overflow:hidden;font-weight:900}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.8}.wrap{max-width:520px;margin:auto;padding:18px}.test{padding:10px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:14px}.card{background:#101827;border:1px solid #2b3648;border-radius:18px;padding:18px;margin-bottom:14px}.status{font-size:25px;font-weight:900}.ok{color:#45d483}.warn{color:#ffd166}.bad{color:#ff5c7a}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#1270c2;color:#fff;font-weight:900;margin-top:10px}.lock{text-align:center;padding:35px 18px}.lock .icon{font-size:55px}.small{font-size:12px;color:#9da9ba}.inp{width:100%;padding:13px;background:#182235;border:1px solid #344258;color:#fff;border-radius:11px;margin:7px 0}.debug{display:none;padding:10px;border:1px solid #ff5c7a;border-radius:10px;color:#ff9bad}</style></head><body><div class="top"><div id="logo" class="logo">IL</div><div><div id="brand" class="brand">Passageiro</div><div id="city" class="sub"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — franquia fixa por este link.</div><div id="debug" class="debug"></div><div id="content"></div></div><script>(function(){function el(id){return document.getElementById(id)}function idDoLink(){var p=new URLSearchParams(location.search),id=p.get('franquia');return id||localStorage.getItem('interliga_franquia_atual')||'madre'}function franquiaAtual(){var id=idDoLink(),d={};try{d=JSON.parse(localStorage.getItem('interliga_franquia_'+id)||'{}')||{}}catch(e){}d._id=id;return d}function mensalidade(id){try{return JSON.parse(localStorage.getItem('interliga_mensalidade_'+id)||'{}')||{}}catch(e){return{}}}function statusApps(m){if(m.pago===true)return'liberado';if(!m.vencimento)return'liberado';var h=new Date();h.setHours(0,0,0,0);var v=new Date(m.vencimento+'T00:00:00'),d=Math.floor((h-v)/86400000);return d>2?'bloqueado':d>0?'carencia':'liberado'}function render(){try{var c=franquiaAtual(),m=mensalidade(c._id),s=statusApps(m),nome=c.nomeApp||('Interliga '+c._id),cidade=c.cidade||c._id;el('brand').textContent=nome;el('city').textContent='Passageiro · '+cidade;var logo=c.logoData||c.logoUrl||'';el('logo').innerHTML=logo?'<img alt="Logo" src="'+String(logo).replace(/"/g,'&quot;')+'">':'IL';var cor=c.coresAreas&&c.coresAreas.header?c.coresAreas.header:(c.corPrimaria||'#1270c2');document.querySelector('.top').style.background=cor;if(s==='bloqueado')el('content').innerHTML='<div class="card lock"><div class="icon">🔒</div><div class="status bad">Operação temporariamente indisponível</div><p>O serviço de mobilidade desta franquia está temporariamente indisponível.</p><p class="small">Tente novamente mais tarde ou entre em contato com o suporte local.</p></div>';else el('content').innerHTML='<div class="card"><div class="status '+(s==='carencia'?'warn':'ok')+'">'+(s==='carencia'?'Serviço disponível':'Para onde vamos?')+'</div><p class="small">'+(s==='carencia'?'A operação permanece ativa durante a carência da franquia.':'Solicitação liberada nesta base.')+'</p><input class="inp" placeholder="Local de embarque"><input class="inp" placeholder="Destino"><button class="btn">Solicitar corrida</button></div>'}catch(e){el('debug').style.display='block';el('debug').textContent='Falha no teste: '+e.message}}render();window.addEventListener('storage',render)})();</script></body></html>
