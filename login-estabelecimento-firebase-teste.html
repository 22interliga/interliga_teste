<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Firebase — Interfood Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(460px,92vw);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px}.brand{font-size:24px;font-weight:900}.sub{font-size:12px;color:#9da9ba}.notice{margin:15px 0;padding:10px;border-radius:10px;background:#22c55e18;border:1px solid #22c55e66;color:#8ff0ae}.inp{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:#172235;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.err{display:none;margin-top:12px;color:#ff7188;font-size:13px}.ok{display:none;margin-top:12px;color:#62e993;font-size:13px}</style></head><body><div class="box"><div class="brand">Interfood · Homologação</div><div class="sub">Autenticação Firebase real — projeto separado da produção</div><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — acesso validado pelo Firebase Authentication + Firestore Rules.</div><label>E-mail</label><input id="email" class="inp" type="email" autocomplete="username" placeholder="E-mail do estabelecimento"><label>Senha</label><input id="senha" class="inp" type="password" autocomplete="current-password" placeholder="Senha"><button id="btn" class="btn">Entrar com Firebase</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const $=x=>document.getElementById(x);function msg(el,t){el.textContent=t;el.style.display='block'}async function entrar(){const e=$('err'),o=$('ok'),b=$('btn');e.style.display=o.style.display='none';b.disabled=true;b.textContent='Validando...';try{const p=await InterfoodAuthTeste.login($('email').value.trim(),$('senha').value);msg(o,'Acesso autorizado pelo Firebase. Abrindo loja vinculada...');setTimeout(()=>location.href='painel-estabelecimento-firebase-teste.html?franquia='+encodeURIComponent(p.franquiaId)+'&loja='+encodeURIComponent(p.lojaId),450)}catch(x){console.error(x);let t='Não foi possível entrar.';if(x.code==='auth/invalid-credential'||x.code==='auth/wrong-password'||x.code==='auth/user-not-found')t='E-mail ou senha inválidos.';else if(x.message)t=x.message;msg(e,t)}finally{b.disabled=false;b.textContent='Entrar com Firebase'}}$('btn').onclick=entrar;document.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});</script></body></html>
