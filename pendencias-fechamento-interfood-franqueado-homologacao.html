<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendências de Fechamento · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.wrap{max-width:1180px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #f59e0b66;background:#f59e0b12;color:#fcd34d;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.num{font-size:24px;font-weight:900}.btn{border:0;border-radius:9px;padding:10px 13px;background:#3c4b61;color:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--p)}.actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.5fr .8fr .8fr .9fr .8fr;gap:8px;align-items:center;padding:11px 8px;border-bottom:1px solid #243047}.head{font-size:12px;color:#94a3b8;font-weight:700}.right{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f59e0b1c;color:#fbbf24;font-size:11px}.empty{text-align:center;color:var(--muted);padding:25px}.datebox{margin-top:6px;font-size:12px;color:#c7d2fe}@media(max-width:760px){.stats{grid-template-columns:1fr}.tr{grid-template-columns:1.4fr .8fr .8fr}.tr>*:nth-child(4),.tr>*:nth-child(5){display:none}}</style></head><body><div class="top"><div class="brand" id="brand">Pendências de Fechamento · Interfood</div><div class="sub" id="city">Homologação</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — mostra pedidos concluídos que ainda não entraram em nenhum fechamento. Pedidos já fechados não aparecem aqui.</div><div class="actions"><button class="btn" onclick="voltar()">← Voltar ao financeiro</button><button class="btn primary" onclick="abrirFechamentos()">Registrar fechamento</button></div><div id="app"><div class="card">Carregando pendências...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k),APP_NAME='interligaFranqueadoHomologacao',API='https://us-central1-interliga-homologacao-eb0f2.cloudfunctions.net/gerenciarFechamentosInterfood';let app,auth,perfil,lojas=[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function fid(){return encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}function voltar(){location.href='financeiro-interfood-franqueado-homologacao.html?franquia='+fid()}function abrirFechamentos(){location.href='registrar-fechamento-interfood-franqueado-homologacao.html?franquia='+fid()}async function api(body){const token=await auth.currentUser.getIdToken();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...body,franquiaId:perfil.franquiaId})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível concluir.');return j}async function carregarPendencias(){const linhas=[];let pedidos=0,vendas=0,lojasPend=0;for(const l of lojas){try{const j=await api({acao:'disponiveis',lojaId:l.id}),d=j.disponiveis||{},datas=Array.isArray(d.datas)?d.datas:[];const q=datas.reduce((a,x)=>a+Number(x.quantidadePedidos||0),0),v=datas.reduce((a,x)=>a+Number(x.vendas||0),0);if(q>0){lojasPend++;pedidos+=q;vendas+=v;linhas.push({loja:l,q,v,datas})}}catch(e){linhas.push({loja:l,erro:e.message})}}const html=linhas.filter(x=>x.q>0).map(x=>'<div class="tr"><div><b>'+esc(x.loja.nome||x.loja.id)+'</b><div class="datebox">'+x.datas.slice(0,5).map(d=>esc(d.data)+' · '+Number(d.quantidadePedidos||0)+' pedido(s)').join('<br>')+'</div></div><div>'+x.q+' pedido(s)</div><div class="right"><b>'+money(x.v)+'</b></div><div class="right"><span class="pill">A fechar</span></div><div class="right"><button class="btn" onclick="location.href=\'registrar-fechamento-interfood-franqueado-homologacao.html?franquia='+fid()+'\'">Fechar</button></div></div>').join('');$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+lojasPend+'</div><div class="small">Estabelecimentos com pendência</div></div><div class="card"><div class="num">'+pedidos+'</div><div class="small">Pedidos ainda não fechados</div></div><div class="card"><div class="num">'+money(vendas)+'</div><div class="small">Vendas aguardando fechamento</div></div></div><div class="card table"><div class="tr head"><div>Estabelecimento / datas</div><div>Pedidos</div><div class="right">Vendas</div><div class="right">Situação</div><div class="right">Ação</div></div>'+html+(html?'':'<div class="empty">Nenhuma pendência de fechamento encontrada.</div>')+'</div><div class="card small">Proteção ativa: o backend exclui desta lista todos os pedidos que já pertencem a algum fechamento, evitando duplo fechamento e duplo repasse.</div>'}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});const db=app.firestore(),ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');$('brand').textContent='Pendências de Fechamento · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId;const es=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();lojas=es.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));await carregarPendencias()}catch(e){$('app').innerHTML='<div class="card"><h2>Acesso bloqueado</h2><p>'+esc(e.message||e)+'</p></div>'}}carregar();</script></body></html>
