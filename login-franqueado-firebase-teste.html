<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Franqueado — Firebase Homologação</title><style>:root{--p:#1270c2;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding:20px}.card{width:min(460px,100%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px}.brand{font-size:24px;font-weight:900;margin-bottom:4px}.sub{font-size:12px;color:var(--muted);margin-bottom:18px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;border-radius:10px;margin-bottom:16px;font-size:13px}label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0b1423;color:#fff}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:13px;font-size:13px;line-height:1.5;word-break:break-word}.bad{color:#ff7188}.ok{color:#62e993}.diag{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:9px;background:#0b1423;color:#cbd5e1;font-size:12px;display:none}</style></head><body><div class="card"><div class="brand">Interliga · Franqueado</div><div class="sub">Firebase Homologação</div><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — autenticação Firebase e vínculo da franquia validados pelo UID.</div><form id="form" autocomplete="off"><label>E-mail do usuário criado no Authentication</label><input id="email" name="franqueado_email_teste" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" required><label>Senha</label><input id="senha" name="franqueado_senha_teste" type="password" autocomplete="new-password" required><button id="btn" type="submit">Entrar</button></form><div id="msg" class="msg"></div><div id="diag" class="diag"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x);let auth,db;function mostrarDiag(txt){$('diag').style.display='block';$('diag').textContent=txt}async function iniciar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw new Error('Configuração Firebase de homologação não carregada.');if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);setTimeout(()=>{$('email').value='';$('senha').value=''},120);$('form').addEventListener('submit',entrar)}catch(err){$('msg').className='msg bad';$('msg').textContent=err.message||String(err)}}async function validar(u){mostrarDiag('Firebase autenticou. UID: '+u.uid+' · verificando /franqueados/'+u.uid);const s=await db.collection('franqueados').doc(u.uid).get();if(!s.exists)throw new Error('Autenticação OK, mas não existe o documento /franqueados/'+u.uid+'.');const p=s.data()||{};mostrarDiag('UID: '+u.uid+' · perfil: '+String(p.perfil||'—')+' · franquiaId: '+String(p.franquiaId||'—')+' · ativo: '+String(p.ativo));if(p.ativo!==true)throw new Error('Documento encontrado, mas ativo precisa ser boolean true.');if(p.perfil!=='franqueado')throw new Error('Documento encontrado, mas perfil precisa ser franqueado.');if(!p.franquiaId)throw new Error('Documento encontrado, mas franquiaId está vazio.');return p}async function entrar(e){e.preventDefault();$('btn').disabled=true;$('btn').textContent='Entrando...';$('msg').textContent='';$('diag').style.display='none';const email=$('email').value.trim().toLowerCase();try{const cred=await auth.signInWithEmailAndPassword(email,$('senha').value);const p=await validar(cred.user);$('msg').className='msg ok';$('msg').textContent='Acesso autorizado. Abrindo painel da franquia '+p.franquiaId+'...';location.href='painel-franqueado-integrado.html?franquia='+encodeURIComponent(p.franquiaId)+'&v=a3c44c07'}catch(err){$('msg').className='msg bad';$('msg').textContent=err.message||String(err);$('btn').disabled=false;$('btn').textContent='Entrar'}}iniciar();</script></body></html>
