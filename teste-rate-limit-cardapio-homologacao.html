<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Rate Limit · Interfood</title><style>body{margin:0;background:#07101f;color:#fff;font-family:Arial,sans-serif}.top{background:#ff6b00;padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#101827;border:1px solid #2b3648;border-radius:14px;padding:18px;margin-bottom:14px}.ok{color:#86efac}.warn{color:#facc15}.bad{color:#fca5a5}.btn{border:0;border-radius:9px;padding:12px 15px;background:#ff6b00;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}input{display:block;margin:14px 0;color:#fff}.linha{padding:10px 0;border-top:1px solid #2b3648}.muted{color:#aab4c4;font-size:13px}</style></head><body><div class="top">Interfood · Teste 429</div><div class="wrap"><div class="card"><b>HOMOLOGAÇÃO</b><p class="muted">Este teste envia duas requisições quase ao mesmo tempo. A primeira pode seguir para a IA; a segunda deve ser bloqueada com HTTP 429 antes de chegar à IA.</p><div id="conta">Verificando sessão...</div><input id="arquivo" type="file" accept="image/jpeg,image/png,image/webp"><button id="btn" class="btn" onclick="testar()">Executar teste de rate limit</button></div><div class="card"><h3>Resultado</h3><div id="resultado">Aguardando teste.</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=20260909rate1"></script><script src="firebase-auth-interfood-teste.js?v=20260909rate1"></script><script>const ENDPOINT='https://us-central1-interliga-homologacao-eb0f2.cloudfunctions.net/analisarCardapioImagem';let auth,db,perfil;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function dataURL(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}async function iniciar(){try{({auth,db}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok(u):no(new Error('Faça login primeiro no estabelecimento TESTE TESTE.'))},no)});const s=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get();if(!s.exists)throw new Error('Vínculo do estabelecimento não encontrado.');perfil=s.data()||{};if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw new Error('Conta não autorizada.');$('conta').innerHTML='<span class="ok">Conta autenticada ✅</span><br>'+esc(auth.currentUser.email||'')+' · '+esc(perfil.franquiaId)+' / '+esc(perfil.lojaId)}catch(e){$('conta').innerHTML='<span class="bad">'+esc(e.message)+'</span>';$('btn').disabled=true}}async function chamada(imageBase64,token){const ini=performance.now();const resp=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({franquiaId:perfil.franquiaId,lojaId:perfil.lojaId,imageBase64})});let data={};try{data=await resp.json()}catch{}return {status:resp.status,ok:resp.ok,ms:Math.round(performance.now()-ini),erro:data.error||'',itens:Array.isArray(data.itens)?data.itens.length:null}}async function testar(){const f=$('arquivo').files&&$('arquivo').files[0];if(!f)return alert('Selecione uma imagem primeiro.');if(f.size>5*1024*1024)return alert('Use uma imagem de até 5 MB.');$('btn').disabled=true;$('resultado').innerHTML='Preparando...';try{const imageBase64=await dataURL(f);const token=await auth.currentUser.getIdToken(true);$('resultado').innerHTML='Disparando duas requisições com 250 ms de diferença...';const p1=chamada(imageBase64,token);await new Promise(r=>setTimeout(r,250));const p2=chamada(imageBase64,token);const [a,b]=await Promise.all([p1,p2]);const bloco=(x,n)=>'<div class="linha"><b>Requisição '+n+'</b><br>Status HTTP: <b>'+x.status+'</b> · '+x.ms+' ms'+(x.erro?'<br>Mensagem: '+esc(x.erro):'')+(x.itens!==null?'<br>Itens: '+x.itens:'')+'</div>';$('resultado').innerHTML=bloco(a,1)+bloco(b,2)+(b.status===429?'<p class="ok"><b>VALIDADO ✅</b> — a segunda requisição foi bloqueada com HTTP 429.</p>':'<p class="bad"><b>NÃO VALIDADO ❌</b> — a segunda requisição não retornou 429.</p>')}catch(e){$('resultado').innerHTML='<span class="bad">Falha no teste: '+esc(e.message)+'</span>'}finally{$('btn').disabled=false}}iniciar();</script></body></html>
