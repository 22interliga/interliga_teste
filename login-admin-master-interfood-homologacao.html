<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Master · Interfood Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(460px,92vw);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px}.brand{font-size:24px;font-weight:900}.test{margin:12px 0;padding:10px;border:1px solid #22c55e66;background:#22c55e18;color:#8ff0ae;border-radius:10px;font-size:12px}.inp{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:#172235;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.msg{font-size:13px;margin-top:12px;min-height:18px}.small{font-size:11px;color:var(--muted);margin-top:12px}</style></head><body><div class="box"><div class="brand">Interfood · Admin Master</div><div class="test">HOMOLOGAÇÃO — acesso global somente para conta previamente autorizada no Firebase.</div><label>E-mail</label><input id="email" class="inp" type="email" autocomplete="username"><label>Senha</label><input id="senha" class="inp" type="password" autocomplete="current-password"><button id="entrar" class="btn">Entrar</button><div id="msg" class="msg"></div><div class="small">A página não cria nem promove administradores. A autorização precisa existir previamente em <b>adminsMaster/{uid}</b>.</div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const $=id=>document.getElementById(id),cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaAdminMasterHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore(),msg=$('msg');async function validarAdmin(u){const s=await db.collection('adminsMaster').doc(u.uid).get({source:'server'});if(!s.exists)throw new Error('Conta não autorizada como Admin Master.');const p=s.data()||{};if(p.ativo!==true||p.perfil!=='adminMaster')throw new Error('Admin Master inativo ou inválido.');return p}async function entrar(){const b=$('entrar');b.disabled=true;b.textContent='Validando...';msg.textContent='';try{const c=await auth.signInWithEmailAndPassword($('email').value.trim(),$('senha').value);await validarAdmin(c.user);location.href='painel-admin-master-interfood-homologacao.html'}catch(e){await auth.signOut().catch(()=>{});msg.textContent='Acesso negado: '+(e.message||e)}finally{b.disabled=false;b.textContent='Entrar'}}$('entrar').onclick=entrar;document.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});</script></body></html>
