<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico App Check · Interfood Homologação</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:#fff;margin:0}.top{background:#ff6b00;padding:18px 20px;font-weight:900;font-size:20px}.wrap{max-width:820px;margin:auto;padding:22px}.card{background:#101827;border:1px solid #2b3648;border-radius:14px;padding:18px;margin:14px 0}.ok{color:#86efac}.bad{color:#fda4af}.warn{color:#fde68a}.muted{color:#aab4c3}.linha{margin:8px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#ff6b00;color:white;font-weight:900;cursor:pointer}.mono{font-family:Consolas,monospace;word-break:break-word;font-size:13px}.etapa{border-top:1px solid #2b3648;padding-top:10px;margin-top:10px}</style></head><body><div class="top">Interfood · Diagnóstico App Check</div><div class="wrap"><div class="card"><b>HOMOLOGAÇÃO</b><div class="muted">Este teste não ativa Enforcement e não altera produção.</div></div><div class="card"><div class="linha">Projeto: <b id="projeto">-</b></div><div class="linha">Domínio: <b id="dominio">-</b></div><div class="linha">Chave pública: <b id="chave">-</b></div><div class="etapa">1. SDK App Check: <b id="sdk">Aguardando...</b></div><div class="etapa">2. reCAPTCHA Enterprise: <b id="recaptcha">Aguardando...</b></div><div class="etapa">3. Token Firebase App Check: <b id="token">Aguardando...</b></div><div class="linha">Validade: <b id="validade">-</b></div><div id="erro" class="bad mono"></div></div><button class="btn" onclick="location.reload()">Testar novamente</button></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.06.6"></script><script>
const $=id=>document.getElementById(id);let app;
function ok(id,t){$(id).textContent='✅ '+t;$(id).className='ok'}
function falha(id,t){$(id).textContent='❌ '+t;$(id).className='bad'}
function esperar(ms){return new Promise(r=>setTimeout(r,ms))}
async function esperarModulo(){for(let i=0;i<50;i++){if(window.firebase&&firebase.appCheck&&window.InterfoodAppCheck)return true;await esperar(100)}return false}
function carregarRecaptchaComChave(key){return new Promise((resolve,reject)=>{const esperado='render='+encodeURIComponent(key);const existente=[...document.scripts].find(s=>String(s.src||'').includes('/recaptcha/enterprise.js')&&String(s.src||'').includes(esperado));if(existente&&window.grecaptcha&&grecaptcha.enterprise){resolve();return}const s=document.createElement('script');s.src='https://www.google.com/recaptcha/enterprise.js?render='+encodeURIComponent(key);s.async=true;s.defer=true;s.dataset.interfoodRecaptcha='1';s.onload=()=>resolve();s.onerror=()=>reject(new Error('Falha ao carregar enterprise.js com a chave pública'));document.head.appendChild(s)})}
async function executarRecaptcha(key){await carregarRecaptchaComChave(key);await new Promise((resolve,reject)=>{try{grecaptcha.enterprise.ready(resolve)}catch(e){reject(e)}});const r=await grecaptcha.enterprise.execute(key,{action:'app_check_diagnostico'});if(!r)throw new Error('reCAPTCHA Enterprise não retornou token.');return r}
async function testar(){const er=$('erro');er.textContent='';try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG,key=String(window.INTERFOOD_RECAPTCHA_ENTERPRISE_KEY||'');$('projeto').textContent=cfg&&cfg.projectId||'-';$('dominio').textContent=location.hostname;$('chave').textContent=key?key.slice(0,8)+'…'+key.slice(-6):'-';if(!cfg||cfg.projectId!=='interliga-homologacao-eb0f2')throw new Error('Projeto de homologação inválido.');if(!(await esperarModulo()))throw new Error('SDK/helper App Check não carregou no tempo esperado.');ok('sdk','carregado');try{const rt=await executarRecaptcha(key);ok('recaptcha','token reCAPTCHA recebido ('+rt.length+' caracteres)')}catch(e){falha('recaptcha','falha');throw new Error('ETAPA_RECAPTCHA: '+String(e&&e.message||e))}app=firebase.apps.find(a=>a.name==='diagAppCheckHomologacao')||firebase.initializeApp(cfg,'diagAppCheckHomologacao');InterfoodAppCheck.ativar(app);try{const r=await app.appCheck().getToken(true);if(!r||!r.token)throw new Error('Token App Check não recebido.');ok('token','recebido ('+r.token.length+' caracteres)');$('validade').textContent=r.expireTimeMillis?new Date(r.expireTimeMillis).toLocaleString('pt-BR'):'token válido'}catch(e){falha('token','não recebido');throw new Error('ETAPA_APPCHECK: '+String(e&&e.code?e.code+' · ':'')+String(e&&e.message||e))}}catch(e){er.textContent=String(e&&e.message||e);console.error(e)}}testar();
</script></body></html>
