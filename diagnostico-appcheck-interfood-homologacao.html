<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico App Check · Interfood Homologação</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:#fff;margin:0}.top{background:#ff6b00;padding:18px 20px;font-weight:900;font-size:20px}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#101827;border:1px solid #2b3648;border-radius:14px;padding:18px;margin:14px 0}.ok{color:#86efac}.bad{color:#fda4af}.muted{color:#aab4c3}.linha{margin:8px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#ff6b00;color:white;font-weight:900;cursor:pointer}</style></head><body><div class="top">Interfood · Diagnóstico App Check</div><div class="wrap"><div class="card"><b>HOMOLOGAÇÃO</b><div class="muted">Este teste não ativa Enforcement e não altera produção.</div></div><div class="card"><div class="linha">Projeto: <b id="projeto">-</b></div><div class="linha">Status do módulo: <b id="status">Carregando...</b></div><div class="linha">Token: <b id="token">Aguardando...</b></div><div class="linha">Validade: <b id="validade">-</b></div><div id="erro" class="bad"></div></div><button class="btn" onclick="testar()">Testar novamente</button></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.06.5"></script><script>let app;async function testar(){const st=document.getElementById('status'),tk=document.getElementById('token'),va=document.getElementById('validade'),er=document.getElementById('erro');er.textContent='';st.textContent='Testando...';tk.textContent='Aguardando...';try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;projeto.textContent=cfg&&cfg.projectId||'-';if(!cfg||cfg.projectId!=='interliga-homologacao-eb0f2')throw new Error('Projeto de homologação inválido.');app=firebase.apps.find(a=>a.name==='diagAppCheckHomologacao')||firebase.initializeApp(cfg,'diagAppCheckHomologacao');if(!window.InterfoodAppCheck)throw new Error('Módulo InterfoodAppCheck não carregado.');InterfoodAppCheck.ativar(app);const r=await app.appCheck().getToken(true);if(!r||!r.token)throw new Error('Token App Check não recebido.');st.textContent='✅ App Check ativo';st.className='ok';tk.textContent='✅ Token recebido ('+r.token.length+' caracteres)';tk.className='ok';va.textContent=r.expireTimeMillis?new Date(r.expireTimeMillis).toLocaleString('pt-BR'):'token válido';}catch(e){st.textContent='❌ Falha';st.className='bad';tk.textContent='Não recebido';tk.className='bad';er.textContent=String(e&&e.message||e);console.error(e)}}testar();</script></body></html>
