<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visão Geral Mensal · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.wrap{max-width:1200px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.num{font-size:23px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.inp{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px;width:100%}.btn{border:0;border-radius:9px;padding:10px 13px;background:#3c4b61;color:#fff;font-weight:800;cursor:pointer}.actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.4fr .7fr .9fr .8fr .9fr .9fr;gap:8px;align-items:center;padding:11px 8px;border-bottom:1px solid #243047}.head{font-size:12px;color:#94a3b8;font-weight:700}.right{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px}.pend{background:#f59e0b1c;color:#fbbf24}.pago{background:#22c55e1c;color:#86efac}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.tr{grid-template-columns:1.4fr .8fr .9fr}.tr>*:nth-child(4),.tr>*:nth-child(5),.tr>*:nth-child(6){display:none}}@media(max-width:480px){.stats{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand" id="brand">Visão Geral Mensal · Interfood</div><div class="sub" id="city">Homologação</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — visão gerencial mensal baseada nos fechamentos já registrados. Valores históricos permanecem congelados.</div><div class="actions"><button class="btn" onclick="voltar()">← Voltar ao financeiro</button></div><div id="app"><div class="card">Carregando visão mensal...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k),APP_NAME='interligaFranqueadoHomologacao',API='https://us-central1-interliga-homologacao-eb0f2.cloudfunctions.net/gerenciarFechamentosInterfood';let app,auth,perfil,lojas=[],fechs=[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function voltar(){location.href='financeiro-interfood-franqueado-homologacao.html?franquia='+encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}async function api(body){const token=await auth.currentUser.getIdToken();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...body,franquiaId:perfil.franquiaId})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível concluir.');return j}function mesAtual(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0');return d.getFullYear()+'-'+m}function noMes(f,m){return String(f.fimTexto||'').slice(0,7)===m||String(f.inicioTexto||'').slice(0,7)===m}function render(){const mes=$('fMes')?.value||mesAtual(),status=$('fStatus')?.value||'';const base=fechs.filter(f=>noMes(f,mes)&&(!status||f.status===status));const vendas=base.reduce((a,x)=>a+Number(x.vendas||0),0),com=base.reduce((a,x)=>a+Number(x.comissao||0),0),rep=base.reduce((a,x)=>a+Number(x.repasse||0),0),pend=base.filter(x=>x.status==='Pendente').reduce((a,x)=>a+Number(x.repasse||0),0),pago=base.filter(x=>x.status==='Pago').reduce((a,x)=>a+Number(x.repasse||0),0);const linhas=lojas.map(l=>{const xs=base.filter(x=>x.lojaId===l.id),v=xs.reduce((a,x)=>a+Number(x.vendas||0),0),c=xs.reduce((a,x)=>a+Number(x.comissao||0),0),r=xs.reduce((a,x)=>a+Number(x.repasse||0),0),rp=xs.filter(x=>x.status==='Pago').reduce((a,x)=>a+Number(x.repasse||0),0),rd=xs.filter(x=>x.status==='Pendente').reduce((a,x)=>a+Number(x.repasse||0),0);return'<div class="tr"><div><b>'+esc(l.nome||l.id)+'</b><div class="small">'+esc(l.categoria||'Estabelecimento')+'</div></div><div>'+xs.length+' fechamento(s)</div><div class="right"><b>'+money(v)+'</b></div><div class="right">'+money(c)+'</div><div class="right"><b>'+money(r)+'</b></div><div class="right"><span class="pill pago">Pago '+money(rp)+'</span><div class="small">Pendente '+money(rd)+'</div></div></div>'}).join('');$('app').innerHTML='<div class="filters"><input id="fMes" class="inp" type="month" value="'+esc(mes)+'" onchange="render()"><select id="fStatus" class="inp" onchange="render()"><option value="" '+(!status?'selected':'')+'>Todos os status</option><option value="Pendente" '+(status==='Pendente'?'selected':'')+'>Pendente</option><option value="Pago" '+(status==='Pago'?'selected':'')+'>Pago</option></select></div><div class="stats"><div class="card"><div class="num">'+base.length+'</div><div class="small">Fechamentos do mês</div></div><div class="card"><div class="num">'+money(vendas)+'</div><div class="small">Vendas fechadas</div></div><div class="card"><div class="num">'+money(com)+'</div><div class="small">Comissão da franquia</div></div><div class="card"><div class="num">'+money(pend)+'</div><div class="small">Repasses pendentes</div></div><div class="card"><div class="num">'+money(pago)+'</div><div class="small">Repasses pagos</div></div></div><div class="card table"><div class="tr head"><div>Estabelecimento</div><div>Fechamentos</div><div class="right">Vendas</div><div class="right">Comissão</div><div class="right">Repasses</div><div class="right">Situação financeira</div></div>'+linhas+'</div><div class="card small">Consolidado do mês selecionado: vendas <b>'+money(vendas)+'</b> · comissão <b>'+money(com)+'</b> · repasses <b>'+money(rep)+'</b>. Esta tela usa somente fechamentos gravados.</div>'}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});const db=app.firestore(),ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');$('brand').textContent='Visão Geral Mensal · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId;const es=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();lojas=es.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));const j=await api({acao:'listar'});fechs=j.fechamentos||[];render()}catch(e){$('app').innerHTML='<div class="card"><h2>Acesso bloqueado</h2><p>'+esc(e.message||e)+'</p></div>'}}carregar();</script></body></html>
