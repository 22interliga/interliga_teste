<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Master · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub{font-size:12px}.wrap{max-width:1180px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;border-radius:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{font-size:24px;font-weight:900}.small{font-size:12px;color:var(--muted)}.franquia{margin-top:16px}.loja{border-top:1px solid #263247;padding:11px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:99px;background:#22c55e22;color:#86efac}.off{background:#ef444422;color:#fda4af}.btn{border:0;border-radius:9px;padding:10px 13px;background:#334155;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.audit{background:var(--p);margin-right:8px}.bad{color:#ff7188}.loading{display:flex;gap:10px;align-items:center}.spinner{width:18px;height:18px;border:3px solid #334155;border-top-color:var(--p);border-radius:50%;animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.stats{grid-template-columns:1fr}.btn{width:100%;text-align:center;margin:0 0 8px}}</style></head><body><div class="top"><div class="brand">Interfood · Admin Master</div><div class="sub">Visão global da rede — homologação</div></div><div class="wrap"><div class="notice">HOMOLOGAÇÃO — painel global autenticado. Nesta primeira etapa ele é somente leitura para não interferir nas operações já validadas.</div><div id="perfil" class="card loading"><div class="spinner"></div><span>Validando Admin Master...</span></div><div id="app"></div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaAdminMasterHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();let admin=null;async function sair(){await auth.signOut();location.href='login-admin-master-interfood-homologacao.html'}async function validar(u){const s=await db.collection('adminsMaster').doc(u.uid).get({source:'server'});if(!s.exists)throw Error('Conta não autorizada como Admin Master.');const p=s.data()||{};if(p.ativo!==true||p.perfil!=='adminMaster')throw Error('Admin Master inativo ou inválido.');return p}async function carregar(){try{const u=auth.currentUser;admin=await validar(u);$('perfil').className='card';$('perfil').innerHTML='<div class="row"><div><b>'+esc(admin.nome||u.email||'Admin Master')+'</b><div class="small">Acesso global autorizado · UID '+esc(u.uid)+'</div></div><div><a class="btn audit" href="auditoria-admin-master-interfood-homologacao.html">Auditoria</a><button class="btn" onclick="sair()">Sair</button></div></div>';const fs=await db.collection('franquias').get({source:'server'}),franquias=fs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.cidade||a.id).localeCompare(String(b.nome||b.cidade||b.id)));let lojasTotal=0,pedidosTotal=0,concluidos=0;const blocos=[];for(const f of franquias){const es=await db.collection('franquias').doc(f.id).collection('estabelecimentos').get({source:'server'});const lojas=es.docs.map(d=>({id:d.id,...d.data()}));lojasTotal+=lojas.length;let pedidosF=0,concluidosF=0;const linhas=[];for(const l of lojas){const ps=await db.collection('franquias').doc(f.id).collection('estabelecimentos').doc(l.id).collection('pedidos').get({source:'server'});pedidosF+=ps.size;let c=0;ps.forEach(p=>{if(p.data()?.status==='Concluído')c++});concluidosF+=c;linhas.push('<div class="loja"><div class="row"><div><b>'+esc(l.nome||l.id)+'</b><div class="small">'+esc(l.categoria||'Estabelecimento')+' · '+ps.size+' pedido(s) · '+c+' concluído(s)</div></div><span class="pill '+(l.ativo===false?'off':'')+'">'+(l.ativo===false?'Inativa':'Ativa')+'</span></div></div>')}pedidosTotal+=pedidosF;concluidos+=concluidosF;blocos.push('<div class="card franquia"><h3>'+esc(f.nome||f.cidade||f.id)+'</h3><div class="small">franquiaId: '+esc(f.id)+' · '+lojas.length+' estabelecimento(s) · '+pedidosF+' pedido(s)</div>'+(linhas.join('')||'<div class="small" style="margin-top:10px">Nenhum estabelecimento cadastrado.</div>')+'</div>')}$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+franquias.length+'</div><div class="small">Franquias visíveis</div></div><div class="card"><div class="num">'+lojasTotal+'</div><div class="small">Estabelecimentos</div></div><div class="card"><div class="num">'+pedidosTotal+'</div><div class="small">Pedidos</div></div><div class="card"><div class="num">'+concluidos+'</div><div class="small">Concluídos</div></div></div>'+blocos.join('')}catch(e){$('perfil').className='card';$('perfil').innerHTML='<div class="bad"><b>Acesso bloqueado:</b> '+esc(e.message||e)+'</div>';$('app').innerHTML=''}}auth.onAuthStateChanged(u=>{if(!u){location.href='login-admin-master-interfood-homologacao.html';return}carregar()});</script></body></html>
