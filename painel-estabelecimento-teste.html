<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Estabelecimento — Teste Seguro</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px}.brand{font-size:21px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff}.wrap{max-width:1120px;margin:auto;padding:18px}.notice,.card{border-radius:14px;padding:15px}.notice{border:1px solid #f59e0b66;background:#f59e0b18;color:#ffd166;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);margin-bottom:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{font-size:24px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px;height:max-content}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.delivery{margin-top:12px;padding:12px;background:#0b1423;border-radius:10px}.bad{font-size:24px;color:#ff6680;font-weight:900}.center{text-align:center;max-width:600px;margin:45px auto}.timeline{border-left:2px solid #334155;padding-left:13px;margin-top:10px}.ev{margin-bottom:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{flex-direction:column}}</style></head><body><div class="top"><div id="brand" class="brand">Interfood</div><div id="sub" class="sub"></div></div><div class="wrap"><div class="notice">AMBIENTE DE TESTE — painel protegido por sessão vinculada à franquia e ao estabelecimento.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function q(k){return new URLSearchParams(location.search).get(k)}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function sess(){try{return JSON.parse(sessionStorage.getItem('interliga_sessao_estabelecimento')||'null')}catch(e){return null}}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function negar(msg,f){$('app').innerHTML='<div class="card center"><div class="bad">Acesso negado</div><p>'+msg+'</p><button class="btn" onclick="location.href=\'login-estabelecimento-teste.html?franquia='+encodeURIComponent(f||q('franquia')||'candeias')+'\'">Voltar ao login</button></div>'}function auth(){let s=sess(),f=q('franquia'),l=q('loja');if(!s)return{ok:false,msg:'Faça login para acessar o estabelecimento.',f};if(String(s.franquiaId)!==String(f)||String(s.lojaId)!==String(l))return{ok:false,msg:'Este login não possui permissão para a franquia ou estabelecimento informado no link.',f:s.franquiaId};let ac=read('interliga_acessos_estabelecimentos_'+s.franquiaId)[s.lojaId];if(!ac||ac.ativo===false||String(ac.usuario)!==String(s.usuario))return{ok:false,msg:'Este acesso foi bloqueado ou alterado pelo franqueado.',f:s.franquiaId};return{ok:true,s}}function logout(){sessionStorage.removeItem('interliga_sessao_estabelecimento');location.href='login-estabelecimento-teste.html?franquia='+encodeURIComponent(q('franquia'))}function hist(p){let e=p.entregador||{},h=p.historico||[];if(p.entrega!=='Interfood')return'';return'<div class="delivery"><b>Entrega Interfood</b><div class="small">Entregador: '+(e.nome||'Aguardando')+' · '+(e.veiculo||'—')+' · '+(e.placa||'—')+'</div>'+(h.length?'<div class="timeline">'+h.map(x=>'<div class="ev"><b>'+x.status+'</b><div class="small">'+x.em+' · '+(x.por||e.nome||'—')+'</div></div>').join('')+'</div>':'')+'</div>'}function status(id,st){let a=auth();if(!a.ok)return render();let k='interliga_interfood_'+a.s.franquiaId,d=read(k),loja=(d.estabelecimentos||[]).find(x=>String(x.id)===String(a.s.lojaId)),p=(d.pedidos||[]).find(x=>x.id===id&&loja&&x.loja===loja.nome);if(p){p.status=st;localStorage.setItem(k,JSON.stringify(d));render()}}function render(){let a=auth();if(!a.ok){negar(a.msg,a.f);return}let s=a.s,c=read('interliga_franquia_'+s.franquiaId),d=read('interliga_interfood_'+s.franquiaId),loja=(d.estabelecimentos||[]).find(x=>String(x.id)===String(s.lojaId));if(!loja||loja.status!=='Ativo'){negar('O estabelecimento está inativo ou não existe.',s.franquiaId);return}$('brand').textContent=c.nomeInterfood||'Interfood';$('sub').textContent=loja.nome+' · '+(c.cidade||s.franquiaId)+' · '+s.usuario;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');let ps=(d.pedidos||[]).filter(p=>p.loja===loja.nome),fat=ps.filter(p=>p.status==='Concluído').reduce((a,p)=>a+Number(p.valor||0),0);$('app').innerHTML='<div style="text-align:right"><button class="btn" onclick="logout()">Sair</button></div><div class="stats"><div class="card"><div class="num">'+ps.filter(p=>p.status==='Novo').length+'</div><div class="small">Novos</div></div><div class="card"><div class="num">'+ps.filter(p=>p.status==='Em preparo').length+'</div><div class="small">Em preparo</div></div><div class="card"><div class="num">'+ps.length+'</div><div class="small">Pedidos da loja</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Concluído</div></div></div><h3>Pedidos</h3>'+ps.map(p=>'<div class="card"><div class="row"><div><b>'+p.id+'</b> · '+money(p.valor)+'<div class="small">Entrega: '+p.entrega+'</div></div><span class="badge">'+p.status+'</span></div>'+(p.status==='Novo'?'<button class="btn" onclick="status(\''+p.id+'\',\'Confirmado\')">Aceitar pedido</button>':'')+(p.status==='Confirmado'?'<button class="btn" onclick="status(\''+p.id+'\',\'Em preparo\')">Iniciar preparo</button>':'')+(p.status==='Em preparo'?'<button class="btn" onclick="status(\''+p.id+'\',\'Pronto\')">Marcar como pronto</button>':'')+hist(p)+'</div>').join('')}render();window.addEventListener('storage',render);setInterval(()=>{let a=auth();if(!a.ok)render()},1000)</script></body></html>
