<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Estabelecimento — Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px;display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:21px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff;opacity:.85}.wrap{max-width:1120px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.num{font-size:24px;font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab,.btn{border:0;border-radius:20px;padding:9px 13px;font-weight:800;cursor:pointer}.tab{background:#172235;color:#c9d3e2;border:1px solid var(--bd)}.tab.active,.btn{background:var(--p);color:#fff}.section{display:none}.section.active{display:block}.pedido{margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:5px 8px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border-radius:9px}.btn.gray{background:#253247}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.table th{color:#9da9ba}.lock{text-align:center;max-width:620px;margin:45px auto;padding:30px}.bad{color:#ff6680;font-size:25px;font-weight:900}.selectbox{max-width:600px;margin:35px auto}.sel{width:100%;padding:12px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px;margin:8px 0 12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top"><div class="logo" id="logo">IF</div><div><div class="brand" id="brand">Interfood</div><div class="sub" id="sub"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — estabelecimento vinculado à sua franquia e à sua própria loja.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function qs(k){return new URLSearchParams(location.search).get(k)}function fid(){return qs('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function db(){return read('interliga_interfood_'+fid())}function mensal(){return read('interliga_mensalidade_'+fid())}function bloqueado(){let m=mensal();if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>2}function lojaId(){return qs('loja')}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function status(id,st){let d=db(),p=(d.pedidos||[]).find(x=>x.id===id);if(p){p.status=st;write('interliga_interfood_'+fid(),d);render()}}function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.s).classList.add('active')})}function render(){let c=cfg(),d=db(),lojas=d.estabelecimentos||[],id=lojaId(),loja=lojas.find(x=>x.id===id),nome=c.nomeInterfood||'Interfood';$('brand').textContent=nome;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IF';if(bloqueado()){$('sub').textContent=c.cidade||c.id;$('app').innerHTML='<div class="card lock"><div style="font-size:50px">🔒</div><div class="bad">Operação temporariamente indisponível</div><p>A franquia está bloqueada. O estabelecimento não consegue operar pedidos até a liberação.</p></div>';return}if(!loja){$('sub').textContent='Selecione um estabelecimento · '+(c.cidade||c.id);$('app').innerHTML='<div class="card selectbox"><b>Acessar estabelecimento desta franquia</b><p class="small">No sistema real esta seleção será substituída pelo login do comerciante.</p><select id="lojaSel" class="sel"><option value="">Selecione</option>'+lojas.filter(x=>x.status==='Ativo').map(x=>'<option value="'+x.id+'">'+x.nome+'</option>').join('')+'</select><button class="btn" onclick="location.href=location.pathname+\'?franquia='+fid()+'&loja=\'+$(\'lojaSel\').value">Entrar</button></div>';return}$('sub').textContent=loja.nome+' · '+(c.cidade||c.id);let pedidos=(d.pedidos||[]).filter(p=>p.loja===loja.nome),fat=pedidos.filter(p=>p.status==='Concluído').reduce((a,p)=>a+Number(p.valor||0),0),novos=pedidos.filter(p=>p.status==='Novo').length,prep=pedidos.filter(p=>p.status==='Em preparo').length;$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+novos+'</div><div class="small">Novos pedidos</div></div><div class="card"><div class="num">'+prep+'</div><div class="small">Em preparo</div></div><div class="card"><div class="num">'+pedidos.length+'</div><div class="small">Pedidos da loja</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Concluído</div></div></div><div class="tabs"><button class="tab active" data-s="pedidos">Pedidos</button><button class="tab" data-s="financeiro">Financeiro</button><button class="tab" data-s="loja">Minha loja</button></div><section id="pedidos" class="section active">'+(pedidos.length?pedidos.map(p=>'<div class="card pedido"><div class="row"><div><b>'+p.id+'</b> · '+money(p.valor)+'<div class="small">Entrega: '+p.entrega+'</div></div><span class="badge">'+p.status+'</span></div><div class="actions">'+(p.status==='Novo'?'<button class="btn" onclick="status(\''+p.id+'\',\'Confirmado\')">Aceitar pedido</button>':'')+(p.status==='Confirmado'?'<button class="btn" onclick="status(\''+p.id+'\',\'Em preparo\')">Iniciar preparo</button>':'')+(p.status==='Em preparo'?'<button class="btn" onclick="status(\''+p.id+'\',\'Pronto\')">Marcar como pronto</button>':'')+(p.status==='Pronto'&&p.entrega==='Própria'?'<button class="btn" onclick="status(\''+p.id+'\',\'Saiu para entrega\')">Saiu para entrega</button>':'')+(p.status==='Saiu para entrega'&&p.entrega==='Própria'?'<button class="btn" onclick="status(\''+p.id+'\',\'Concluído\')">Concluir entrega</button>':'')+(p.status==='Pronto'&&p.entrega==='Interfood'?'<span class="small">Aguardando entregador Interfood.</span>':'')+'</div></div>').join(''):'<div class="card">Nenhum pedido desta loja.</div>')+'</section><section id="financeiro" class="section"><div class="card"><table class="table"><tr><th>Indicador</th><th>Valor</th></tr><tr><td>Pedidos concluídos</td><td>'+pedidos.filter(p=>p.status==='Concluído').length+'</td></tr><tr><td>Vendas concluídas</td><td>'+money(fat)+'</td></tr><tr><td>Taxa contratada</td><td>'+loja.taxa+'%</td></tr><tr><td>Taxa estimada</td><td>'+money(fat*Number(loja.taxa||0)/100)+'</td></tr><tr><td>Líquido estimado</td><td>'+money(fat*(1-Number(loja.taxa||0)/100))+'</td></tr></table><p class="small">Valores demonstrativos no ambiente de teste.</p></div></section><section id="loja" class="section"><div class="card"><b>'+loja.nome+'</b><p>Categoria: '+loja.categoria+'</p><p>Modelo de entrega: '+loja.entrega+'</p><p>Taxa: '+loja.taxa+'%</p><p>Status: '+loja.status+'</p><p class="small">Este acesso não mostra outros estabelecimentos nem dados de outras franquias.</p></div></section>';tabs()}render();window.addEventListener('storage',render)</script></body></html>
