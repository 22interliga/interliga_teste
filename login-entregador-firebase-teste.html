<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Entregador Interfood</title><style>body{margin:0;background:#07101f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:420px;margin:7vh auto;padding:20px}.card{background:#101827;border:1px solid #2b3648;border-radius:16px;padding:22px}.test{color:#65e89a;font-size:12px;margin-bottom:16px}.inp{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2b3648;background:#172235;color:#fff;margin:7px 0}.btn{width:100%;border:0;border-radius:10px;padding:12px;background:#ff6b00;color:#fff;font-weight:900;margin-top:10px;cursor:pointer}.msg{font-size:13px;margin-top:12px;min-height:18px}.sub{color:#9da9ba;font-size:12px}</style></head><body><div class="wrap"><div class="card"><h2>Entregador · Interfood</h2><div class="test">AMBIENTE DE HOMOLOGAÇÃO — Firebase Authentication + Firestore Rules</div><input id="email" class="inp" type="email" placeholder="E-mail"><input id="senha" class="inp" type="password" placeholder="Senha"><button id="entrar" class="btn">Entrar</button><div id="msg" class="msg"></div><p class="sub">O acesso só é liberado para entregador ativo vinculado a uma franquia.</p></div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;const app=firebase.apps.find(a=>a.name==='interligaEntregadorHomologacao')||firebase.initializeApp(cfg,'interligaEntregadorHomologacao');const auth=app.auth(),db=app.firestore(),msg=document.getElementById('msg');document.getElementById('entrar').onclick=async()=>{msg.textContent='Entrando...';try{const cred=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('senha').value);const snap=await db.collection('usuariosEntregadores').doc(cred.user.uid).get({source:'server'});if(!snap.exists)throw new Error('Cadastro de entregador não encontrado.');const p=snap.data();if(p.ativo!==true||p.perfil!=='entregador'||!p.franquiaId)throw new Error('Entregador sem permissão ativa.');location.href='entregador-interfood-firebase-teste.html?franquia='+encodeURIComponent(p.franquiaId);}catch(e){msg.textContent='Acesso não autorizado: '+(e.message||e);await auth.signOut().catch(()=>{});}};</script></body></html>
