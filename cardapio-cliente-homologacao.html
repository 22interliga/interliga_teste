<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cardápio · Interfood Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4;--ok:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:var(--p);padding:16px 20px;font-size:22px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:20px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;padding:13px;border-radius:12px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.identidade{padding:0;overflow:hidden}.capa{height:230px;background:linear-gradient(135deg,#172033,#0a1322);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}.capa img{width:100%;height:100%;object-fit:cover}.lojaInfo{display:flex;gap:16px;align-items:center;padding:16px}.logo{width:96px;height:96px;flex:0 0 96px;border-radius:20px;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#334155;font-weight:900}.logo img{width:100%;height:100%;object-fit:contain}.lojaTexto h2{margin:0 0 7px}.cat{margin-top:22px}.produto{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #263247;padding:15px 0}.produto:first-of-type{border-top:0}.muted{font-size:12px;color:var(--muted)}.price{font-weight:900;margin-top:6px}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.sec{background:#3c4b61}.cart{position:sticky;bottom:10px;border:1px solid #ff8a3288;background:#101827ef;backdrop-filter:blur(8px)}.cartline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #263247}.total{font-size:20px;font-weight:900;margin-top:12px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.hidden{display:none}.box{width:min(680px,100%);max-height:90vh;overflow:auto;background:#101827;border:1px solid #344158;border-radius:16px;padding:18px}.choice{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #263247}.choice input{width:20px;height:20px}.group{margin-top:18px}.qty{display:flex;gap:8px;align-items:center}.qty button{width:34px;height:34px;border:0;border-radius:8px;background:#334155;color:#fff;font-weight:900}.empty{color:var(--muted)}@media(max-width:700px){.produto{align-items:flex-start;flex-direction:column}.btn{width:100%}.capa{height:170px}.lojaInfo{align-items:flex-end;margin-top:-42px;position:relative}.logo{width:84px;height:84px;flex-basis:84px}.lojaTexto{padding-top:45px}}</style></head><body><div class="top">Interfood · Cardápio do Cliente</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — catálogo e carrinho de teste.</div><div class="card identidade"><div id="capaLoja" class="capa">Sem imagem de capa</div><div class="lojaInfo"><div id="logoLoja" class="logo">IF</div><div class="lojaTexto"><h2 id="lojaNome">Carregando estabelecimento...</h2><div class="muted" id="lojaDetalhes"></div><div class="muted" id="sessao">Validando cliente...</div></div></div></div><div id="lista"></div><div class="card cart"><b>🛒 Carrinho</b><div id="cartItens" class="empty">Nenhum item adicionado.</div><div class="total" id="cartTotal">Total: R$ 0,00</div><button id="continuar" class="btn" onclick="continuarPedido()" disabled>Continuar pedido</button></div></div><div id="modal" class="modal hidden"><div class="box"><div id="modalConteudo"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nome=q.get('nome')||'TESTE TESTE';const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore(),storage=app.storage(),lojaRef=db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja);let produtos=[],categoriasCardapio=[],carrinho=[],selecionado=null,escolhaVar=null,escolhasGrupos={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function midiaPath(tipo){return 'interfood/'+fid+'/estabelecimentos/'+loja+'/'+tipo+'/'+tipo}async function carregarIdentidade(){for(const tipo of ['logo','capa']){try{const url=await storage.ref(midiaPath(tipo)).getDownloadURL();if(tipo==='logo')$('logoLoja').innerHTML='<img src="'+esc(url)+'" alt="Logo do estabelecimento">';else $('capaLoja').innerHTML='<img src="'+esc(url)+'" alt="Capa do estabelecimento">'}catch(e){if(tipo==='logo')$('logoLoja').textContent='IF';else $('capaLoja').textContent='Sem imagem de capa'}}}auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){if(u&&u.isAnonymous)await auth.signOut();const destino=location.pathname.split('/').pop()+location.search;location.href='login-cliente-firebase-teste.html?destino='+encodeURIComponent(destino);return}try{const perfil=await db.collection('clientes').doc(u.uid).get();if(!perfil.exists||perfil.data().ativo!==true||perfil.data().perfil!=='cliente')throw Error('Cliente sem acesso ativo.');$('sessao').textContent='Cliente: '+(perfil.data().nome||u.email);const sLoja=await lojaRef.get({source:'server'});if(!sLoja.exists)throw Error('Estabelecimento não encontrado.');const dLoja=sLoja.data()||{};$('lojaNome').textContent=dLoja.nome||nome;$('lojaDetalhes').textContent=[dLoja.categoria,dLoja.horarioAbertura&&dLoja.horarioFechamento?'Horário: '+dLoja.horarioAbertura+'–'+dLoja.horarioFechamento:''].filter(Boolean).join(' · ');await carregarIdentidade();const [snapCats,snap]=await Promise.all([lojaRef.collection('categoriasCardapio').get(),lojaRef.collection('cardapio').get()]);categoriasCardapio=[];snapCats.forEach(d=>{const x={id:d.id,...d.data()};if(x.ativo!==false)categoriasCardapio.push(x)});categoriasCardapio.sort((a,b)=>Number(a.ordem||999)-Number(b.ordem||999)||(a.nome||'').localeCompare(b.nome||''));const ordemCat=new Map(categoriasCardapio.map((c,i)=>[String(c.nome||'').toLocaleLowerCase('pt-BR'),i]));produtos=[];snap.forEach(d=>{const x={id:d.id,...d.data()},ch=String(x.categoria||'').toLocaleLowerCase('pt-BR');if(x.ativo!==false&&ordemCat.has(ch))produtos.push(x)});produtos.sort((a,b)=>(ordemCat.get(String(a.categoria||'').toLocaleLowerCase('pt-BR'))??999)-(ordemCat.get(String(b.categoria||'').toLocaleLowerCase('pt-BR'))??999)||(a.nome||'').localeCompare(b.nome||''));renderProdutos()}catch(e){$('lista').innerHTML='<div class="card">'+esc(e.message||e)+'</div>'}});function renderProdutos(){if(!produtos.length){$('lista').innerHTML='<div class="card empty">Nenhum produto disponível.</div>';return}const cats=categoriasCardapio.filter(c=>produtos.some(p=>String(p.categoria||'').toLocaleLowerCase('pt-BR')===String(c.nome||'').toLocaleLowerCase('pt-BR')));$('lista').innerHTML=cats.map(c=>'<div class="card cat"><h3>'+esc(c.nome)+'</h3>'+produtos.filter(p=>String(p.categoria||'').toLocaleLowerCase('pt-BR')===String(c.nome||'').toLocaleLowerCase('pt-BR')).map(p=>{const vars=Array.isArray(p.variacoes)?p.variacoes.filter(v=>v.ativo!==false):[],gs=Array.isArray(p.gruposAdicionais)?p.gruposAdicionais:[];const preco=vars.length?Math.min(...vars.map(v=>Number(v.preco||0))):Number(p.preco||0);return '<div class="produto"><div><b>'+esc(p.nome)+'</b><div class="muted">'+esc(p.descricao||'')+'</div><div class="price">'+(vars.length?'A partir de ':'')+money(preco)+'</div><div class="muted">'+(vars.length?vars.length+' opção(ões) de tamanho · ':'')+(gs.length?gs.length+' grupo(s) de adicionais':'')+'</div></div><button class="btn" onclick="abrirProduto(\''+p.id+'\')">Escolher</button></div>'}).join('')+'</div>').join('')}function abrirProduto(id){selecionado=produtos.find(p=>p.id===id);if(!selecionado)return;const vars=Array.isArray(selecionado.variacoes)?selecionado.variacoes.filter(v=>v.ativo!==false):[];escolhaVar=vars.length?null:{nome:'Padrão',preco:Number(selecionado.preco||0)};escolhasGrupos={};const gs=Array.isArray(selecionado.gruposAdicionais)?selecionado.gruposAdicionais:[];let html='<h2>'+esc(selecionado.nome)+'</h2><div class="muted">'+esc(selecionado.descricao||'')+'</div>';if(vars.length){html+='<div class="group"><b>Escolha o tamanho</b>'+vars.map((v,i)=>'<label class="choice"><span>'+esc(v.nome)+' — '+money(v.preco)+'</span><input type="radio" name="var" onchange="escolherVar('+i+')"></label>').join('')+'</div>'}gs.forEach((g,gi)=>{escolhasGrupos[gi]=[];html+='<div class="group"><b>'+esc(g.nome)+'</b><div class="muted">'+(g.obrigatorio?'Obrigatório':'Opcional')+' · mínimo '+Number(g.min||0)+' · máximo '+Number(g.max||1)+'</div>'+(g.opcoes||[]).filter(o=>o.ativo!==false).map((o,oi)=>'<label class="choice"><span>'+esc(o.nome)+' '+(Number(o.preco||0)>0?'(+ '+money(o.preco)+')':'')+'</span><input type="checkbox" onchange="toggleOpcao('+gi+','+oi+',this.checked)"></label>').join('')+'</div>'});html+='<div class="total" id="modalTotal">Total do item: '+money(precoAtual())+'</div><button class="btn" onclick="adicionarCarrinho()">Adicionar ao carrinho</button> <button class="btn sec" onclick="fecharModal()">Cancelar</button>';$('modalConteudo').innerHTML=html;$('modal').classList.remove('hidden')}function escolherVar(i){const vars=selecionado.variacoes.filter(v=>v.ativo!==false);escolhaVar=vars[i];atualizarModalTotal()}function toggleOpcao(gi,oi,on){const g=selecionado.gruposAdicionais[gi],o=(g.opcoes||[]).filter(x=>x.ativo!==false)[oi],arr=escolhasGrupos[gi]||[];if(on){const max=Number(g.max||1);if(arr.length>=max){alert('Você pode escolher no máximo '+max+' opção(ões) neste grupo.');event.target.checked=false;return}arr.push(o)}else{const idx=arr.findIndex(x=>x.nome===o.nome&&Number(x.preco||0)===Number(o.preco||0));if(idx>=0)arr.splice(idx,1)}escolhasGrupos[gi]=arr;atualizarModalTotal()}function precoAtual(){let t=escolhaVar?Number(escolhaVar.preco||0):Number(selecionado?.preco||0);Object.values(escolhasGrupos).forEach(a=>(a||[]).forEach(o=>t+=Number(o.preco||0)));return t}function atualizarModalTotal(){if($('modalTotal'))$('modalTotal').textContent='Total do item: '+money(precoAtual())}function validarEscolhas(){const vars=Array.isArray(selecionado.variacoes)?selecionado.variacoes.filter(v=>v.ativo!==false):[];if(vars.length&&!escolhaVar)return 'Escolha um tamanho.';const gs=Array.isArray(selecionado.gruposAdicionais)?selecionado.gruposAdicionais:[];for(let i=0;i<gs.length;i++){const qtd=(escolhasGrupos[i]||[]).length,min=Number(gs[i].min||0),max=Number(gs[i].max||1);if(qtd<min)return 'Escolha pelo menos '+min+' opção(ões) em '+gs[i].nome+'.';if(qtd>max)return 'Escolha no máximo '+max+' opção(ões) em '+gs[i].nome+'.'}return ''}function adicionarCarrinho(){const erro=validarEscolhas();if(erro)return alert(erro);const adicionais=[];Object.entries(escolhasGrupos).forEach(([gi,a])=>(a||[]).forEach(o=>adicionais.push({grupo:selecionado.gruposAdicionais[gi].nome,nome:o.nome,preco:Number(o.preco||0)})));carrinho.push({produtoId:selecionado.id,nome:selecionado.nome,variacao:escolhaVar?{nome:escolhaVar.nome,preco:Number(escolhaVar.preco||0)}:null,adicionais,quantidade:1,unitario:precoAtual()});fecharModal();renderCarrinho()}function fecharModal(){$('modal').classList.add('hidden');selecionado=null}function alterarQtd(i,d){carrinho[i].quantidade=Math.max(0,Number(carrinho[i].quantidade||1)+d);if(carrinho[i].quantidade===0)carrinho.splice(i,1);renderCarrinho()}function renderCarrinho(){if(!carrinho.length){$('cartItens').className='empty';$('cartItens').textContent='Nenhum item adicionado.';$('cartTotal').textContent='Total: '+money(0);$('continuar').disabled=true;return}$('cartItens').className='';$('cartItens').innerHTML=carrinho.map((x,i)=>'<div class="cartline"><div><b>'+esc(x.nome)+'</b><div class="muted">'+(x.variacao?esc(x.variacao.nome):'')+(x.adicionais.length?' · '+x.adicionais.map(a=>esc(a.nome)).join(', '):'')+'</div><div>'+money(x.unitario)+' cada</div></div><div class="qty"><button onclick="alterarQtd('+i+',-1)">−</button><b>'+x.quantidade+'</b><button onclick="alterarQtd('+i+',1)">+</button></div></div>').join('');const total=carrinho.reduce((s,x)=>s+Number(x.unitario||0)*Number(x.quantidade||1),0);$('cartTotal').textContent='Total: '+money(total);$('continuar').disabled=false}function continuarPedido(){if(!carrinho.length)return;const total=carrinho.reduce((s,x)=>s+Number(x.unitario||0)*Number(x.quantidade||1),0);sessionStorage.setItem('interfoodCarrinhoHomologacao',JSON.stringify({fid,loja,nome,itens:carrinho,total}));location.href='novo-pedido-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nome)+'&carrinho=1'}</script></body></html>
