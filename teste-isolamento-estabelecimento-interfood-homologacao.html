<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de isolamento — Estabelecimento</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:#eef4ff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#101b2d;border:1px solid #2b3a52;border-radius:16px;padding:22px}h1{margin-top:0}.ok{color:#36e58d}.bad{color:#ff6b6b}.info{color:#9eb2cc}.row{padding:12px 0;border-bottom:1px solid #27364b}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script></head><body><div class="box"><h1>Teste de isolamento — Estabelecimento</h1><p class="info">HOMOLOGAÇÃO · somente leitura. Nenhum pedido ou cadastro será alterado.</p><div id="estado">Aguardando autenticação...</div><button onclick="testar()">Testar isolamento</button><div id="resultado"></div></div><script>const alvoIds=['e1787955782339']; async function testar(){const out=document.getElementById('resultado');out.innerHTML='';const u=firebase.auth().currentUser;if(!u){out.innerHTML='<div class="bad">Sem usuário autenticado.</div>';return}try{const p=await firebase.firestore().collection('usuariosEstabelecimentos').doc(u.uid).get();if(!p.exists)throw new Error('Perfil de estabelecimento não encontrado');const d=p.data(),fid=d.franquiaId,loja=d.lojaId;out.innerHTML+='<div class="row">Logado: <b>'+esc(d.nome||u.email||u.uid)+'</b><br>Franquia: '+esc(fid)+' · Loja ID: '+esc(loja)+'</div>';let propria=false;try{await firebase.firestore().doc('franquias/'+fid+'/estabelecimentos/'+loja).get({source:'server'});propria=true}catch(e){}out.innerHTML+='<div class="row '+(propria?'ok':'bad')+'>'+(propria?'CORRETO ✅ Própria loja autorizada.':'ERRO ❌ A própria loja foi bloqueada.')+'</div>';let alvo=alvoIds.find(x=>x!==loja);if(!alvo){out.innerHTML+='<div class="row info">Não há outro ID de loja configurado para este teste.</div>';return}try{await firebase.firestore().doc('franquias/'+fid+'/estabelecimentos/'+alvo).get({source:'server'});out.innerHTML+='<div class="row bad">FALHA DE SEGURANÇA ❌ Foi possível consultar outra loja ('+esc(alvo)+').</div>'}catch(e){out.innerHTML+='<div class="row ok">CORRETO ✅ O Firestore bloqueou o acesso a outra loja.</div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}firebase.auth().onAuthStateChanged(async u=>{const e=document.getElementById('estado');if(!u){e.innerHTML='<span class="bad">Sem login. Abra esta página na mesma sessão do estabelecimento.</span>';return}try{const p=await firebase.firestore().collection('usuariosEstabelecimentos').doc(u.uid).get();const d=p.data()||{};e.innerHTML='Sessão reconhecida: <b>'+esc(d.nome||u.email||u.uid)+'</b> · '+esc(d.franquiaId||'')+' / '+esc(d.lojaId||'')}catch(err){e.innerHTML='<span class="bad">Não foi possível validar o perfil.</span>'}});</script></body></html>
