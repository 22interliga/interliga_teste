<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de isolamento — Estabelecimento</title>
<style>body{font-family:Arial,sans-serif;background:#07101f;color:#eef4ff;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#101b2d;border:1px solid #2b3a52;border-radius:16px;padding:22px}h1{margin-top:0}.ok{color:#36e58d}.bad{color:#ff6b6b}.info{color:#9eb2cc}.row{padding:12px 0;border-bottom:1px solid #27364b}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style>
</head>
<body><div class="box"><h1>Teste de isolamento — Estabelecimento</h1><p class="info">HOMOLOGAÇÃO · somente leitura. Nenhum pedido ou cadastro será alterado.</p><div id="estado">Aguardando autenticação...</div><button id="btn" onclick="testar()" disabled>Testar isolamento</button><div id="resultado"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-interfood-config-teste.js?v=fbe5d193"></script>
<script src="firebase-auth-interfood-teste.js?v=89df59c9"></script>
<script>
const estado=document.getElementById('estado'),out=document.getElementById('resultado'),btn=document.getElementById('btn');
let auth,db,usuario,perfil;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function iniciar(){try{const r=await InterfoodAuthTeste.iniciar();auth=r.auth;db=r.db;await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sem sessão Firebase.'))},reject)});usuario=auth.currentUser;const s=await db.collection('usuariosEstabelecimentos').doc(usuario.uid).get({source:'server'});if(!s.exists)throw new Error('Perfil de estabelecimento não encontrado.');perfil=s.data()||{};estado.innerHTML='Sessão reconhecida: <b>'+esc(perfil.nome||usuario.email||usuario.uid)+'</b><br>Franquia: '+esc(perfil.franquiaId)+' · Loja ID: '+esc(perfil.lojaId);btn.disabled=false;}catch(e){estado.innerHTML='<span class="bad">ERRO: '+esc(e.code||'')+' '+esc(e.message)+'</span>';}}
async function testar(){btn.disabled=true;out.innerHTML='<div class="info row">Executando teste somente leitura...</div>';const fid=perfil.franquiaId,loja=perfil.lojaId;let html='';try{await db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja).get({source:'server'});html+='<div class="row ok">CORRETO ✅ Própria loja autorizada.</div>'}catch(e){html+='<div class="row bad">ERRO ❌ A própria loja foi bloqueada: '+esc(e.code||e.message)+'</div>'}
const candidatos=['e1787955782339','ljc6GjET9wAoBBdQNE8g'];const alvo=candidatos.find(x=>x!==loja);if(!alvo){html+='<div class="row info">Não há outra loja configurada para este teste.</div>';out.innerHTML=html;btn.disabled=false;return}
try{await db.collection('franquias').doc(fid).collection('estabelecimentos').doc(alvo).get({source:'server'});html+='<div class="row bad">FALHA DE SEGURANÇA ❌ Foi possível consultar outra loja ('+esc(alvo)+').</div>'}catch(e){html+='<div class="row ok">CORRETO ✅ O Firestore bloqueou o acesso a outra loja.</div><div class="info">Retorno: '+esc(e.code||'permission-denied')+'</div>'}out.innerHTML=html;btn.disabled=false;}
iniciar();
</script></body></html>
