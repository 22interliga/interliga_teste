<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de isolamento — Entregador</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:#eef4ff;margin:0;padding:24px}.box{max-width:820px;margin:auto;background:#101b2d;border:1px solid #2b3a52;border-radius:16px;padding:22px}h1{margin-top:0}.ok{color:#36e58d}.bad{color:#ff6b6b}.info{color:#9eb2cc}.row{padding:12px 0;border-bottom:1px solid #27364b}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class="box"><h1>Teste de isolamento — Entregador</h1><p class="info">HOMOLOGAÇÃO · somente leitura. Nenhum pedido ou cadastro será alterado.</p><div id="estado">Carregando sessão...</div><button id="btn" onclick="testar()" disabled>Testar isolamento</button><div id="resultado"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>let ctx=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function iniciar(){const e=document.getElementById('estado');try{const {auth,db,projectId}=await InterfoodAuthTeste.iniciar();await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sem sessão Firebase.'))},reject)});const u=auth.currentUser;const p=await db.collection('usuariosEntregadores').doc(u.uid).get({source:'server'});if(!p.exists)throw new Error('Perfil de entregador não encontrado.');const d=p.data()||{};ctx={auth,db,u,d,projectId};e.innerHTML='Sessão reconhecida: <b>'+esc(d.nome||u.email||u.uid)+'</b><br>Franquia: '+esc(d.franquiaId||'')+' · UID: '+esc(u.uid);document.getElementById('btn').disabled=false}catch(err){e.innerHTML='<span class="bad">Não foi possível reconhecer a sessão de entregador: '+esc(err.code||'')+' '+esc(err.message)+'</span>'}}async function testar(){const out=document.getElementById('resultado');out.innerHTML='';if(!ctx){out.innerHTML='<div class="bad">Sessão não carregada.</div>';return}const {db,d,u}=ctx,fid=d.franquiaId;let lojas;try{lojas=await db.collection('franquias').doc(fid).collection('estabelecimentos').get({source:'server'});out.innerHTML+='<div class="row ok">CORRETO ✅ Estabelecimentos da própria franquia podem ser consultados para operação.</div>'}catch(e){out.innerHTML+='<div class="row bad">ERRO ❌ Não foi possível consultar a própria franquia: '+esc(e.code||e.message)+'</div>';return}let lojaRef=null;lojas.forEach(x=>{if(!lojaRef)lojaRef=x.ref});if(lojaRef){try{const q=await lojaRef.collection('pedidos').where('status','==','Pronto').limit(1).get({source:'server'});out.innerHTML+='<div class="row ok">CORRETO ✅ Consulta de pedidos “Pronto” autorizada'+(q.empty?' (nenhum disponível agora).':'.')+'</div>'}catch(e){out.innerHTML+='<div class="row bad">ERRO ❌ Consulta de pedidos “Pronto” foi bloqueada: '+esc(e.code||e.message)+'</div>'}}if(lojaRef){try{await lojaRef.collection('pedidos').doc('PED-TESTE-001').get({source:'server'});out.innerHTML+='<div class="row bad">ATENÇÃO ❌ Foi possível ler um pedido arbitrário não destinado ao teste. Precisamos conferir se ele está atribuído a este entregador.</div>'}catch(e){out.innerHTML+='<div class="row ok">CORRETO ✅ O Firestore bloqueou a leitura de pedido arbitrário não autorizado.<br><span class="info">Retorno: '+esc(e.code||'permission-denied')+'</span></div>'}}try{await db.collection('franquias').doc('outra-franquia-teste').collection('estabelecimentos').doc('loja-teste').get({source:'server'});out.innerHTML+='<div class="row bad">FALHA DE SEGURANÇA ❌ Foi possível consultar outra franquia.</div>'}catch(e){out.innerHTML+='<div class="row ok">CORRETO ✅ O Firestore bloqueou o acesso a outra franquia.<br><span class="info">Retorno: '+esc(e.code||'permission-denied')+'</span></div>'}}iniciar();</script></body></html>
