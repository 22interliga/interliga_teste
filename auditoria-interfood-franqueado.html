<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoria Interfood — Franqueado</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px}.brand{font-size:22px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px;margin-bottom:12px}.num{font-size:24px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.sel{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px}.pedido{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px;height:max-content}.detail{display:none;margin-top:13px;border-top:1px solid var(--bd);padding-top:12px}.pedido.open .detail{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#0b1423;padding:10px;border-radius:9px}.timeline{border-left:2px solid #334155;margin:12px 0 0 6px;padding-left:14px}.ev{margin-bottom:10px}.lock{text-align:center;padding:40px}.bad{color:#ff6680;font-size:24px;font-weight:900}@media(max-width:700px){.stats,.grid,.filters{grid-template-columns:1fr 1fr}.row{flex-direction:column}}@media(max-width:480px){.grid,.filters{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand" id="brand">Auditoria Interfood</div><div class="sub" id="city"></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — visão do franqueado limitada exclusivamente à sua franquia.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function db(){return read('interliga_interfood_'+fid())}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function blocked(){let m=read('interliga_mensalidade_'+fid());if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>0}let last='';function detail(p){let e=p.entregador||{},h=p.historico||[];return'<div class="detail"><div class="grid"><div class="box"><div class="small">Estabelecimento</div><b>'+p.loja+'</b></div><div class="box"><div class="small">Entregador</div><b>'+(e.nome||'—')+'</b></div><div class="box"><div class="small">Veículo / placa</div><b>'+(e.veiculo||'—')+' · '+(e.placa||'—')+'</b></div><div class="box"><div class="small">Valor</div><b>'+money(p.valor)+'</b></div></div>'+(h.length?'<div class="timeline">'+h.map(x=>'<div class="ev"><b>'+x.status+'</b><div class="small">'+x.em+' · '+(x.por||e.nome||'—')+'</div></div>').join('')+'</div>':'<p class="small">Sem histórico de entrega registrado.</p>')+'</div>'}function render(){let c=cfg(),d=db(),ps=d.pedidos||[];$('brand').textContent='Auditoria · '+(c.nomeInterfood||'Interfood');$('city').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');if(blocked()){$('app').innerHTML='<div class="card lock"><div class="bad">Painel do franqueado bloqueado</div><p>A mensalidade desta franquia está em atraso.</p></div>';return}let loja=$('fLoja')?.value||'',st=$('fStatus')?.value||'';let lojas=[...new Set(ps.map(p=>p.loja))];let f=ps.filter(p=>(!loja||p.loja===loja)&&(!st||p.status===st));let concl=ps.filter(p=>p.status==='Concluído'),fat=concl.reduce((a,p)=>a+Number(p.valor||0),0),com=fat*Number(d.taxa||12)/100;$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+ps.length+'</div><div class="small">Pedidos da franquia</div></div><div class="card"><div class="num">'+concl.length+'</div><div class="small">Concluídos</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Vendas concluídas</div></div><div class="card"><div class="num">'+money(com)+'</div><div class="small">Comissão estimada</div></div></div><div class="filters"><select id="fLoja" class="sel" onchange="render()"><option value="">Todos os estabelecimentos</option>'+lojas.map(x=>'<option '+(x===loja?'selected':'')+'>'+x+'</option>').join('')+'</select><select id="fStatus" class="sel" onchange="render()"><option value="">Todos os status</option>'+['Novo','Confirmado','Em preparo','Pronto','Entregador aceitou','Coletado','Saiu para entrega','Concluído','Cancelado'].map(x=>'<option '+(x===st?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+f.map(p=>'<div class="card pedido" onclick="this.classList.toggle(\'open\')"><div class="row"><div><b>'+p.id+'</b> · '+p.loja+'<div class="small">'+p.entrega+' · '+money(p.valor)+(p.entregador?' · '+p.entregador.nome:'')+'</div></div><span class="badge">'+p.status+'</span></div>'+detail(p)+'</div>').join('')+(f.length?'':'<div class="card">Nenhum pedido para este filtro.</div>')}function sync(){let s=localStorage.getItem('interliga_interfood_'+fid())||'';if(s!==last){last=s;render()}}last=localStorage.getItem('interliga_interfood_'+fid())||'';render();window.addEventListener('storage',()=>{last='';sync()});setInterval(sync,700);window.addEventListener('focus',()=>{last='';sync()})</script></body></html>
