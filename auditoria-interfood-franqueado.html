<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoria Interfood — Franqueado Firebase</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px}.brand{font-size:22px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;border-radius:12px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px;margin-bottom:12px}.num{font-size:24px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.sel{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px}.pedido{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px;height:max-content}.detail{display:none;margin-top:13px;border-top:1px solid var(--bd);padding-top:12px}.pedido.open .detail{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#0b1423;padding:10px;border-radius:9px}.timeline{border-left:2px solid #334155;margin:12px 0 0 6px;padding-left:14px}.ev{margin-bottom:10px}.lock{text-align:center;padding:40px}.bad{color:#ff6680;font-size:22px;font-weight:900}.actions{text-align:right;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}@media(max-width:700px){.stats,.grid,.filters{grid-template-columns:1fr 1fr}.row{flex-direction:column}}@media(max-width:480px){.grid,.filters{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand" id="brand">Auditoria · Interfood</div><div class="sub" id="city">Firebase Homologação</div></div><div class="wrap"><div class="test">AMBIENTE DE HOMOLOGAÇÃO — franqueado autenticado e limitado exclusivamente à própria franquia pelo Firestore Rules.</div><div class="actions"><button class="btn" onclick="testarOutraFranquia()">Testar isolamento</button></div><div id="app"><div class="card">Carregando dados da franquia...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);let auth,db,perfil=null,pedidos=[],taxa=12;const firebaseConfig=window.INTERFOOD_FIREBASE_TEST_CONFIG;function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s??'').replace(/[&<>'\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function fmtTs(v){try{if(!v)return'—';const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString('pt-BR')}catch(e){return'—'}}function detalhe(p){const e=p.entregador||{};const eventos=[['Aceito',p.aceitoEm],['Coletado',p.coletadoEm],['Saiu para entrega',p.saiuEntregaEm],['Concluído',p.concluidoEm]].filter(x=>x[1]);return'<div class="detail"><div class="grid"><div class="box"><div class="small">Estabelecimento</div><b>'+esc(p.loja)+'</b></div><div class="box"><div class="small">Entregador</div><b>'+esc(e.nome||'—')+'</b></div><div class="box"><div class="small">Veículo / placa</div><b>'+esc((e.veiculo||'—')+' · '+(e.placa||'—'))+'</b></div><div class="box"><div class="small">Valor</div><b>'+money(p.valor)+'</b></div></div>'+(eventos.length?'<div class="timeline">'+eventos.map(x=>'<div class="ev"><b>'+esc(x[0])+'</b><div class="small">'+esc(fmtTs(x[1]))+' · '+esc(e.nome||'—')+'</div></div>').join('')+'</div>':'<p class="small">Sem eventos de entrega registrados.</p>')+'</div>'}function render(){const loja=$('fLoja')?.value||'',st=$('fStatus')?.value||'';const lojas=[...new Set(pedidos.map(p=>p.loja))].sort();const f=pedidos.filter(p=>(!loja||p.loja===loja)&&(!st||p.status===st));const concl=pedidos.filter(p=>p.status==='Concluído'),fat=concl.reduce((a,p)=>a+Number(p.valor||0),0),com=fat*Number(taxa||0)/100;$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+pedidos.length+'</div><div class="small">Pedidos da franquia</div></div><div class="card"><div class="num">'+concl.length+'</div><div class="small">Concluídos</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Vendas concluídas</div></div><div class="card"><div class="num">'+money(com)+'</div><div class="small">Comissão estimada ('+Number(taxa||0).toLocaleString('pt-BR')+'%)</div></div></div><div class="filters"><select id="fLoja" class="sel" onchange="render()"><option value="">Todos os estabelecimentos</option>'+lojas.map(x=>'<option '+(x===loja?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><select id="fStatus" class="sel" onchange="render()"><option value="">Todos os status</option>'+['Novo','Pendente','Confirmado','Em preparo','Pronto','Entregador aceitou','Coletado','Saiu para entrega','Concluído','Cancelado'].map(x=>'<option '+(x===st?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+f.map(p=>'<div class="card pedido" onclick="this.classList.toggle(\'open\')"><div class="row"><div><b>'+esc(p.numero||p.id)+'</b> · '+esc(p.loja)+'<div class="small">'+esc(p.entrega||'—')+' · '+money(p.valor)+(p.entregador?.nome?' · '+esc(p.entregador.nome):'')+'</div></div><span class="badge">'+esc(p.status||'Sem status')+'</span></div>'+detalhe(p)+'</div>').join('')+(f.length?'':'<div class="card">Nenhum pedido para este filtro.</div>')}async function carregar(){try{if(!firebaseConfig)throw new Error('Configuração Firebase de homologação não carregada.');if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sessão do franqueado não encontrada. Faça login.'))},reject)});const u=auth.currentUser,ps=await db.collection('franqueados').doc(u.uid).get();if(!ps.exists)throw new Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw new Error('Perfil de franqueado não autorizado.');const urlF=qs('franquia');if(urlF&&urlF!==perfil.franquiaId)throw new Error('A URL não corresponde à franquia autenticada.');$('brand').textContent='Auditoria · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId+' · Firebase '+firebaseConfig.projectId;try{const fs=await db.collection('franquias').doc(perfil.franquiaId).get();if(fs.exists){const fd=fs.data()||{};taxa=Number(fd.taxaInterfood??fd.taxa??12)}}catch(_){taxa=12}const estSnap=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();pedidos=[];for(const ed of estSnap.docs){const loja=ed.data()?.nome||ed.id;const pSnap=await ed.ref.collection('pedidos').get();pSnap.forEach(pd=>pedidos.push({id:pd.id,loja,lojaId:ed.id,...pd.data()}))}pedidos.sort((a,b)=>{const ta=a.criadoEm?.toMillis?a.criadoEm.toMillis():0,tb=b.criadoEm?.toMillis?b.criadoEm.toMillis():0;return tb-ta});render()}catch(e){$('app').innerHTML='<div class="card lock"><div class="bad">Acesso negado</div><p>'+esc(e.message)+'</p><p class="small">Entre pelo login Firebase do franqueado da homologação.</p></div>'}}async function testarOutraFranquia(){if(!db||!perfil)return;const outra=perfil.franquiaId==='candeias'?'outra-franquia-teste':'candeias';try{await db.collection('franquias').doc(outra).collection('estabelecimentos').get();alert('ATENÇÃO: acesso a outra franquia não foi bloqueado. Não avance.')}catch(e){if(e.code==='permission-denied'||String(e.message).toLowerCase().includes('permission'))alert('CORRETO ✅ O Firestore bloqueou o acesso a outra franquia.');else alert('Teste retornou: '+e.message)}}carregar();</script></body></html>
