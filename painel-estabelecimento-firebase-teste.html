<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Estabelecimento — Firebase</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px}.brand{font-size:21px;font-weight:900}.sub{font-size:12px}.wrap{max-width:1120px;margin:auto;padding:18px}.notice,.card{border-radius:14px;padding:15px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);margin-bottom:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.num{font-size:24px;font-weight:900}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px;height:max-content}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin-left:8px}.btn.op{margin:10px 8px 0 0}.btn.danger{background:#b42318}.btn.menu{background:#334155}.btn.alerta{background:#166534}.btn[disabled]{opacity:.55;cursor:not-allowed}.bad{color:#ff7188}.empty{text-align:center;padding:34px 15px}.actions{text-align:right;margin-bottom:12px}.pedido{padding:14px}.pedido.novoAlerta{border:2px solid #ff9d52;box-shadow:0 0 0 3px #ff6b0022}.pedido h4{margin:0 0 6px}.meta{display:flex;gap:14px;flex-wrap:wrap}.divider{height:1px;background:#223047;margin:12px 0}.itens{margin-top:10px;border:1px solid #2b3648;border-radius:10px;padding:10px;background:#0a1322}.item{padding:8px 0;border-bottom:1px solid #263247}.item:last-child{border-bottom:0}.itemNome{font-weight:900}.itemPreco{font-weight:800}.detalhe{margin-top:3px;color:#c3ccda;font-size:12px}.alertBox{display:none;position:sticky;top:8px;z-index:9;background:#7c2d12;border:2px solid #fb923c;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 8px 28px #0008}.alertBox.on{display:flex;justify-content:space-between;gap:12px;align-items:center;animation:pulse 1.1s infinite}.alertTitle{font-size:18px;font-weight:900}.alertSub{font-size:12px;color:#fed7aa;margin-top:3px}@keyframes pulse{50%{box-shadow:0 0 0 5px #fb923c44}}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{flex-direction:column}.actions{text-align:left}.btn{margin:0 8px 8px 0}.alertBox.on{align-items:stretch;flex-direction:column}}</style></head><body><div class="top"><div id="brand" class="brand">Interfood</div><div id="sub" class="sub">Homologação Firebase</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — login, isolamento e transições de status protegidos por Firebase Authentication + Firestore Rules.</div><div id="alertBox" class="alertBox"><div><div id="alertTitle" class="alertTitle">🔔 Novo pedido recebido</div><div id="alertSub" class="alertSub">Pedido aguardando atendimento.</div></div><button class="btn alerta" onclick="silenciarAlerta()">Entendi</button></div><div class="actions"><button class="btn menu" onclick="abrirCardapio()">Cardápio</button><button id="somBtn" class="btn menu" onclick="ativarSom()">🔊 Ativar som</button><button class="btn" onclick="testarOutraLoja()">Testar isolamento</button><button class="btn" onclick="sair()">Sair</button></div><div id="app"><div class="card">Carregando dados do estabelecimento...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);let ctx=null,perfil=null,lojaDoc=null,lojaRef=null,unsubscribePedidos=null,primeiraCarga=true,idsConhecidos=new Set(),somAtivo=false,audioCtx=null;function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s??'').replace(/[&<>'\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function proximoStatus(st){if(st==='Novo'||st==='Pendente')return['Confirmado','Aceitar pedido'];if(st==='Confirmado')return['Em preparo','Iniciar preparo'];if(st==='Em preparo')return['Pronto','Marcar como pronto'];return null}function renderItens(p){if(!Array.isArray(p.itens)||!p.itens.length)return'';return '<div class="itens"><b>🛒 Itens do pedido</b>'+p.itens.map(i=>{const variacao=i.variacao&&i.variacao.nome?esc(i.variacao.nome):'',ads=Array.isArray(i.adicionais)?i.adicionais.map(a=>esc(a.nome)+(Number(a.preco||0)>0?' (+'+money(a.preco)+')':'')).join(', '):'',q=Number(i.quantidade||1);return '<div class="item"><div class="row"><div><div class="itemNome">'+q+'x '+esc(i.nome||'Produto')+'</div>'+(variacao?'<div class="detalhe">Tamanho/variação: <b>'+variacao+'</b></div>':'')+(ads?'<div class="detalhe">Adicionais: '+ads+'</div>':'')+'</div><div class="itemPreco">'+money(i.subtotal||Number(i.valorUnitario||0)*q)+'</div></div></div>'}).join('')+'</div>'}async function carregar(){try{const {auth,db,projectId}=await InterfoodAuthTeste.iniciar();ctx={auth,db,projectId};await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sessão Firebase não encontrada.'))},reject)});const u=auth.currentUser,s=await db.collection('usuariosEstabelecimentos').doc(u.uid).get();if(!s.exists)throw new Error('Vínculo do estabelecimento não encontrado.');perfil=s.data()||{};const f=qs('franquia'),l=qs('loja');if(perfil.ativo!==true)throw new Error('Acesso bloqueado.');if(perfil.perfil!=='estabelecimento')throw new Error('Perfil não autorizado.');if(f!==perfil.franquiaId||l!==perfil.lojaId)throw new Error('A URL não corresponde ao vínculo autenticado.');lojaRef=db.collection('franquias').doc(f).collection('estabelecimentos').doc(l);const ls=await lojaRef.get();if(!ls.exists)throw new Error('Documento da loja não encontrado.');lojaDoc=ls.data()||{};$('brand').textContent='Interfood · '+(lojaDoc.nome||'Estabelecimento');$('sub').textContent='Franquia '+perfil.franquiaId+' · '+u.email+' · Firebase '+projectId;iniciarTempoReal()}catch(e){$('app').innerHTML='<div class="card"><h2 class="bad">Acesso negado</h2><p>'+esc(e.message)+'</p></div>'}}function iniciarTempoReal(){if(unsubscribePedidos)unsubscribePedidos();primeiraCarga=true;idsConhecidos.clear();unsubscribePedidos=lojaRef.collection('pedidos').onSnapshot(snap=>{const ps=[];snap.forEach(d=>ps.push({id:d.id,...d.data()}));ps.sort((a,b)=>{const ta=a.criadoEm&&a.criadoEm.toMillis?a.criadoEm.toMillis():0,tb=b.criadoEm&&b.criadoEm.toMillis?b.criadoEm.toMillis():0;return tb-ta});if(primeiraCarga){ps.forEach(p=>idsConhecidos.add(p.id));primeiraCarga=false}else{const recebidos=ps.filter(p=>!idsConhecidos.has(p.id)&&['Novo','Pendente'].includes(p.status));ps.forEach(p=>idsConhecidos.add(p.id));if(recebidos.length)dispararAlerta(recebidos)}renderPedidos(ps)},e=>{$('app').innerHTML='<div class="card"><h3 class="bad">Não foi possível acompanhar os pedidos</h3><p>'+esc(e.message)+'</p></div>'})}async function carregarPedidos(){return}function dispararAlerta(novos){const p=novos[0];$('alertTitle').textContent=novos.length===1?'🔔 Novo pedido '+(p.numero||'recebido'):'🔔 '+novos.length+' novos pedidos';$('alertSub').textContent=novos.length===1?money(p.valor)+' · '+(p.cliente||'Cliente'):'Há novos pedidos aguardando atendimento.';$('alertBox').classList.add('on');document.title='🔔 NOVO PEDIDO · Interfood';tocarSom();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Interfood · Novo pedido',{body:(p.numero||'Novo pedido')+' · '+money(p.valor),tag:'interfood-'+p.id})}catch(e){}}}function silenciarAlerta(){$('alertBox').classList.remove('on');document.title='Painel do Estabelecimento — Firebase'}async function ativarSom(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();somAtivo=true;$('somBtn').textContent='🔊 Som ativado';if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();tocarSom()}catch(e){alert('Não foi possível ativar o som neste navegador.')}}function tocarSom(){if(!somAtivo||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(880,audioCtx.currentTime);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45);o.start();o.stop(audioCtx.currentTime+.45)}catch(e){}}function renderPedidos(ps){const novos=ps.filter(p=>['Novo','Pendente'].includes(p.status)).length,preparo=ps.filter(p=>p.status==='Em preparo').length,concl=ps.filter(p=>p.status==='Concluído'),fat=concl.reduce((a,p)=>a+Number(p.valor||0),0);let html='<div class="stats"><div class="card"><div class="num">'+novos+'</div><div class="small">Novos</div></div><div class="card"><div class="num">'+preparo+'</div><div class="small">Em preparo</div></div><div class="card"><div class="num">'+ps.length+'</div><div class="small">Pedidos da loja</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Concluído</div></div></div><h3>Pedidos</h3>';if(!ps.length){html+='<div class="card empty"><h3>Nenhum pedido no Firestore ainda</h3></div>'}else{html+=ps.map(p=>{const prox=proximoStatus(p.status),podeRecusar=['Novo','Pendente'].includes(p.status),podeCancelar=p.status==='Confirmado';return '<div class="card pedido '+(['Novo','Pendente'].includes(p.status)?'novoAlerta':'')+'"><div class="row"><div><h4>'+esc(p.numero||p.id)+'</h4><div class="meta"><span>'+money(p.valor)+'</span><span class="small">'+esc(p.cliente||'Cliente não informado')+'</span><span class="small">Entrega: '+esc(p.entrega||'—')+'</span></div></div><span class="badge">'+esc(p.status||'Sem status')+'</span></div>'+renderItens(p)+(p.endereco?'<div class="divider"></div><div class="small">Endereço: '+esc(p.endereco)+'</div>':'')+(p.motivoCancelamento?'<div class="divider"></div><div class="small bad">Motivo: '+esc(p.motivoCancelamento)+'</div>':'')+(prox?'<button class="btn op" onclick="mudarStatus(\''+esc(p.id)+'\',\''+esc(prox[0])+'\',this)">'+esc(prox[1])+'</button>':'')+(podeRecusar?'<button class="btn op danger" onclick="cancelarPedido(\''+esc(p.id)+'\',\'Recusado\',this)">Recusar pedido</button>':'')+(podeCancelar?'<button class="btn op danger" onclick="cancelarPedido(\''+esc(p.id)+'\',\'Cancelado\',this)">Cancelar pedido</button>':'')+'</div>'}).join('')} $('app').innerHTML=html}function abrirCardapio(){if(!perfil)return;location.href='cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}async function mudarStatus(id,novo,btn){if(!lojaRef)return;const rotulo=btn.textContent;btn.disabled=true;btn.textContent='Salvando...';try{await lojaRef.collection('pedidos').doc(id).update({status:novo})}catch(e){btn.disabled=false;btn.textContent=rotulo;alert('Alteração bloqueada: '+e.message)}}async function cancelarPedido(id,status,btn){if(!lojaRef||!ctx.auth.currentUser)return;const acao=status==='Recusado'?'recusa':'cancelamento';const motivo=prompt('Informe o motivo da '+acao+' do pedido:');if(motivo===null)return;const m=motivo.trim();if(m.length<3){alert('Informe um motivo com pelo menos 3 caracteres.');return}if(m.length>300){alert('O motivo deve ter no máximo 300 caracteres.');return}const rotulo=btn.textContent;btn.disabled=true;btn.textContent='Salvando...';try{await lojaRef.collection('pedidos').doc(id).update({status:status,motivoCancelamento:m,canceladoPor:ctx.auth.currentUser.uid,canceladoEm:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){btn.disabled=false;btn.textContent=rotulo;alert('Alteração bloqueada: '+e.message)}}async function testarOutraLoja(){try{await ctx.db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc('outra-loja-teste').collection('pedidos').get();alert('ATENÇÃO: o acesso não foi bloqueado. Não avance.')}catch(e){if(e.code==='permission-denied'||String(e.message).toLowerCase().includes('permission'))alert('CORRETO ✅ O Firestore bloqueou o acesso a pedidos de outra loja.');else alert('Teste retornou: '+e.message)}}async function sair(){if(unsubscribePedidos)unsubscribePedidos();await InterfoodAuthTeste.sair();location.href='login-estabelecimento-firebase-teste.html?v=dd7c63b4'}carregar();</script></body></html>
