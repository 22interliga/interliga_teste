<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Firebase — Estabelecimento</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.ok{color:#62e993}.bad{color:#ff7188}.warn{color:#ffd166}.small{font-size:12px;color:#9da9ba}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin-right:8px;margin-top:8px}code{word-break:break-all}</style></head><body><div class="top"><b>Interfood · Homologação Firebase</b></div><div class="wrap"><div id="app" class="card">Validando sessão e regras do Firestore...</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js"></script><script src="firebase-auth-interfood-teste.js"></script><script>const $=x=>document.getElementById(x);const qs=k=>new URLSearchParams(location.search).get(k);let ctx=null;function box(t,c=''){return'<div class="card '+c+'">'+t+'</div>'}async function carregar(){try{const {auth,db,projectId}=await InterfoodAuthTeste.iniciar();ctx={auth,db,projectId};await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sessão Firebase não encontrada. Faça login novamente.'))},reject)});const u=auth.currentUser,perfilSnap=await db.collection('usuariosEstabelecimentos').doc(u.uid).get();if(!perfilSnap.exists)throw new Error('Vínculo do estabelecimento não encontrado.');const p=perfilSnap.data()||{},f=qs('franquia'),l=qs('loja');if(p.ativo!==true)throw new Error('Acesso do estabelecimento está bloqueado.');if(p.perfil!=='estabelecimento')throw new Error('Perfil não autorizado.');if(f!==p.franquiaId||l!==p.lojaId)throw new Error('A URL foi alterada. O vínculo autenticado não permite esta franquia/loja.');let propria='';try{const s=await db.collection('franquias').doc(f).collection('estabelecimentos').doc(l).get();propria=s.exists?'Leitura da própria loja autorizada pelo Firestore. Documento encontrado.':'Leitura da própria loja autorizada pelo Firestore. Documento da loja ainda não foi criado no Firestore.'}catch(e){propria='Falha ao ler a própria loja: '+e.message}$('app').innerHTML=box('<h2 class="ok">Login Firebase confirmado ✅</h2><p><b>E-mail:</b> '+u.email+'</p><p><b>Franquia vinculada:</b> '+p.franquiaId+'</p><p><b>Loja vinculada:</b> <code>'+p.lojaId+'</code></p><p><b>Projeto Firebase:</b> '+projectId+'</p><p class="ok">'+propria+'</p><div class="small">Agora teste a proteção do servidor.</div><button class="btn" onclick="testarOutraLoja()">Testar acesso a outra loja</button><button class="btn" onclick="sair()">Sair</button>')}catch(e){$('app').innerHTML=box('<h2 class="bad">Acesso negado</h2><p>'+e.message+'</p><button class="btn" onclick="location.href=\'login-estabelecimento-firebase-teste.html\'">Voltar ao login</button>','bad')}}async function testarOutraLoja(){try{const f=qs('franquia'),outra='outra-loja-teste';await ctx.db.collection('franquias').doc(f).collection('estabelecimentos').doc(outra).get();alert('ATENÇÃO: a leitura não foi bloqueada. Não avance.')}catch(e){if(e.code==='permission-denied'||String(e.message).toLowerCase().includes('permission'))alert('CORRETO ✅ O Firestore bloqueou o acesso à outra loja.');else alert('Teste retornou: '+e.message)}}async function sair(){await InterfoodAuthTeste.sair();location.href='login-estabelecimento-firebase-teste.html'}carregar();</script></body></html>
