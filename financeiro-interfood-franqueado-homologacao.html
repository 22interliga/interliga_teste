<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro Interfood · Franqueado</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.wrap{max-width:1180px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.num{font-size:24px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.sel{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px;width:100%}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.5fr .7fr .8fr .8fr .8fr;gap:8px;align-items:center;padding:11px 8px;border-bottom:1px solid #243047}.tr.head{font-size:12px;color:#94a3b8;font-weight:700}.right{text-align:right}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#22c55e1c;color:#86efac;font-size:11px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#3c4b61;color:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--p)}.actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.tr{grid-template-columns:1.4fr .7fr .8fr}.tr>*:nth-child(4),.tr>*:nth-child(5){display:none}}@media(max-width:480px){.stats,.filters{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand" id="brand">Financeiro · Interfood</div><div class="sub" id="city">Homologação</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — visão financeira somente da franquia autenticada. Nenhum valor é alterado nesta tela.</div><div class="actions"><button class="btn" onclick="voltar()">← Voltar à auditoria</button><button class="btn primary" onclick="comissoes()">⚙ Configurar comissões</button></div><div id="app"><div class="card">Carregando financeiro...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k),APP_NAME='interligaFranqueadoHomologacao';let app,auth,db,perfil,lojas=[],pedidos=[],taxaFranquia=12;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function taxaLoja(l){const n=Number(l.taxaComissaoInterfood??l.taxaInterfood);return Number.isFinite(n)&&n>=0?n:taxaFranquia}function voltar(){location.href='auditoria-interfood-franqueado.html?franquia='+encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}function comissoes(){location.href='configurar-comissao-interfood-franqueado-homologacao.html?franquia='+encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}function render(){const lojaId=$('fLoja')?.value||'';const periodo=$('fPeriodo')?.value||'todos';let inicio=0;if(periodo!=='todos'){const d=new Date();d.setHours(0,0,0,0);if(periodo==='hoje')inicio=d.getTime();if(periodo==='7')inicio=Date.now()-7*86400000;if(periodo==='30')inicio=Date.now()-30*86400000}const base=pedidos.filter(p=>p.status==='Concluído'&&(!lojaId||p.lojaId===lojaId)&&(!inicio||((p.concluidoEm?.toMillis?.()||p.criadoEm?.toMillis?.()||0)>=inicio)));const vendas=base.reduce((a,p)=>a+Number(p.valor||0),0);const comissao=base.reduce((a,p)=>{const l=lojas.find(x=>x.id===p.lojaId);return a+Number(p.valor||0)*taxaLoja(l||{})/100},0);const liquido=vendas-comissao;const linhas=lojas.filter(l=>!lojaId||l.id===lojaId).map(l=>{const ps=base.filter(p=>p.lojaId===l.id),v=ps.reduce((a,p)=>a+Number(p.valor||0),0),t=taxaLoja(l),c=v*t/100;return'<div class="tr"><div><b>'+esc(l.nome||l.id)+'</b><div class="small">'+esc(l.categoria||'Estabelecimento')+'</div></div><div>'+ps.length+' pedido(s)</div><div class="right"><b>'+money(v)+'</b></div><div class="right"><span class="pill">'+t.toLocaleString('pt-BR')+'%</span><div class="small">'+money(c)+'</div></div><div class="right"><b>'+money(v-c)+'</b></div></div>'}).join('');$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+base.length+'</div><div class="small">Pedidos concluídos</div></div><div class="card"><div class="num">'+money(vendas)+'</div><div class="small">Vendas concluídas</div></div><div class="card"><div class="num">'+money(comissao)+'</div><div class="small">Comissão da franquia</div></div><div class="card"><div class="num">'+money(liquido)+'</div><div class="small">Líquido dos estabelecimentos</div></div></div><div class="filters"><select id="fLoja" class="sel" onchange="render()"><option value="">Todos os estabelecimentos</option>'+lojas.map(l=>'<option value="'+esc(l.id)+'" '+(l.id===lojaId?'selected':'')+'>'+esc(l.nome||l.id)+'</option>').join('')+'</select><select id="fPeriodo" class="sel" onchange="render()"><option value="todos" '+(periodo==='todos'?'selected':'')+'>Todo o período</option><option value="hoje" '+(periodo==='hoje'?'selected':'')+'>Hoje</option><option value="7" '+(periodo==='7'?'selected':'')+'>Últimos 7 dias</option><option value="30" '+(periodo==='30'?'selected':'')+'>Últimos 30 dias</option></select></div><div class="card table"><div class="tr head"><div>Estabelecimento</div><div>Concluídos</div><div class="right">Vendas</div><div class="right">Comissão</div><div class="right">Líquido loja</div></div>'+linhas+(linhas?'':'<div class="empty">Nenhum estabelecimento neste filtro.</div>')+'</div><div class="card small">Taxa padrão atual da franquia: <b>'+taxaFranquia.toLocaleString('pt-BR')+'%</b>. Quando um estabelecimento possuir taxa própria cadastrada, o cálculo desta tela prioriza a taxa individual.</div>'}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});const ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');$('brand').textContent='Financeiro · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId;const fs=await db.collection('franquias').doc(perfil.franquiaId).get({source:'server'});if(fs.exists){const fd=fs.data()||{};const n=Number(fd.taxaInterfood??fd.taxa);if(Number.isFinite(n)&&n>=0)taxaFranquia=n}const es=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();for(const ed of es.docs){const l={id:ed.id,...ed.data()};lojas.push(l);const ps=await ed.ref.collection('pedidos').get();ps.forEach(pd=>pedidos.push({id:pd.id,lojaId:ed.id,...pd.data()}))}lojas.sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));render()}catch(e){$('app').innerHTML='<div class="card"><h2>Acesso bloqueado</h2><p>'+esc(e.message||e)+'</p></div>'}}carregar();</script></body></html>
