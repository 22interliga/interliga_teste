<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Estabelecimento — Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,92vw);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px}.logo{width:62px;height:62px;border-radius:15px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;margin-bottom:14px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:24px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.notice{margin:15px 0;padding:10px;border-radius:10px;background:#f59e0b18;border:1px solid #f59e0b66;color:#ffd166}.inp{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--bd);background:#172235;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.err{display:none;margin-top:12px;color:#ff7188;font-size:13px}.ok{display:none;margin-top:12px;color:#62e993;font-size:13px}</style></head><body><div class="box"><div class="logo" id="logo">IF</div><div class="brand" id="brand">Interfood</div><div class="sub" id="city"></div><div class="notice">AMBIENTE DE TESTE — login funcional apenas neste navegador. Ainda não usa autenticação Firebase real.</div><label>Usuário</label><input id="usuario" class="inp" autocomplete="username" placeholder="Digite o usuário"><label>Senha</label><input id="senha" class="inp" type="password" autocomplete="current-password" placeholder="Digite a senha"><button class="btn" onclick="entrar()">Entrar</button><div id="err" class="err"></div><div id="ok" class="ok"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function blocked(){let m=read('interliga_mensalidade_'+fid());if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>2}function iniciar(){let c=cfg();$('brand').textContent=c.nomeInterfood||'Interfood';$('city').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');let l=c.logoData||c.logoUrl||'';if(l)$('logo').innerHTML='<img src="'+l+'">'}function entrar(){let e=$('err'),o=$('ok');e.style.display=o.style.display='none';if(blocked()){e.textContent='Operação temporariamente indisponível para esta franquia.';e.style.display='block';return}let u=$('usuario').value.trim().toLowerCase(),s=$('senha').value,acs=read('interliga_acessos_estabelecimentos_'+fid()),achado=null;Object.keys(acs).some(id=>{let a=acs[id];if(a&&a.ativo!==false&&String(a.usuario||'').toLowerCase()===u&&String(a.senha||'')===s){achado={id,...a};return true}return false});if(!achado){e.textContent='Usuário ou senha inválidos.';e.style.display='block';return}let d=read('interliga_interfood_'+fid()),loja=(d.estabelecimentos||[]).find(x=>String(x.id)===String(achado.id));if(!loja||loja.status!=='Ativo'){e.textContent='Este estabelecimento está inativo ou não foi encontrado.';e.style.display='block';return}sessionStorage.setItem('interliga_sessao_estabelecimento',JSON.stringify({franquiaId:fid(),lojaId:achado.id,usuario:achado.usuario,loginEm:new Date().toISOString()}));o.textContent='Acesso autorizado. Abrindo '+loja.nome+'...';o.style.display='block';setTimeout(()=>location.href='painel-estabelecimento-teste.html?franquia='+encodeURIComponent(fid())+'&loja='+encodeURIComponent(achado.id)+'&login=1',350)}iniciar();document.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()})</script></body></html>
