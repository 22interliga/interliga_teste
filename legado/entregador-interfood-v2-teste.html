<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entregador Interfood V2</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{padding:16px 20px;background:var(--p);display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;background:#fff;color:#111;border-radius:12px;display:grid;place-items:center;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:21px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px;margin-bottom:12px}.inp{width:100%;padding:11px;border-radius:9px;border:1px solid var(--bd);background:#172235;color:#fff;margin:6px 0}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px}.ok{color:#65e89a;font-size:12px}.timeline{border-left:2px solid var(--bd);margin-top:12px;padding-left:12px}.ev{margin-bottom:9px}.empty{text-align:center;padding:30px}@media(max-width:600px){.row{flex-direction:column;align-items:flex-start}.btn{width:100%}}</style></head><body><div class="top"><div class="logo" id="logo">IF</div><div><div id="brand" class="brand">Entregador Interfood</div><div id="sub" class="sub"></div></div></div><div class="wrap"><div class="test">VERSÃO 2 — cada ação grava entregador, veículo, placa e horário no próprio pedido.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function db(){return read('interliga_interfood_'+fid())}function cfg(){let d=read('interliga_franquia_'+fid());return{id:fid(),...d}}function dkey(){return'interliga_entregador_'+fid()}function driver(){let d=read(dkey());return d.nome?d:{nome:'Carlos Entregador',veiculo:'Moto',placa:'TESTE-01'}}function salvarDriver(){let d={nome:$('dnome').value.trim()||'Entregador',veiculo:$('dveic').value.trim()||'Moto',placa:$('dplaca').value.trim()||'-'};write(dkey(),d);render()}function agora(){return new Date().toLocaleString('pt-BR')}function acao(id,st){let d=db(),p=(d.pedidos||[]).find(x=>x.id===id),dr=driver();if(!p)return;p.entregador={nome:dr.nome,veiculo:dr.veiculo,placa:dr.placa};p.historico=p.historico||[];let em=agora();p.status=st;p.entregadorStatus=st;p.historico.push({status:st,em,por:dr.nome});if(st==='Entregador aceitou')p.aceitoEm=em;if(st==='Coletado')p.coletadoEm=em;if(st==='Saiu para entrega')p.saiuEntregaEm=em;if(st==='Concluído')p.concluidoEm=em;write('interliga_interfood_'+fid(),d);render()}function hist(p){return(p.historico||[]).length?'<div class="timeline">'+p.historico.map(x=>'<div class="ev"><b>'+x.status+'</b><div class="small">'+x.em+' · '+x.por+'</div></div>').join('')+'</div>':''}function render(){let c=cfg(),d=db(),dr=driver(),ps=(d.pedidos||[]).filter(p=>p.entrega==='Interfood'&&['Pronto','Entregador aceitou','Coletado','Saiu para entrega'].includes(p.status));$('brand').textContent='Entregador · '+(c.nomeInterfood||'Interfood');$('sub').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IF';$('app').innerHTML='<div class="card"><b>Dados do entregador</b><input id="dnome" class="inp" value="'+dr.nome+'" placeholder="Nome"><input id="dveic" class="inp" value="'+dr.veiculo+'" placeholder="Veículo"><input id="dplaca" class="inp" value="'+dr.placa+'" placeholder="Placa"><button class="btn" onclick="salvarDriver()">Salvar entregador</button><div class="ok">✓ Estes dados serão gravados no próximo pedido aceito.</div></div>'+(ps.length?ps.map(p=>'<div class="card"><div class="row"><div><b>Pedido '+p.id+'</b><div class="small">Retirada: '+p.loja+'</div></div><span class="badge">'+p.status+'</span></div>'+(p.entregador?'<p class="ok">Entregador registrado: '+p.entregador.nome+' · '+p.entregador.veiculo+' · '+p.entregador.placa+'</p>':'')+(p.status==='Pronto'?'<button class="btn" onclick="acao(\''+p.id+'\',\'Entregador aceitou\')">Aceitar entrega</button>':'')+(p.status==='Entregador aceitou'?'<button class="btn" onclick="acao(\''+p.id+'\',\'Coletado\')">Confirmar coleta</button>':'')+(p.status==='Coletado'?'<button class="btn" onclick="acao(\''+p.id+'\',\'Saiu para entrega\')">Iniciar entrega</button>':'')+(p.status==='Saiu para entrega'?'<button class="btn" onclick="acao(\''+p.id+'\',\'Concluído\')">Confirmar entrega</button>':'')+hist(p)+'</div>').join(''):'<div class="card empty">Nenhuma entrega disponível. Crie um novo pedido Interfood e marque como Pronto.</div>')}render();window.addEventListener('storage',render);setInterval(render,1200)</script></body></html>
