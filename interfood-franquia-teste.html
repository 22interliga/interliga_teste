<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood — Teste por Franquia</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.top{padding:16px 20px;background:var(--p);display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;background:#fff;border-radius:13px;display:grid;place-items:center;color:#111;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.85}.wrap{max-width:1100px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.num{font-size:25px;font-weight:900}.small{font-size:12px;color:#9da9ba}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab{border:1px solid var(--bd);background:#172235;color:#c9d3e2;border-radius:20px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--p);color:#fff}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.table th{color:#9da9ba}.badge{padding:5px 8px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px}.lock{text-align:center;max-width:620px;margin:45px auto;padding:32px}.lock .icon{font-size:52px}.bad{color:#ff5c7a;font-size:26px;font-weight:900}.inp{width:100%;padding:11px;border-radius:9px;border:1px solid var(--bd);background:#172235;color:#fff;margin:6px 0 12px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.saved{color:#62e993;font-size:12px;margin-left:8px;display:none}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><div class="logo" id="logo">IF</div><div><div class="brand" id="brand">Interfood</div><div class="sub" id="city"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — Interfood fixo por franquia. Nenhuma alteração na produção.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'madre'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function mensal(){return read('interliga_mensalidade_'+fid())}function op(){return read('interliga_operacao_'+fid())}function estado(m){if(m.pago===true)return'liberado';if(!m.vencimento)return'liberado';let h=new Date();h.setHours(0,0,0,0);let v=new Date(m.vencimento+'T00:00:00'),d=Math.floor((h-v)/86400000);return d>2?'bloqueado':'liberado'}function key(){return'interliga_interfood_'+fid()}function dados(){let d=read(key());return Object.keys(d).length?d:{estabelecimentos:[{nome:'Restaurante Central',status:'Ativo'},{nome:'Lanche da Praça',status:'Ativo'},{nome:'Pizzaria Local',status:'Ativo'}],pedidosHoje:37,emPreparo:6,emEntrega:4,faturamento:'1.286,00'}}function salvar(){let d=dados();d.taxa=$('taxa').value;d.raio=$('raio').value;localStorage.setItem(key(),JSON.stringify(d));$('saved').style.display='inline'}function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.s).classList.add('active')})}function render(){let c=cfg(),m=mensal(),s=estado(m),d=dados(),o=op(),nome=c.nomeInterfood||('Interfood '+(c.cidade||c.id));$('brand').textContent=nome;$('city').textContent='Operação exclusiva · '+(c.cidade||c.id);let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IF';let cor=c.coresAreas?.interfood||c.corDestaque||'#ff6b00';document.documentElement.style.setProperty('--p',cor);if(s==='bloqueado'){$('app').innerHTML='<div class="card lock"><div class="icon">🔒</div><div class="bad">Interfood temporariamente indisponível</div><p>A operação desta franquia está bloqueada após o período de carência da mensalidade.</p><p class="small">As demais franquias continuam independentes.</p></div>';return}$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+d.estabelecimentos.length+'</div><div class="small">Estabelecimentos</div></div><div class="card"><div class="num">'+d.pedidosHoje+'</div><div class="small">Pedidos hoje</div></div><div class="card"><div class="num">'+d.emPreparo+'</div><div class="small">Em preparo</div></div><div class="card"><div class="num">R$ '+d.faturamento+'</div><div class="small">Movimento hoje</div></div></div><div class="tabs"><button class="tab active" data-s="resumo">Resumo</button><button class="tab" data-s="lojas">Estabelecimentos</button><button class="tab" data-s="pedidos">Pedidos</button><button class="tab" data-s="config">Configuração local</button></div><section id="resumo" class="section active"><div class="card"><b>Operação Interfood desta franquia</b><p>Pedidos em entrega: '+d.emEntrega+'</p><p class="small">Todos os dados desta tela usam somente o identificador <b>'+c.id+'</b>.</p></div></section><section id="lojas" class="section"><div class="card"><table class="table"><tr><th>Estabelecimento</th><th>Status</th></tr>'+d.estabelecimentos.map(x=>'<tr><td>'+x.nome+'</td><td><span class="badge">'+x.status+'</span></td></tr>').join('')+'</table></div></section><section id="pedidos" class="section"><div class="card"><b>Pedidos locais</b><p>Hoje: '+d.pedidosHoje+' · Em preparo: '+d.emPreparo+' · Em entrega: '+d.emEntrega+'</p><p class="small">Nenhum pedido de outra franquia é carregado neste simulador.</p></div></section><section id="config" class="section"><div class="card"><b>Configuração local do Interfood</b><p class="small">Valores separados por franquia.</p><label>Taxa da franquia (%)</label><input id="taxa" class="inp" value="'+(d.taxa??o.foodTaxa??12)+'"><label>Raio padrão de entrega (km)</label><input id="raio" class="inp" value="'+(d.raio??o.foodRaio??8)+'"><button class="btn" onclick="salvar()">Salvar nesta franquia</button><span id="saved" class="saved">✓ Salvo</span></div></section>';tabs()}render();window.addEventListener('storage',render)</script></body></html>
