<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood — Operação Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.top{padding:16px 20px;background:var(--p);display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;background:#fff;border-radius:13px;display:grid;place-items:center;color:#111;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:22px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff;opacity:.85}.wrap{max-width:1180px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.num{font-size:25px;font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab{border:1px solid var(--bd);background:#172235;color:#c9d3e2;border-radius:20px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active,.btn{background:var(--p);color:#fff}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}.table th{color:#9da9ba}.badge{padding:5px 8px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px}.badge.off{background:#ef444422;color:#ff8c9d}.badge.wait{background:#f59e0b22;color:#ffd166}.inp,.sel{width:100%;padding:10px;border-radius:9px;border:1px solid var(--bd);background:#172235;color:#fff;margin:5px 0 10px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.gray{background:#253247}.btn.red{background:#b4233b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.saved{color:#62e993;font-size:12px;margin-left:8px}.lock{text-align:center;max-width:620px;margin:45px auto;padding:32px}.lock .icon{font-size:52px}.bad{color:#ff5c7a;font-size:26px;font-weight:900}@media(max-width:760px){.stats,.grid2{grid-template-columns:1fr 1fr}.table{min-width:680px}.scroll{overflow:auto}}@media(max-width:520px){.grid2{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="logo" id="logo">IF</div><div><div class="brand" id="brand">Interfood</div><div class="sub" id="city"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — operação Interfood isolada por franquia. Produção não é alterada.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'madre'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function mensal(){return read('interliga_mensalidade_'+fid())}function estado(m){if(m.pago===true||!m.vencimento)return'liberado';let h=new Date();h.setHours(0,0,0,0),v=new Date(m.vencimento+'T00:00:00'),d=Math.floor((h-v)/86400000);return d>2?'bloqueado':'liberado'}function key(){return'interliga_interfood_'+fid()}function seed(){return{estabelecimentos:[{id:'e1',nome:'Restaurante Central',categoria:'Restaurante',taxa:12,status:'Ativo',entrega:'Interfood'},{id:'e2',nome:'Lanche da Praça',categoria:'Lanches',taxa:10,status:'Ativo',entrega:'Própria'},{id:'e3',nome:'Pizzaria Local',categoria:'Pizzaria',taxa:12,status:'Ativo',entrega:'Interfood'}],pedidos:[{id:'P1001',loja:'Restaurante Central',valor:48.9,status:'Novo',entrega:'Interfood'},{id:'P1002',loja:'Lanche da Praça',valor:32,status:'Em preparo',entrega:'Própria'},{id:'P1003',loja:'Pizzaria Local',valor:76.5,status:'Pronto',entrega:'Interfood'}],taxa:12,raio:8,permitirDinheiro:true,permitirRetirada:true}}function dados(){let d=read(key());if(!d.estabelecimentos||!d.pedidos){d={...seed(),...d};write(key(),d)}return d}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function salvarD(d){write(key(),d);render()}function addLoja(){let d=dados(),nome=$('lnome').value.trim();if(!nome)return alert('Informe o nome do estabelecimento.');d.estabelecimentos.push({id:'e'+Date.now(),nome,categoria:$('lcat').value||'Restaurante',taxa:Number($('ltaxa').value||d.taxa),status:'Ativo',entrega:$('lentrega').value});salvarD(d)}function toggleLoja(id){let d=dados(),x=d.estabelecimentos.find(a=>a.id===id);if(x)x.status=x.status==='Ativo'?'Inativo':'Ativo';salvarD(d)}function addPedido(){let d=dados(),loja=$('ploja').value;if(!loja)return;d.pedidos.unshift({id:'P'+String(Date.now()).slice(-6),loja,valor:Number($('pvalor').value||0),status:'Novo',entrega:$('pentrega').value});salvarD(d)}function statusPedido(id,st){let d=dados(),p=d.pedidos.find(x=>x.id===id);if(p)p.status=st;salvarD(d)}function salvarConfig(){let d=dados();d.taxa=Number($('taxa').value||0);d.raio=Number($('raio').value||0);d.permitirDinheiro=$('dinheiro').checked;d.permitirRetirada=$('retirada').checked;write(key(),d);$('saved').textContent='✓ Salvo nesta franquia'}function tabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.s).classList.add('active')})}function render(){let c=cfg(),m=mensal(),s=estado(m),d=dados(),nome=c.nomeInterfood||('Interfood '+(c.cidade||c.id));$('brand').textContent=nome;$('city').textContent='Operação exclusiva · '+(c.cidade||c.id);let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IF';document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');if(s==='bloqueado'){$('app').innerHTML='<div class="card lock"><div class="icon">🔒</div><div class="bad">Interfood temporariamente indisponível</div><p>Esta franquia está bloqueada após a carência da mensalidade.</p></div>';return}let fat=d.pedidos.reduce((a,p)=>a+Number(p.valor||0),0),prep=d.pedidos.filter(p=>p.status==='Em preparo').length,ent=d.pedidos.filter(p=>p.status==='Saiu para entrega').length,lojas=d.estabelecimentos.filter(x=>x.status==='Ativo').length;$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+lojas+'</div><div class="small">Estabelecimentos ativos</div></div><div class="card"><div class="num">'+d.pedidos.length+'</div><div class="small">Pedidos</div></div><div class="card"><div class="num">'+prep+'</div><div class="small">Em preparo</div></div><div class="card"><div class="num">'+money(fat)+'</div><div class="small">Movimento</div></div></div><div class="tabs"><button class="tab active" data-s="resumo">Resumo</button><button class="tab" data-s="lojas">Estabelecimentos</button><button class="tab" data-s="pedidos">Pedidos</button><button class="tab" data-s="financeiro">Financeiro</button><button class="tab" data-s="config">Configuração</button></div><section id="resumo" class="section active"><div class="grid2"><div class="card"><b>Operação local</b><p>Em preparo: '+prep+' · Em entrega: '+ent+'</p><p class="small">franquiaId: '+c.id+'</p></div><div class="card"><b>Entrega</b><p>Entrega Interfood: '+d.pedidos.filter(p=>p.entrega==='Interfood').length+' pedidos</p><p>Entrega própria: '+d.pedidos.filter(p=>p.entrega==='Própria').length+' pedidos</p></div></div></section><section id="lojas" class="section"><div class="grid2"><div class="card"><b>Novo estabelecimento</b><input id="lnome" class="inp" placeholder="Nome"><input id="lcat" class="inp" placeholder="Categoria"><input id="ltaxa" class="inp" type="number" value="'+d.taxa+'" placeholder="Taxa %"><select id="lentrega" class="sel"><option>Interfood</option><option>Própria</option></select><button class="btn" onclick="addLoja()">Cadastrar estabelecimento</button></div><div class="card scroll"><table class="table"><tr><th>Estabelecimento</th><th>Categoria</th><th>Taxa</th><th>Entrega</th><th>Status</th><th></th></tr>'+d.estabelecimentos.map(x=>'<tr><td>'+x.nome+'</td><td>'+x.categoria+'</td><td>'+x.taxa+'%</td><td>'+x.entrega+'</td><td><span class="badge '+(x.status==='Ativo'?'':'off')+'">'+x.status+'</span></td><td><button class="btn gray" onclick="toggleLoja(\''+x.id+'\')">'+(x.status==='Ativo'?'Inativar':'Ativar')+'</button></td></tr>').join('')+'</table></div></div></section><section id="pedidos" class="section"><div class="grid2"><div class="card"><b>Simular novo pedido</b><select id="ploja" class="sel">'+d.estabelecimentos.filter(x=>x.status==='Ativo').map(x=>'<option>'+x.nome+'</option>').join('')+'</select><input id="pvalor" class="inp" type="number" step="0.01" placeholder="Valor do pedido"><select id="pentrega" class="sel"><option>Interfood</option><option>Própria</option></select><button class="btn" onclick="addPedido()">Criar pedido</button></div><div class="card scroll"><table class="table"><tr><th>Pedido</th><th>Loja</th><th>Valor</th><th>Entrega</th><th>Status</th><th>Ação</th></tr>'+d.pedidos.map(p=>'<tr><td>'+p.id+'</td><td>'+p.loja+'</td><td>'+money(p.valor)+'</td><td>'+p.entrega+'</td><td><span class="badge wait">'+p.status+'</span></td><td><select class="sel" onchange="statusPedido(\''+p.id+'\',this.value)"><option selected disabled>Alterar</option><option>Confirmado</option><option>Em preparo</option><option>Pronto</option><option>Saiu para entrega</option><option>Concluído</option><option>Cancelado</option></select></td></tr>').join('')+'</table></div></div></section><section id="financeiro" class="section"><div class="card"><b>Financeiro local</b><p>Movimento dos pedidos: '+money(fat)+'</p><p>Comissão estimada da franquia ('+d.taxa+'%): '+money(fat*d.taxa/100)+'</p><p class="small">Simulação local; não representa repasse financeiro real.</p></div></section><section id="config" class="section"><div class="card"><b>Configuração local</b><label>Taxa padrão da franquia (%)</label><input id="taxa" class="inp" type="number" value="'+d.taxa+'"><label>Raio padrão de entrega (km)</label><input id="raio" class="inp" type="number" value="'+d.raio+'"><label><input id="dinheiro" type="checkbox" '+(d.permitirDinheiro?'checked':'')+'> Permitir pagamento em dinheiro</label><br><br><label><input id="retirada" type="checkbox" '+(d.permitirRetirada?'checked':'')+'> Permitir retirada no estabelecimento</label><br><br><button class="btn" onclick="salvarConfig()">Salvar nesta franquia</button><span id="saved" class="saved"></span></div></section>';tabs()}render();window.addEventListener('storage',render)</script></body></html>
