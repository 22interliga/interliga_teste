<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Vincular produtos às categorias</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:980px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px;margin-bottom:14px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad}.card{background:var(--card);border:1px solid var(--bd)}.item{display:grid;grid-template-columns:1.5fr 1fr auto;gap:12px;align-items:end;border-top:1px solid #263247;padding:14px 0}.item:first-child{border-top:0}select{width:100%;padding:11px;border-radius:9px;border:1px solid #344158;background:#0b1424;color:#fff}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.sec{background:#3c4b61}.muted{font-size:12px;color:var(--muted)}.ok{color:#62e993}.bad{color:#ff7188}@media(max-width:700px){.item{grid-template-columns:1fr}.btn{width:100%}}</style></head><body><div class="top">Interfood · Produtos por categoria</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — esta tela organiza produtos existentes sem apagar nem recriar o cardápio.</div><div class="card"><h2 id="titulo">Carregando...</h2><p class="muted">Escolha a categoria de cada produto. Categorias inativas não aparecem para seleção.</p><button class="btn sec" onclick="categorias()">Gerenciar categorias</button> <button class="btn sec" onclick="voltar()">Voltar ao cardápio</button><div id="msg"></div></div><div class="card"><div id="lista" class="muted">Carregando produtos...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const qs=k=>new URLSearchParams(location.search).get(k),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let db,auth,perfil,lojaRef,categoriasAtivas=[];async function iniciar(){try{({db,auth}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok():no(Error('Faça login como estabelecimento.'))},no)});const p=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get({source:'server'});if(!p.exists)throw Error('Vínculo não encontrado.');perfil=p.data();if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw Error('A URL não corresponde à loja autenticada.');lojaRef=db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);const l=await lojaRef.get({source:'server'});$('titulo').textContent=(l.data()?.nome||'Estabelecimento')+' · Organização do cardápio';await carregar()}catch(e){$('msg').innerHTML='<p class="bad">'+esc(e.message||e)+'</p>'}}async function carregar(){const [cs,ps]=await Promise.all([lojaRef.collection('categoriasCardapio').get(),lojaRef.collection('cardapio').get()]);categoriasAtivas=[];cs.forEach(d=>{const x={id:d.id,...d.data()};if(x.ativo!==false)categoriasAtivas.push(x)});categoriasAtivas.sort((a,b)=>Number(a.ordem||999)-Number(b.ordem||999)||(a.nome||'').localeCompare(b.nome||''));const produtos=[];ps.forEach(d=>produtos.push({id:d.id,...d.data()}));produtos.sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.nome||'').localeCompare(b.nome||''));if(!categoriasAtivas.length){$('lista').innerHTML='<div class="bad">Nenhuma categoria ativa. Crie ou ative uma categoria primeiro.</div>';return}const opts=sel=>categoriasAtivas.map(c=>'<option value="'+esc(c.nome)+'" '+(String(sel||'').toLocaleLowerCase('pt-BR')===String(c.nome||'').toLocaleLowerCase('pt-BR')?'selected':'')+'>'+esc(c.nome)+' · ordem '+Number(c.ordem||0)+'</option>').join('');$('lista').innerHTML=produtos.length?produtos.map(p=>'<div class="item"><div><b>'+esc(p.nome||'Produto')+'</b><div class="muted">Categoria atual: '+esc(p.categoria||'Sem categoria')+'</div></div><div><div class="muted">Nova categoria</div><select id="cat_'+p.id+'">'+opts(p.categoria)+'</select></div><button class="btn" onclick="salvar(\''+p.id+'\')">Salvar</button></div>').join(''):'Nenhum produto cadastrado.'}async function salvar(id){try{const cat=$('cat_'+id).value;if(!cat)throw Error('Selecione uma categoria.');await lojaRef.collection('cardapio').doc(id).update({categoria:cat,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});$('msg').innerHTML='<p class="ok">Produto vinculado à categoria <b>'+esc(cat)+'</b> ✅</p>';await carregar()}catch(e){$('msg').innerHTML='<p class="bad">Não foi possível salvar: '+esc(e.message||e)+'</p>'}}function categorias(){location.href='categorias-cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}function voltar(){location.href='cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}iniciar();</script></body></html>
