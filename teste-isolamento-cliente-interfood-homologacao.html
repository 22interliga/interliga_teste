<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de isolamento — Cliente</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:#eef4ff;margin:0;padding:24px}.box{max-width:820px;margin:auto;background:#101b2d;border:1px solid #2b3a52;border-radius:16px;padding:22px}h1{margin-top:0}.ok{color:#36e58d}.bad{color:#ff6b6b}.info{color:#9eb2cc}.row{padding:12px 0;border-bottom:1px solid #27364b}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class="box"><h1>Teste de isolamento — Cliente</h1><p class="info">HOMOLOGAÇÃO · somente leitura. Nenhum pedido ou cadastro será alterado.</p><div id="estado">Carregando sessão...</div><button id="btn" onclick="testar()" disabled>Testar isolamento</button><div id="resultado"></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.2"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;const appName='interligaClienteHomologacao';const app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();let ctx=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function iniciar(){const e=document.getElementById('estado');auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){e.innerHTML='<span class="bad">Sem sessão de cliente autenticado. Abra esta página na mesma sessão de “Meus pedidos”.</span>';return}try{const s=await db.collection('clientes').doc(u.uid).get({source:'server'});if(!s.exists)throw new Error('Perfil de cliente não encontrado.');const d=s.data()||{};if(d.ativo!==true||d.perfil!=='cliente')throw new Error('Cliente sem acesso ativo.');ctx={u,d};e.innerHTML='Sessão reconhecida: <b>'+esc(d.nome||u.email||u.uid)+'</b><br>UID: '+esc(u.uid);document.getElementById('btn').disabled=false}catch(err){e.innerHTML='<span class="bad">Não foi possível reconhecer a sessão de cliente: '+esc(err.code||'')+' '+esc(err.message)+'</span>'}})}async function testar(){const out=document.getElementById('resultado');out.innerHTML='';if(!ctx){out.innerHTML='<div class="bad">Sessão não carregada.</div>';return}const uid=ctx.u.uid,fid='candeias';let lojas;try{lojas=await db.collection('franquias').doc(fid).collection('estabelecimentos').get({source:'server'});out.innerHTML+='<div class="row ok">CORRETO ✅ Estabelecimentos visíveis para navegação do cliente.</div>'}catch(e){out.innerHTML+='<div class="row bad">ERRO ❌ Não foi possível consultar estabelecimentos: '+esc(e.code||e.message)+'</div>';return}let propriaEncontrada=false,arbitrarioTestado=false;for(const loja of lojas.docs){const pedidos=loja.ref.collection('pedidos');try{const q=await pedidos.where('clienteUid','==',uid).limit(1).get({source:'server'});if(!q.empty){propriaEncontrada=true;out.innerHTML+='<div class="row ok">CORRETO ✅ O cliente conseguiu ler um pedido vinculado à própria conta.</div>';break}}catch(e){out.innerHTML+='<div class="row bad">ERRO ❌ Consulta dos próprios pedidos foi bloqueada: '+esc(e.code||e.message)+'</div>';return}}if(!propriaEncontrada)out.innerHTML+='<div class="row info">Nenhum pedido próprio encontrado agora. A regra de leitura própria permanece ativa.</div>';for(const loja of lojas.docs){if(arbitrarioTestado)break;try{const todos=await loja.ref.collection('pedidos').limit(10).get({source:'server'});for(const d of todos.docs){const p=d.data()||{};if(p.clienteUid&&p.clienteUid!==uid){arbitrarioTestado=true;out.innerHTML+='<div class="row bad">FALHA DE SEGURANÇA ❌ Foi possível ler um pedido de outro cliente.</div>';break}}}catch(e){if((e.code||'').includes('permission-denied')){arbitrarioTestado=true;out.innerHTML+='<div class="row ok">CORRETO ✅ O Firestore bloqueou a leitura de pedidos sem filtro da própria conta.<br><span class="info">Retorno: '+esc(e.code)+'</span></div>'}}}if(!arbitrarioTestado)out.innerHTML+='<div class="row info">Não foi possível localizar um pedido de terceiro para teste direto; a consulta ampla não retornou dados.</div>';try{await db.collection('clientes').doc('cliente-alheio-teste').get({source:'server'});out.innerHTML+='<div class="row bad">FALHA DE SEGURANÇA ❌ Foi possível consultar o perfil de outro cliente.</div>'}catch(e){out.innerHTML+='<div class="row ok">CORRETO ✅ O Firestore bloqueou o acesso ao perfil de outro cliente.<br><span class="info">Retorno: '+esc(e.code||'permission-denied')+'</span></div>'}}iniciar();</script></body></html>
