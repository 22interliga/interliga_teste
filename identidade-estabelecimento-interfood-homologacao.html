<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identidade da loja · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid #344158;border-radius:12px;padding:14px;background:#0a1322}.previewLogo,.previewCapa{width:100%;background:#111827;border:1px dashed #475569;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}.previewLogo{height:220px}.previewCapa{height:220px}.previewLogo img{max-width:85%;max-height:85%;object-fit:contain}.previewCapa img{width:100%;height:100%;object-fit:cover}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.sec{background:#334155}.danger{background:#b42318}.small{font-size:12px;color:var(--muted)}input[type=file]{width:100%;margin-top:10px}.ok{color:#62e993;margin-top:10px}.bad{color:#ff7188;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">Interfood · Identidade da loja</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cada estabelecimento pode ter sua própria logo e imagem de capa.</div><div class="card"><h2 id="titulo">Carregando...</h2><p class="small">Formatos aceitos: JPG, PNG e WEBP. Tamanho máximo: 5 MB por imagem.</p><div class="grid"><div class="box"><h3>Logo do estabelecimento</h3><div id="prevLogo" class="previewLogo">Sem logo cadastrada</div><input id="logo" type="file" accept="image/jpeg,image/png,image/webp"><button id="btnLogo" class="btn" onclick="enviar('logo')">Salvar logo</button> <button class="btn danger" onclick="remover('logo')">Remover</button></div><div class="box"><h3>Capa do estabelecimento</h3><div id="prevCapa" class="previewCapa">Sem capa cadastrada</div><input id="capa" type="file" accept="image/jpeg,image/png,image/webp"><button id="btnCapa" class="btn" onclick="enviar('capa')">Salvar capa</button> <button class="btn danger" onclick="remover('capa')">Remover</button></div></div><button class="btn sec" onclick="voltar()">Voltar às configurações</button><div id="msg"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const qs=k=>new URLSearchParams(location.search).get(k),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let ctx,perfil,storage,lojaDoc;const el=id=>document.getElementById(id);function basePath(tipo){return 'interfood/'+perfil.franquiaId+'/estabelecimentos/'+perfil.lojaId+'/'+tipo+'/'+tipo}function voltar(){location.href='configuracao-estabelecimento-interfood-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}function mostrar(tipo,url){const p=el(tipo==='logo'?'prevLogo':'prevCapa');p.innerHTML=url?'<img src="'+esc(url)+'" alt="'+tipo+'">':'Sem '+(tipo==='logo'?'logo':'capa')+' cadastrada'}async function carregar(tipo){try{const url=await storage.ref(basePath(tipo)).getDownloadURL();mostrar(tipo,url)}catch(e){if(e.code==='storage/object-not-found')mostrar(tipo,null);else throw e}}function validarArquivo(f){if(!f)throw Error('Selecione uma imagem.');if(f.size>5*1024*1024)throw Error('A imagem excede 5 MB.');if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Use JPG, PNG ou WEBP.');return f}async function enviar(tipo){const input=el(tipo),btn=el(tipo==='logo'?'btnLogo':'btnCapa');try{const f=validarArquivo(input.files[0]);btn.disabled=true;btn.textContent='Enviando...';el('msg').innerHTML='';const ref=storage.ref(basePath(tipo));await ref.put(f,{contentType:f.type,cacheControl:'public,max-age=3600'});const url=await ref.getDownloadURL();mostrar(tipo,url);el('msg').innerHTML='<div class="ok">'+(tipo==='logo'?'Logo':'Capa')+' salva com sucesso ✅</div>'}catch(e){el('msg').innerHTML='<div class="bad">Não foi possível salvar: '+esc(e.message||e)+'</div>'}finally{btn.disabled=false;btn.textContent=tipo==='logo'?'Salvar logo':'Salvar capa'}}async function remover(tipo){if(!confirm('Remover '+(tipo==='logo'?'a logo':'a capa')+' desta loja?'))return;try{await storage.ref(basePath(tipo)).delete();mostrar(tipo,null);el('msg').innerHTML='<div class="ok">Imagem removida.</div>'}catch(e){if(e.code==='storage/object-not-found'){mostrar(tipo,null);return}el('msg').innerHTML='<div class="bad">Não foi possível remover: '+esc(e.message||e)+'</div>'}}async function iniciar(){try{ctx=await InterfoodAuthTeste.iniciar();await new Promise((res,rej)=>{const off=ctx.auth.onAuthStateChanged(u=>{off();u?res(u):rej(Error('Faça login como estabelecimento.'))},rej)});const s=await ctx.db.collection('usuariosEstabelecimentos').doc(ctx.auth.currentUser.uid).get({source:'server'});if(!s.exists)throw Error('Vínculo do estabelecimento não encontrado.');perfil=s.data()||{};if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw Error('A URL não corresponde à loja autenticada.');storage=ctx.app.storage();lojaDoc=ctx.db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);const l=await lojaDoc.get({source:'server'});el('titulo').textContent=l.exists?(l.data().nome||'Estabelecimento'):'Estabelecimento';await Promise.all([carregar('logo'),carregar('capa')])}catch(e){el('msg').innerHTML='<div class="bad">'+esc(e.message||e)+'</div>';el('btnLogo').disabled=true;el('btnCapa').disabled=true}}iniciar();</script></body></html>
