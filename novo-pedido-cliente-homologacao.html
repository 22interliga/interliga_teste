<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo pedido · Interfood Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd)}label{display:block;margin:13px 0 6px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0a1322;color:#fff;font-size:16px}input[readonly]{opacity:.9;background:#111c2d}textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;margin-top:12px;border:0;border-radius:10px;padding:13px;background:var(--p);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn[disabled]{opacity:.55}.sec{background:#334155}.ok{margin-top:15px;color:#62e993}.bad{margin-top:15px;color:#ff7188}.small{font-size:12px;color:var(--muted)}.statusLoja{margin:10px 0;padding:10px 12px;border-radius:9px;font-weight:900}.aberta{background:#22c55e18;border:1px solid #22c55e66;color:#8bf0ad}.fechada{background:#ff718812;border:1px solid #ff718866;color:#ff9aac}.resumo{margin-top:14px;border:1px solid #344158;background:#0a1322;border-radius:12px;padding:12px}.resumoLinha{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #263247}.resumoLinha:last-child{border-bottom:0}.resumoTotal{font-size:18px;font-weight:900;margin-top:8px}a{color:#8fd0ff;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">Interfood · Pedido do Cliente</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cliente autenticado e pedido gravado apenas no Firebase de teste.</div><div class="card"><h2 id="titulo">Estabelecimento</h2><div class="small" id="destino"></div><div id="statusLoja" class="statusLoja">Consultando estado da loja no servidor...</div><div class="small" id="sessao">Validando cliente...</div><button class="btn sec" onclick="voltarCardapio()">Voltar ao cardápio</button><button class="btn sec" onclick="meusPedidos()">Meus pedidos</button><div id="resumoCarrinho" class="resumo" style="display:none"></div><label>Nome do cliente</label><input id="cliente" maxlength="120"><div class="grid"><div><label>Telefone</label><input id="telefone" maxlength="30"></div><div><label>Forma de pagamento</label><select id="pagamento"><option>Pix</option><option>Dinheiro</option><option>Cartão na entrega</option><option>Online</option></select></div></div><div class="grid"><div><label>Tipo de entrega</label><select id="entrega" onchange="ajustarEntrega()"><option>Interfood</option><option>Retirada</option></select></div><div><label>Valor do pedido</label><input id="valor" type="number" step="0.01" min="0.01" max="100000" value="39.90"></div></div><label>Endereço salvo</label><select id="enderecoSalvo" onchange="usarEnderecoSalvo()"><option value="">Digitar outro endereço</option></select><div class="small" id="infoEndereco"></div><label>Endereço de entrega</label><input id="endereco" maxlength="300"><label>Observações</label><textarea id="observacoes" maxlength="500" placeholder="Ex.: sem cebola, troco para R$ 50,00"></textarea><button class="btn" id="btn" onclick="enviarPedido()" disabled>Fazer pedido</button><button class="btn sec" onclick="sair()">Sair da conta</button><div id="msg"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nome=q.get('nome')||'TESTE TESTE';document.getElementById('titulo').textContent=nome;document.getElementById('destino').textContent='Franquia '+fid+' · Loja '+loja;const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();const lojaRef=db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja);let perfilCliente=null,enderecosCache={},lojaAceitando=false,carrinhoSessao=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function voltarCardapio(){location.href='cardapio-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nome)}function meusPedidos(){location.href='meus-pedidos-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nome)}function carregarCarrinhoSessao(){if(q.get('carrinho')!=='1')return;try{const raw=sessionStorage.getItem('interfoodCarrinhoHomologacao');if(!raw)return;const c=JSON.parse(raw);if(c.fid!==fid||c.loja!==loja||!Array.isArray(c.itens)||!c.itens.length)return;carrinhoSessao=c;const total=c.itens.reduce((s,x)=>s+Number(x.unitario||0)*Number(x.quantidade||1),0);valor.value=total.toFixed(2);valor.readOnly=true;resumoCarrinho.style.display='block';resumoCarrinho.innerHTML='<b>🛒 Resumo do carrinho</b>'+c.itens.map(x=>'<div class="resumoLinha"><div><b>'+esc(x.nome)+'</b><div class="small">'+(x.variacao?esc(x.variacao.nome):'')+(x.adicionais?.length?' · '+x.adicionais.map(a=>esc(a.nome)).join(', '):'')+' · qtd. '+Number(x.quantidade||1)+'</div></div><div>'+money(Number(x.unitario||0)*Number(x.quantidade||1))+'</div></div>').join('')+'<div class="resumoTotal">Total calculado: '+money(total)+'</div>'}catch(e){console.warn('Carrinho não carregado',e)}}function ajustarEntrega(){const retirada=entrega.value==='Retirada';endereco.disabled=retirada;enderecoSalvo.disabled=retirada;if(retirada){endereco.value='Retirada no estabelecimento';infoEndereco.textContent=''}else if(endereco.value==='Retirada no estabelecimento'){selecionarPrincipalOuPrimeiro()}}function montarEndereco(x){return [x.logradouro,x.bairro,x.cidade,x.uf].filter(Boolean).join(', ')+(x.complemento?' - '+x.complemento:'')}function usarEnderecoSalvo(){const x=enderecosCache[enderecoSalvo.value];if(!x){infoEndereco.textContent='';return}endereco.value=montarEndereco(x);infoEndereco.textContent=x.principal===true?'Endereço principal selecionado.':''}function selecionarPrincipalOuPrimeiro(){const entries=Object.entries(enderecosCache);if(!entries.length){enderecoSalvo.value='';endereco.value='';infoEndereco.textContent='Nenhum endereço salvo. Você pode digitar outro endereço.';return}const achado=entries.find(([,x])=>x.principal===true)||entries[0];enderecoSalvo.value=achado[0];usarEnderecoSalvo()}async function verificarLojaServidor(){const s=await lojaRef.get({source:'server'});if(!s.exists)throw new Error('Estabelecimento não encontrado.');const v=s.data()||{};lojaAceitando=(v.ativo===true&&v.aceitandoPedidos===true);statusLoja.className='statusLoja '+(lojaAceitando?'aberta':'fechada');statusLoja.textContent=lojaAceitando?'LOJA ABERTA — aceitando pedidos':'LOJA FECHADA — não está aceitando novos pedidos';return lojaAceitando}async function sair(){await auth.signOut();location.href='login-cliente-firebase-teste.html'}async function carregarEnderecos(uid){try{const s=await db.collection('clientes').doc(uid).collection('enderecos').orderBy('criadoEm','desc').get();enderecosCache={};s.forEach(d=>enderecosCache[d.id]=d.data());enderecoSalvo.innerHTML='<option value="">Digitar outro endereço</option>'+Object.entries(enderecosCache).map(([id,x])=>'<option value="'+esc(id)+'">'+esc(x.apelido||'Endereço')+(x.principal?' ★':'')+' — '+esc(x.logradouro||'')+'</option>').join('');selecionarPrincipalOuPrimeiro()}catch(e){console.warn('Endereços não carregados:',e);endereco.value=''}}carregarCarrinhoSessao();auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){if(u&&u.isAnonymous)await auth.signOut();const destino=location.pathname.split('/').pop()+location.search;location.href='login-cliente-firebase-teste.html?destino='+encodeURIComponent(destino);return}try{const s=await db.collection('clientes').doc(u.uid).get();if(!s.exists)throw new Error('Perfil do cliente não encontrado.');perfilCliente=s.data();if(perfilCliente.ativo!==true||perfilCliente.perfil!=='cliente')throw new Error('Cliente sem acesso ativo.');cliente.value=perfilCliente.nome||'';telefone.value=perfilCliente.telefone||'';sessao.textContent='Cliente: '+(perfilCliente.nome||u.email)+' · '+u.email;await carregarEnderecos(u.uid);await verificarLojaServidor();btn.disabled=!lojaAceitando;if(!lojaAceitando)msg.innerHTML='<div class="bad"><b>Estabelecimento não está aceitando pedidos no momento.</b></div>'}catch(e){lojaAceitando=false;btn.disabled=true;statusLoja.className='statusLoja fechada';statusLoja.textContent='LOJA INDISPONÍVEL';msg.innerHTML='<div class="bad">'+esc(e.message||e)+'</div>'}});async function enviarPedido(){const u=auth.currentUser;if(!u||u.isAnonymous){location.href='login-cliente-firebase-teste.html';return}btn.disabled=true;btn.textContent='Verificando loja...';msg.innerHTML='';try{const aberta=await verificarLojaServidor();if(!aberta)throw new Error('Estabelecimento não está aceitando pedidos no momento.');const c=cliente.value.trim(),t=telefone.value.trim(),ent=entrega.value,v=Number(valor.value),end=endereco.value.trim(),obs=observacoes.value.trim(),pag=pagamento.value;if(c.length<2||c.length>120)throw new Error('Informe o nome corretamente.');if(!Number.isFinite(v)||v<=0||v>100000)throw new Error('Informe um valor válido.');if(carrinhoSessao){const calculado=carrinhoSessao.itens.reduce((s,x)=>s+Number(x.unitario||0)*Number(x.quantidade||1),0);if(Math.abs(calculado-v)>0.001)throw new Error('O total do carrinho foi alterado. Volte ao cardápio e refaça o pedido.')}if(ent==='Interfood'&&!end)throw new Error('Informe o endereço.');const ref=lojaRef.collection('pedidos').doc(),numero='PED-'+ref.id.slice(0,8).toUpperCase();await ref.set({numero,cliente:c,telefone:t,entrega:ent,valor:v,endereco:end,observacoes:obs,pagamento:pag,status:'Novo',clienteUid:u.uid,franquiaId:fid,lojaId:loja,criadoEm:firebase.firestore.FieldValue.serverTimestamp(),origem:'cliente-homologacao'});sessionStorage.removeItem('interfoodCarrinhoHomologacao');const rastreio='acompanhar-pedido-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&pedido='+encodeURIComponent(ref.id);msg.innerHTML='<div class="ok"><b>Pedido enviado com sucesso ✅</b><br>Número: '+esc(numero)+'<br><br><a href="'+rastreio+'">Acompanhar este pedido</a><br><br><a href="meus-pedidos-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nome)+'">Ver meus pedidos</a></div>'}catch(e){msg.innerHTML='<div class="bad"><b>Pedido bloqueado:</b> '+esc(e.message||e)+'</div>'}finally{btn.disabled=!lojaAceitando;btn.textContent='Fazer pedido'}}</script></body></html>
