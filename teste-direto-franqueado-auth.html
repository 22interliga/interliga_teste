<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Franqueado — Firebase</title><style>body{margin:0;background:#07101f;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#101827;border:1px solid #2b3648;border-radius:16px;padding:22px;box-sizing:border-box}h2{margin-top:0}label{display:block;font-size:12px;color:#9da9ba;margin:10px 0 5px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px}input{border:1px solid #2b3648;background:#0b1423;color:#fff}button{margin-top:14px;border:0;background:#1270c2;color:#fff;font-weight:800;cursor:pointer}.out{margin-top:14px;padding:12px;border-radius:10px;background:#0b1423;border:1px solid #2b3648;white-space:pre-wrap;word-break:break-word;min-height:56px}.ok{color:#75e69b}.bad{color:#ff7188}.note{font-size:12px;color:#9da9ba}</style></head><body><div class="card"><h2>Diagnóstico · Franqueado</h2><div class="note">Homologação — teste direto da Authentication e do vínculo /franqueados/{uid}.</div><label>E-mail</label><input id="email" type="email" autocomplete="off"><label>Senha</label><input id="senha" type="password" autocomplete="off"><button id="btn">Testar acesso</button><div id="out" class="out">Página carregada. Digite o e-mail e a senha do franqueado e clique em Testar acesso.</div></div><script>const API_KEY='AIzaSyBwMMsff1hV-6vDuQb3EK-EvSkkhYVBRFE';const PROJECT='interliga-homologacao-eb0f2';const out=document.getElementById('out');function show(t,ok){out.className='out '+(ok===true?'ok':ok===false?'bad':'');out.textContent=t}document.getElementById('btn').onclick=async()=>{const email=document.getElementById('email').value.trim();const password=document.getElementById('senha').value;show('1/3 Testando Firebase Authentication...');try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(API_KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})});const a=await r.json();if(!r.ok){show('FALHA NA AUTENTICAÇÃO\nHTTP '+r.status+'\n'+(a.error&&a.error.message?a.error.message:JSON.stringify(a)),false);return}show('2/3 Authentication OK\nUID: '+a.localId+'\nConsultando /franqueados/'+a.localId+' ...');const url='https://firestore.googleapis.com/v1/projects/'+PROJECT+'/databases/(default)/documents/franqueados/'+encodeURIComponent(a.localId);const dres=await fetch(url,{headers:{Authorization:'Bearer '+a.idToken}});const d=await dres.json();if(!dres.ok){show('AUTHENTICATION OK\nUID: '+a.localId+'\n\nFALHA AO LER O VÍNCULO\nHTTP '+dres.status+'\n'+(d.error&&d.error.message?d.error.message:JSON.stringify(d)),false);return}const f=d.fields||{};const perfil=f.perfil&&f.perfil.stringValue;const franquiaId=f.franquiaId&&f.franquiaId.stringValue;const ativo=f.ativo&&f.ativo.booleanValue;show('SUCESSO ✅\nUID: '+a.localId+'\nperfil: '+perfil+'\nfranquiaId: '+franquiaId+'\nativo: '+ativo,true)}catch(e){show('ERRO DE REDE/JAVASCRIPT\n'+e.message,false)}};</script></body></html>
