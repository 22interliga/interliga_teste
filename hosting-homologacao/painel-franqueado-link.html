<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Franqueado — Link Fixo</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;background:#060c1a}#erro{display:none;color:#fff;font-family:Arial;padding:30px}</style></head><body><div id="erro"></div><iframe id="frame" title="Painel do Franqueado"></iframe><script>(async function(){var p=new URLSearchParams(location.search),id=p.get('franquia')||'madre';if(!/^[a-z0-9_-]+$/i.test(id))id='madre';try{var r=await fetch('painel-franqueado.html?base='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Não foi possível carregar o painel');var h=await r.text();var alvo="localStorage.getItem('interliga_franquia_atual')||'madre'";var fixo="'"+id.replace(/'/g,'')+"'";h=h.split(alvo).join(fixo);h=h.replace('AMBIENTE DE TESTE — identidade, operação e mensalidade isoladas por franquia. Produção não é alterada.','AMBIENTE DE TESTE — franquia fixa por este link. Produção não é alterada.');document.getElementById('frame').srcdoc=h}catch(e){var x=document.getElementById('erro');x.style.display='block';x.textContent='Falha ao carregar painel de teste: '+e.message}})();</script></body></html>
