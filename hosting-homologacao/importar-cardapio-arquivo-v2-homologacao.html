<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Importar arquivo</title><style>body{margin:0;background:#07101f;color:#fff;font-family:Arial}.top{background:#ff6b00;padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#101827;border:1px solid #2b3648;border-radius:14px;padding:16px;margin-bottom:14px}.ok{color:#86efac}.warn{color:#facc15}.btn{border:0;border-radius:9px;padding:11px 14px;background:#ff6b00;color:#fff;font-weight:800;cursor:pointer;margin:5px}.sec{background:#3c4b61}.green{background:#15803d}.danger{background:#b42318}.muted{color:#aab4c4;font-size:12px}.hidden{display:none}input{padding:11px;border-radius:9px;border:1px solid #344158;background:#0b1424;color:#fff;width:100%;box-sizing:border-box}.row{display:grid;grid-template-columns:40px 1fr 1.3fr .6fr 1.6fr 80px;gap:8px;align-items:center;margin:8px 0}.head{font-size:12px;color:#94a3b8}@media(max-width:800px){.row{grid-template-columns:32px 1fr}.row>*:nth-child(n+3){grid-column:2}.head{display:none}}</style></head><body><div class="top">Interfood · Importar PDF / Excel / CSV</div><div class="wrap"><div class="card"><b class="ok">HOMOLOGAÇÃO</b><p class="muted">Os preços brasileiros como 21,90 são preservados e todos os itens passam por revisão antes da publicação.</p></div><div class="card"><h2>1. Selecione o arquivo</h2><input id="arq" type="file" accept=".csv,.xlsx,.xls,.pdf"><br><button class="btn" onclick="analisar()">Ler arquivo</button><button class="btn sec" onclick="voltar()">Voltar</button><p id="st"></p></div><div id="rev" class="card hidden"><h2>2. Revise antes de publicar</h2><div class="row head"><span>Usar</span><span>Categoria</span><span>Produto</span><span>Preço</span><span>Descrição</span><span>Ação</span></div><div id="linhas"></div><button class="btn green" onclick="publicar()">Publicar itens revisados</button></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const $=x=>document.getElementById(x),q=k=>new URLSearchParams(location.search).get(k);let db,auth,p,loja,itens=[];function preco(v){if(typeof v==='number')return Number.isFinite(v)?v:null;let s=String(v??'').trim().replace(/R\$/gi,'').replace(/\s/g,'');if(!s)return null;if(/^\d{1,3}(\.\d{3})+,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.');else if(/^\d+\.\d{1,2}$/.test(s)){}else if(/^\d+$/.test(s)){}else{s=s.replace(/[^0-9,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.')}const n=Number(s);return Number.isFinite(n)&&n>=0&&n<100000?n:null}const fmt=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});async function init(){try{({db,auth}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok():no(Error('Faça login.'))})});const s=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get();p=s.data();if(!s.exists||p.ativo!==true||p.perfil!=='estabelecimento'||q('franquia')!==p.franquiaId||q('loja')!==p.lojaId)throw Error('Acesso não autorizado.');loja=db.collection('franquias').doc(p.franquiaId).collection('estabelecimentos').doc(p.lojaId)}catch(e){document.querySelector('.wrap').innerHTML='<div class=card>'+e.message+'</div>'}}function lerBuf(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsArrayBuffer(f)})}function lerTxt(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f,'UTF-8')})}function map(rows){if(!rows.length)return[];const norm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),h=rows[0].map(norm);const idx=a=>h.findIndex(x=>a.includes(x));let ci=idx(['categoria','category']),ni=idx(['produto','nome','item','product']),pi=idx(['preco','valor','price']),di=idx(['descricao','description']);const cab=ni>=0||pi>=0;return rows.slice(cab?1:0).map(r=>({usar:true,categoria:String(cab&&ci>=0?r[ci]:r[0]||'Revisar').trim(),nome:String(cab&&ni>=0?r[ni]:r[1]||'').trim(),preco:preco(cab&&pi>=0?r[pi]:r[2]),descricao:String(cab&&di>=0?r[di]:r[3]||'').trim()})).filter(x=>x.nome.length>1&&Number.isFinite(x.preco))}function parseCSV(t){t=t.replace(/^\uFEFF/,'');const primeira=(t.split(/\r?\n/)[0]||'');const sep=primeira.includes(';')?';':',';return t.split(/\r?\n/).filter(x=>x.trim()).map(l=>{let a=[],cur='',asp=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(asp&&l[i+1]==='"'){cur+='"';i++}else asp=!asp}else if(c===sep&&!asp){a.push(cur);cur=''}else cur+=c}a.push(cur);return a.map(x=>x.trim())})}async function plan(f,ext){if(ext==='csv')return map(parseCSV(await lerTxt(f)));const wb=XLSX.read(await lerBuf(f),{type:'array',cellDates:false}),ws=wb.Sheets[wb.SheetNames[0]];return map(XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}))}async function pdf(f){const doc=await pdfjsLib.getDocument({data:new Uint8Array(await lerBuf(f))}).promise;let out=[],cat='Revisar';for(let n=1;n<=doc.numPages;n++){const tc=await (await doc.getPage(n)).getTextContent();for(const x of tc.items){const t=String(x.str||'').trim();if(!t)continue;const m=t.match(/^(.*?)(?:\s+|[-–—])(?:R\$\s*)?(\d{1,5}[.,]\d{2})$/);if(m){const pr=preco(m[2]);if(m[1].trim().length>1&&Number.isFinite(pr))out.push({usar:true,categoria:cat,nome:m[1].trim(),preco:pr,descricao:''})}else if(t.length<40&&!/\d/.test(t)&&t===t.toUpperCase())cat=t}}return out}async function analisar(){const f=$('arq').files[0];if(!f)return alert('Selecione um arquivo.');$('st').textContent='Lendo...';try{const e=f.name.split('.').pop().toLowerCase();itens=e==='pdf'?await pdf(f):await plan(f,e);$('st').innerHTML=itens.length?'<span class=ok>'+itens.length+' item(ns) encontrado(s). Revise os preços.</span>':'<span class=warn>Nenhum item identificado.</span>';render()}catch(e){$('st').innerHTML='<span class=warn>'+e.message+'</span>'}}function render(){$('rev').classList.remove('hidden');$('linhas').innerHTML=itens.map((x,i)=>'<div class=row><input type=checkbox '+(x.usar?'checked':'')+' onchange="itens['+i+'].usar=this.checked"><input value="'+x.categoria.replace(/"/g,'&quot;')+'" oninput="itens['+i+'].categoria=this.value"><input value="'+x.nome.replace(/"/g,'&quot;')+'" oninput="itens['+i+'].nome=this.value"><input value="'+fmt(x.preco)+'" inputmode=decimal oninput="itens['+i+'].preco=preco(this.value)"><input value="'+x.descricao.replace(/"/g,'&quot;')+'" oninput="itens['+i+'].descricao=this.value"><button class="btn danger" onclick="itens.splice('+i+',1);render()">Excluir</button></div>').join('')}async function publicar(){const v=itens.filter(x=>x.usar&&x.categoria.trim().length>1&&x.nome.trim().length>1&&Number.isFinite(x.preco));if(!v.length)return alert('Nenhum item válido.');if(!confirm('Publicar '+v.length+' item(ns)?'))return;try{const b=db.batch(),sv=firebase.firestore.FieldValue.serverTimestamp();v.forEach(x=>b.set(loja.collection('cardapio').doc(),{categoria:x.categoria.trim(),nome:x.nome.trim(),preco:Number(x.preco),descricao:x.descricao.trim().slice(0,500),ativo:true,criadoEm:sv,atualizadoEm:sv}));await b.commit();alert(v.length+' item(ns) publicado(s) ✅');voltar()}catch(e){alert(e.message)}}function voltar(){location.href='cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(p.franquiaId)+'&loja='+encodeURIComponent(p.lojaId)}init();</script></body></html>
