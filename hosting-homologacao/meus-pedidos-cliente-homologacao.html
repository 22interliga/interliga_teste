<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:920px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.alerta{display:none;border:1px solid #f59e0b;background:#f59e0b22;color:#ffd978;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:800}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.acoes{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.sec{background:#334155}.alertbtn{background:#475569}.alertbtn.ativo{background:#166534}.card{background:var(--card);border:1px solid var(--bd);margin:12px 0}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.numero{font-size:18px;font-weight:900}.status{font-size:12px;font-weight:900;padding:7px 10px;border-radius:999px;background:#3b2e19;color:#ffd45a}.meta{color:var(--muted);font-size:13px;margin-top:7px}.valor{font-size:18px;font-weight:900;margin-top:8px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--bd);border-radius:14px}.bad{color:#ff7188}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.row{flex-direction:column}.acoes,.bar .btn{width:100%}.acoes .btn{flex:1;text-align:center}}</style></head><body><div class="top">Interfood · Meus pedidos</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cada cliente visualiza somente os pedidos vinculados à própria conta.</div><div id="alertaStatus" class="alerta"></div><div class="bar"><div><b id="clienteNome">Validando cliente...</b><div class="small" id="clienteEmail"></div></div><div class="acoes"><button id="btnAlertas" class="btn alertbtn" type="button" onclick="ativarAlertas()">🔔 Ativar alertas</button><a id="novo" class="btn" href="novo-pedido-cliente-homologacao.html">Fazer novo pedido</a><button class="btn sec" onclick="sair()">Sair</button></div></div><div id="msg"></div><div id="lista"><div class="empty">Carregando seus pedidos...</div></div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.2"></script><script src="interfood-push-homologacao.js?v=2026.09.06.4"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nomeLoja=q.get('nome')||'TESTE TESTE';const statusConhecidos=new Map();let primeiraLeitura=true,audioCtx=null;const mensagensStatus={'Confirmado':'Seu pedido foi confirmado pelo estabelecimento.','Em preparo':'Seu pedido está sendo preparado.','Pronto':'Seu pedido está pronto e aguardando entregador.','Entregador aceitou':'Um entregador aceitou seu pedido.','Coletado':'Seu pedido foi coletado pelo entregador.','Saiu para entrega':'Seu pedido saiu para entrega.','Concluído':'Pedido entregue. Bom apetite!','Cancelado':'Seu pedido foi cancelado.','Recusado':'O estabelecimento recusou o pedido.'};novo.href='novo-pedido-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nomeLoja);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dinheiro(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function data(v){try{return v&&v.toDate?v.toDate().toLocaleString('pt-BR'):''}catch{return ''}}async function sair(){await auth.signOut();location.href='login-cliente-firebase-teste.html'}function atualizarBotaoAlertas(){const b=document.getElementById('btnAlertas');if(!b)return;const permissao=('Notification'in window&&Notification.permission==='granted');const push=localStorage.getItem('interfoodClientePushRegistrado')==='1';b.textContent=permissao&&push?'🔔 Push ativado':permissao?'🔔 Alertas ativados':'🔔 Ativar alertas';b.classList.toggle('ativo',permissao)}async function ativarAlertas(){if(!('Notification'in window)){alert('Este navegador não oferece notificações.');return}const b=document.getElementById('btnAlertas');try{if(b){b.disabled=true;b.textContent='Ativando...'}const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(p!=='granted'){localStorage.removeItem('interfoodClienteAlertas');localStorage.removeItem('interfoodClientePushRegistrado');atualizarBotaoAlertas();return}try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume()}catch{}localStorage.setItem('interfoodClienteAlertas','1');if(!window.InterfoodPush)throw new Error('Módulo de push não carregado.');await InterfoodPush.ativar({app,auth,role:'cliente',franquiaId:fid,lojaId:loja});localStorage.setItem('interfoodClientePushRegistrado','1');atualizarBotaoAlertas();const box=document.getElementById('alertaStatus');box.textContent='✅ Notificações push ativadas neste navegador.';box.style.display='block'}catch(e){localStorage.removeItem('interfoodClientePushRegistrado');atualizarBotaoAlertas();alert('Os alertas locais continuam disponíveis, mas o push não foi ativado: '+(e.message||e))}finally{if(b)b.disabled=false}}function som(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);o.start();o.stop(audioCtx.currentTime+.35)}catch{}}function avisar(p,status){const texto=mensagensStatus[status];if(!texto)return;const numero=p.numero||p.id||'Pedido';const box=document.getElementById('alertaStatus');box.textContent='🔔 '+numero+' · '+texto;box.style.display='block';document.title='🔔 '+status+' · Interfood';som();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Interfood · '+numero,{body:texto,tag:'interfood-cliente-'+p.id+'-'+status})}catch{}}}function verificarMudancas(docs){if(primeiraLeitura){docs.forEach(p=>statusConhecidos.set(p.id,p.status||''));primeiraLeitura=false;return}docs.forEach(p=>{const anterior=statusConhecidos.get(p.id);const atual=p.status||'';if(anterior!==undefined&&anterior!==atual)avisar(p,atual);statusConhecidos.set(p.id,atual)});const ids=new Set(docs.map(p=>p.id));for(const id of statusConhecidos.keys())if(!ids.has(id))statusConhecidos.delete(id)}function render(ds){const docs=ds.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const aa=a.criadoEm&&a.criadoEm.seconds||0,bb=b.criadoEm&&b.criadoEm.seconds||0;return bb-aa});verificarMudancas(docs);if(!docs.length){lista.innerHTML='<div class="empty">Você ainda não possui pedidos neste estabelecimento.</div>';return}lista.innerHTML=docs.map(p=>{const link='acompanhar-pedido-cliente-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&pedido='+encodeURIComponent(p.id);return '<div class="card"><div class="row"><div><div class="numero">'+esc(p.numero||p.id)+'</div><div class="meta">'+esc(p.cliente||'')+(data(p.criadoEm)?' · '+esc(data(p.criadoEm)):'')+'</div><div class="valor">'+dinheiro(p.valor)+'</div><div class="meta">Entrega: '+esc(p.entrega||'-')+' · Pagamento: '+esc(p.pagamento||'-')+'</div></div><div class="status">'+esc(p.status||'-')+'</div></div><div style="margin-top:14px"><a class="btn" href="'+link+'">Acompanhar pedido</a></div></div>'}).join('')}atualizarBotaoAlertas();auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){const dest=location.pathname.split('/').pop()+location.search;location.href='login-cliente-firebase-teste.html?destino='+encodeURIComponent(dest);return}try{const s=await db.collection('clientes').doc(u.uid).get();if(!s.exists||s.data().ativo!==true||s.data().perfil!=='cliente')throw new Error('Cliente sem acesso ativo.');clienteNome.textContent=s.data().nome||'Cliente';clienteEmail.textContent=u.email||'';db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja).collection('pedidos').where('clienteUid','==',u.uid).orderBy('criadoEm','desc').limit(50).onSnapshot(render,e=>{lista.innerHTML='<div class="bad">Não foi possível carregar seus pedidos: '+esc(e.message||e)+'</div>'})}catch(e){msg.innerHTML='<div class="bad">'+esc(e.message||e)+'</div>';lista.innerHTML='' }});</script></body></html>
