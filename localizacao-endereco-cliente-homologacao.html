<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localização do endereço · Interfood</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd)}select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0a1322;color:#fff;font-size:16px}#map{height:430px;border-radius:12px;margin:14px 0;border:1px solid var(--bd)}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin:5px 4px 5px 0}.sec{background:#334155}.ok{color:#62e993;margin-top:12px}.bad{color:#ff7188;margin-top:12px}.small{font-size:12px;color:var(--muted)}.coord{background:#0a1322;border:1px solid var(--bd);border-radius:9px;padding:11px;margin-top:8px}</style></head><body><div class="top">Interfood · Ponto do endereço</div><div class="wrap"><div class="notice">HOMOLOGAÇÃO — selecione um endereço salvo e marque o ponto real de entrega. Esse ponto será usado na validação do raio.</div><div class="card"><label>Endereço salvo</label><select id="enderecoSelect" onchange="trocarEndereco()"><option>Carregando...</option></select><div id="descricao" class="small" style="margin-top:8px"></div><div id="map"></div><div class="coord" id="coord">Nenhum ponto selecionado.</div><button class="btn" onclick="usarMinhaLocalizacao()">Usar minha localização atual</button><button class="btn" id="salvar" onclick="salvarPonto()" disabled>Salvar ponto do endereço</button><button class="btn sec" onclick="voltar()">Voltar aos endereços</button><div id="msg"></div><p class="small">Também é possível tocar/clicar no mapa para posicionar o marcador. Marque o ponto exato de entrega.</p></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nomeLoja=q.get('nome')||'TESTE TESTE';let cache={},ponto=null,marker=null;const map=L.map('map').setView([-12.66778,-38.55056],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function definirPonto(lat,lon,zoom=true){lat=Number(lat);lon=Number(lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)return;ponto={lat,lon};if(marker)marker.setLatLng([lat,lon]);else marker=L.marker([lat,lon]).addTo(map);if(zoom)map.setView([lat,lon],18);coord.textContent='Latitude: '+lat.toFixed(6)+' · Longitude: '+lon.toFixed(6);salvar.disabled=false}map.on('click',e=>definirPonto(e.latlng.lat,e.latlng.lng,false));function montar(x){return [x.logradouro,x.bairro,x.cidade,x.uf,x.cep].filter(Boolean).join(', ')}function trocarEndereco(){ponto=null;salvar.disabled=true;coord.textContent='Nenhum ponto selecionado.';if(marker){map.removeLayer(marker);marker=null}const x=cache[enderecoSelect.value];if(!x){descricao.textContent='';return}descricao.textContent=montar(x)+(x.principal?' · PRINCIPAL':'');if(Number.isFinite(Number(x.latitude))&&Number.isFinite(Number(x.longitude)))definirPonto(Number(x.latitude),Number(x.longitude),true)}function usarMinhaLocalizacao(){msg.innerHTML='';if(!navigator.geolocation){msg.innerHTML='<div class="bad">Este navegador não oferece localização.</div>';return}navigator.geolocation.getCurrentPosition(p=>definirPonto(p.coords.latitude,p.coords.longitude,true),e=>msg.innerHTML='<div class="bad">Não foi possível obter sua localização: '+esc(e.message||e)+'</div>',{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function voltar(){location.href='enderecos-cliente-interfood-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nomeLoja)}auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){location.href='login-cliente-firebase-teste.html';return}try{const p=await db.collection('clientes').doc(u.uid).get({source:'server'});if(!p.exists||p.data().ativo!==true||p.data().perfil!=='cliente')throw new Error('Cliente sem acesso ativo.');const s=await db.collection('clientes').doc(u.uid).collection('enderecos').orderBy('criadoEm','desc').get({source:'server'});cache={};s.forEach(d=>cache[d.id]=d.data());if(s.empty){enderecoSelect.innerHTML='<option value="">Nenhum endereço salvo</option>';descricao.textContent='Cadastre primeiro um endereço.';return}enderecoSelect.innerHTML=Object.entries(cache).map(([id,x])=>'<option value="'+esc(id)+'">'+esc(x.apelido||'Endereço')+(x.principal?' ★':'')+' — '+esc(x.logradouro||'')+'</option>').join('');const principal=Object.entries(cache).find(([,x])=>x.principal===true);if(principal)enderecoSelect.value=principal[0];trocarEndereco()}catch(e){msg.innerHTML='<div class="bad">'+esc(e.message||e)+'</div>'}});async function salvarPonto(){const u=auth.currentUser,id=enderecoSelect.value;if(!u||!id||!ponto)return;salvar.disabled=true;salvar.textContent='Salvando...';try{const ref=db.collection('clientes').doc(u.uid).collection('enderecos').doc(id);await ref.update({latitude:ponto.lat,longitude:ponto.lon,localizacaoAtualizadaEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});const d=await ref.get({source:'server'}),v=d.data()||{};if(Math.abs(Number(v.latitude)-ponto.lat)>.000001||Math.abs(Number(v.longitude)-ponto.lon)>.000001)throw new Error('O servidor não confirmou as coordenadas.');cache[id]=v;msg.innerHTML='<div class="ok">Ponto do endereço salvo e confirmado no servidor ✅</div>'}catch(e){msg.innerHTML='<div class="bad">Não foi possível salvar: '+esc(e.message||e)+'</div>'}finally{salvar.disabled=false;salvar.textContent='Salvar ponto do endereço'}}</script></body></html>
