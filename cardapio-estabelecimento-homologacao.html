<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Cardápio</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:20px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#7df0a5;padding:14px;border-radius:14px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#cbd5e1}input,textarea,select{width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #344158;background:#0b1424;color:#fff}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin:5px 6px 5px 0}.secondary{background:#3c4b61}.danger{background:#b42318}.green{background:#15803d}.muted{color:var(--muted);font-size:12px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #263247;padding:13px 0}.price{font-weight:900}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#22c55e22;color:#86efac}.off{background:#ef444422;color:#fda4af}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top">Interfood · Cardápio</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cardápio vinculado somente ao estabelecimento autenticado.</div><div id="app" class="card">Carregando...</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);let db,auth,lojaRef,perfil,editId=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function iniciar(){try{({db,auth}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok():no(new Error('Faça login como estabelecimento.'))},no)});const s=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get();if(!s.exists)throw Error('Vínculo não encontrado.');perfil=s.data();if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw Error('Loja da URL não corresponde à conta autenticada.');lojaRef=db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);renderBase();await listar()}catch(e){$('app').innerHTML='<h2>Acesso negado</h2><p>'+esc(e.message)+'</p>'}}function renderBase(){$('app').innerHTML='<h2>Gestão do cardápio</h2><p class="muted">Cadastre manualmente ou importe uma lista para revisão. Tudo permanece editável.</p><button class="btn" onclick="novo()">+ Novo produto</button><button class="btn secondary" onclick="mostrarImportacao()">Importar cardápio</button><button class="btn secondary" onclick="voltar()">Voltar ao painel</button><div id="form" class="card hidden"></div><div id="importar" class="card hidden"></div><div id="lista"></div>'}function novo(p){editId=p?.id||null;const f=$('form');f.classList.remove('hidden');f.innerHTML='<h3>'+(editId?'Editar produto':'Novo produto')+'</h3><div class="grid"><label>Categoria<input id="cat" value="'+esc(p?.categoria||'')+'" placeholder="Ex.: Lanches"></label><label>Produto<input id="nome" value="'+esc(p?.nome||'')+'" placeholder="Nome do produto"></label><label>Preço (R$)<input id="preco" value="'+esc(p?.preco??'')+'" inputmode="decimal" placeholder="0,00"></label><label>Disponibilidade<select id="ativo"><option value="true">Disponível</option><option value="false">Indisponível</option></select></label></div><label>Descrição<textarea id="desc" rows="3" placeholder="Descrição do produto">'+esc(p?.descricao||'')+'</textarea></label><br><button class="btn" onclick="salvar()">Salvar produto</button><button class="btn secondary" onclick="fecharForm()">Cancelar</button>';if(p&&p.ativo===false)$('ativo').value='false';f.scrollIntoView({behavior:'smooth'})}function fecharForm(){$('form').classList.add('hidden');editId=null}async function salvar(){const nome=$('nome').value.trim(),categoria=$('cat').value.trim(),descricao=$('desc').value.trim(),preco=Number($('preco').value.replace(',','.')),ativo=$('ativo').value==='true';if(nome.length<2||categoria.length<2||!Number.isFinite(preco)||preco<0)return alert('Preencha categoria, produto e preço corretamente.');const data={nome,categoria,descricao,preco,ativo,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()};try{if(editId)await lojaRef.collection('cardapio').doc(editId).update(data);else await lojaRef.collection('cardapio').add({...data,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});fecharForm();await listar()}catch(e){alert('Não foi possível salvar: '+e.message)}}async function listar(){try{const s=await lojaRef.collection('cardapio').get(),arr=[];s.forEach(d=>arr.push({id:d.id,...d.data()}));arr.sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.nome||'').localeCompare(b.nome||''));$('lista').innerHTML=arr.length?'<h3>Produtos ('+arr.length+')</h3>'+arr.map(p=>'<div class="item"><div><b>'+esc(p.nome)+'</b> <span class="badge '+(p.ativo===false?'off':'')+'">'+(p.ativo===false?'Indisponível':'Disponível')+'</span><div class="muted">'+esc(p.categoria)+' · '+esc(p.descricao||'Sem descrição')+'</div><div class="price">'+money(p.preco)+'</div></div><div><button class="btn secondary" onclick=\'editar('+JSON.stringify(p).replace(/'/g,"&#39;")+')\'>Editar</button><button class="btn '+(p.ativo===false?'green':'danger')+'" onclick="alternar(\''+p.id+'\','+(p.ativo!==false)+')">'+(p.ativo===false?'Disponibilizar':'Indisponível')+'</button></div></div>').join(''):'<div class="card muted">Nenhum produto cadastrado ainda.</div>'}catch(e){$('lista').innerHTML='<div class="card">Leitura bloqueada: '+esc(e.message)+'</div>'}}function editar(p){novo(p)}async function alternar(id,atual){try{await lojaRef.collection('cardapio').doc(id).update({ativo:!atual,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});await listar()}catch(e){alert('Alteração bloqueada: '+e.message)}}function mostrarImportacao(){const x=$('importar');x.classList.remove('hidden');x.innerHTML='<h3>Importar cardápio</h3><p class="muted">Primeira versão: cole os itens abaixo, um por linha, no formato <b>Categoria ; Produto ; Preço ; Descrição</b>. Isso permite importar em lote e revisar depois. PDF, imagem e Excel serão conectados à mesma estrutura em etapa posterior.</p><textarea id="textoImport" rows="8" placeholder="Lanches ; X-Burguer ; 18,90 ; Pão, carne, queijo\nBebidas ; Refrigerante ; 6,00 ; Lata 350ml"></textarea><br><button class="btn" onclick="importarTexto()">Importar e salvar</button><button class="btn secondary" onclick="xImport()">Cancelar</button>'}function xImport(){$('importar').classList.add('hidden')}async function importarTexto(){const linhas=$('textoImport').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!linhas.length)return alert('Cole pelo menos um produto.');const batch=db.batch();let n=0;for(const l of linhas){const a=l.split(';').map(x=>x.trim());const preco=Number((a[2]||'').replace(',','.'));if(a[0]?.length>=2&&a[1]?.length>=2&&Number.isFinite(preco)){const r=lojaRef.collection('cardapio').doc();batch.set(r,{categoria:a[0],nome:a[1],preco,descricao:a[3]||'',ativo:true,criadoEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});n++}}if(!n)return alert('Nenhuma linha válida. Use: Categoria ; Produto ; Preço ; Descrição');try{await batch.commit();xImport();alert(n+' produto(s) importado(s) ✅');await listar()}catch(e){alert('Importação bloqueada: '+e.message)}}function voltar(){location.href='painel-estabelecimento-firebase-teste.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}iniciar();</script></body></html>
