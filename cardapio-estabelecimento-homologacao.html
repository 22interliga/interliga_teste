<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Cardápio</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:20px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#7df0a5;padding:14px;border-radius:14px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#cbd5e1}input,textarea,select{width:100%;margin-top:6px;padding:12px;border-radius:9px;border:1px solid #344158;background:#0b1424;color:#fff}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin:5px 6px 5px 0}.secondary{background:#3c4b61}.danger{background:#b42318}.green{background:#15803d}.muted{color:var(--muted);font-size:12px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #263247;padding:13px 0}.price{font-weight:900}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#22c55e22;color:#86efac}.off{background:#ef444422;color:#fda4af}.hidden{display:none}.import-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}.import-option,.builder{border:1px solid #344158;background:#0b1424;border-radius:12px;padding:15px;margin-top:12px}.import-option b{display:block;margin-bottom:5px}.row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin:8px 0}.group{border:1px solid #344158;border-radius:10px;padding:12px;margin:10px 0}.summary{margin-top:5px;font-size:12px;color:#f7c38e}@media(max-width:800px){.grid,.import-options,.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top">Interfood · Cardápio</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — cardápio vinculado somente ao estabelecimento autenticado.</div><div id="app" class="card">Carregando...</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);let db,auth,lojaRef,perfil,editId=null,variacoes=[],grupos=[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=v=>Number(String(v||'0').replace(',','.'));async function iniciar(){try{({db,auth}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok():no(new Error('Faça login como estabelecimento.'))},no)});const s=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get();if(!s.exists)throw Error('Vínculo não encontrado.');perfil=s.data();if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw Error('Loja da URL não corresponde à conta autenticada.');lojaRef=db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);renderBase();await listar()}catch(e){$('app').innerHTML='<h2>Acesso negado</h2><p>'+esc(e.message)+'</p>'}}function renderBase(){$('app').innerHTML='<h2>Gestão do cardápio</h2><p class="muted">Cadastre produtos, tamanhos/variações e grupos de adicionais. Produtos já existentes continuam funcionando normalmente.</p><button class="btn" onclick="novo()">+ Novo produto</button><button class="btn secondary" onclick="mostrarImportacao()">Importar cardápio</button><button class="btn secondary" onclick="voltar()">Voltar ao painel</button><div id="form" class="card hidden"></div><div id="importar" class="card hidden"></div><div id="lista"></div>'}function novo(p){editId=p?.id||null;variacoes=Array.isArray(p?.variacoes)?JSON.parse(JSON.stringify(p.variacoes)):[];grupos=Array.isArray(p?.gruposAdicionais)?JSON.parse(JSON.stringify(p.gruposAdicionais)):[];const f=$('form');f.classList.remove('hidden');f.innerHTML='<h3>'+(editId?'Editar produto':'Novo produto')+'</h3><div class="grid"><label>Categoria<input id="cat" value="'+esc(p?.categoria||'')+'" placeholder="Ex.: Lanches"></label><label>Produto<input id="nome" value="'+esc(p?.nome||'')+'" placeholder="Nome do produto"></label><label>Preço base (R$)<input id="preco" value="'+esc(p?.preco??'')+'" inputmode="decimal" placeholder="0,00"></label><label>Disponibilidade<select id="ativo"><option value="true">Disponível</option><option value="false">Indisponível</option></select></label></div><label>Descrição<textarea id="desc" rows="3">'+esc(p?.descricao||'')+'</textarea></label><div class="builder"><b>📏 Tamanhos / variações</b><p class="muted">Ex.: Pequena, Média, Grande. O preço informado é o preço final daquela opção.</p><div id="vars"></div><button class="btn secondary" onclick="addVar()">+ Adicionar tamanho</button></div><div class="builder"><b>➕ Grupos de adicionais / complementos</b><p class="muted">Ex.: Adicionais, Molhos, Escolha seu acompanhamento.</p><div id="groups"></div><button class="btn secondary" onclick="addGroup()">+ Adicionar grupo</button></div><br><button class="btn" onclick="salvar()">Salvar produto</button><button class="btn secondary" onclick="fecharForm()">Cancelar</button>';if(p&&p.ativo===false)$('ativo').value='false';renderVars();renderGroups();f.scrollIntoView({behavior:'smooth'})}function renderVars(){$('vars').innerHTML=variacoes.length?variacoes.map((v,i)=>'<div class="row"><label>Nome<input value="'+esc(v.nome)+'" onchange="variacoes['+i+'].nome=this.value"></label><label>Preço (R$)<input inputmode="decimal" value="'+esc(v.preco)+'" onchange="variacoes['+i+'].preco=this.value"></label><button class="btn danger" onclick="variacoes.splice('+i+',1);renderVars()">Remover</button></div>').join(''):'<div class="muted">Sem variações. O produto usará apenas o preço base.</div>'}function addVar(){variacoes.push({nome:'',preco:''});renderVars()}function renderGroups(){$('groups').innerHTML=grupos.length?grupos.map((g,i)=>'<div class="group"><div class="grid"><label>Nome do grupo<input value="'+esc(g.nome)+'" onchange="grupos['+i+'].nome=this.value"></label><label>Tipo<select onchange="grupos['+i+'].obrigatorio=this.value===\'true\'"><option value="false" '+(!g.obrigatorio?'selected':'')+'>Opcional</option><option value="true" '+(g.obrigatorio?'selected':'')+'>Obrigatório</option></select></label><label>Mínimo<input type="number" min="0" value="'+Number(g.min||0)+'" onchange="grupos['+i+'].min=Number(this.value)"></label><label>Máximo<input type="number" min="1" value="'+Number(g.max||1)+'" onchange="grupos['+i+'].max=Number(this.value)"></label></div><div id="opts'+i+'">'+renderOpts(g,i)+'</div><button class="btn secondary" onclick="addOpt('+i+')">+ Complemento</button><button class="btn danger" onclick="grupos.splice('+i+',1);renderGroups()">Remover grupo</button></div>').join(''):'<div class="muted">Sem grupos de adicionais.</div>'}function renderOpts(g,gi){return (g.opcoes||[]).map((o,oi)=>'<div class="row"><label>Complemento<input value="'+esc(o.nome)+'" onchange="grupos['+gi+'].opcoes['+oi+'].nome=this.value"></label><label>Adicional (R$)<input inputmode="decimal" value="'+esc(o.preco)+'" onchange="grupos['+gi+'].opcoes['+oi+'].preco=this.value"></label><button class="btn danger" onclick="grupos['+gi+'].opcoes.splice('+oi+',1);renderGroups()">Remover</button></div>').join('')}function addGroup(){grupos.push({nome:'',obrigatorio:false,min:0,max:1,opcoes:[]});renderGroups()}function addOpt(i){grupos[i].opcoes=grupos[i].opcoes||[];grupos[i].opcoes.push({nome:'',preco:''});renderGroups()}function fecharForm(){$('form').classList.add('hidden');editId=null;variacoes=[];grupos=[]}async function salvar(){const nome=$('nome').value.trim(),categoria=$('cat').value.trim(),descricao=$('desc').value.trim(),preco=num($('preco').value),ativo=$('ativo').value==='true';if(nome.length<2||categoria.length<2||!Number.isFinite(preco)||preco<0)return alert('Preencha categoria, produto e preço corretamente.');const vs=variacoes.filter(v=>v.nome.trim()&&Number.isFinite(num(v.preco))).map(v=>({nome:v.nome.trim(),preco:num(v.preco),ativo:true}));const gs=[];for(const g of grupos){if(!g.nome.trim())continue;const opts=(g.opcoes||[]).filter(o=>o.nome.trim()&&Number.isFinite(num(o.preco))).map(o=>({nome:o.nome.trim(),preco:num(o.preco),ativo:true}));const min=Math.max(0,Number(g.min||0)),max=Math.max(1,Number(g.max||1));if(g.obrigatorio&&min<1)return alert('Grupo obrigatório precisa ter mínimo de 1 escolha.');if(min>max)return alert('O mínimo não pode ser maior que o máximo.');if(!opts.length)return alert('O grupo '+g.nome+' precisa ter pelo menos um complemento.');gs.push({nome:g.nome.trim(),obrigatorio:!!g.obrigatorio,min,max,opcoes:opts})}const data={nome,categoria,descricao,preco,ativo,variacoes:vs,gruposAdicionais:gs,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()};try{if(editId)await lojaRef.collection('cardapio').doc(editId).update(data);else await lojaRef.collection('cardapio').add({...data,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});fecharForm();await listar()}catch(e){alert('Não foi possível salvar: '+e.message)}}async function listar(){try{const s=await lojaRef.collection('cardapio').get(),arr=[];s.forEach(d=>arr.push({id:d.id,...d.data()}));arr.sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.nome||'').localeCompare(b.nome||''));$('lista').innerHTML=arr.length?'<h3>Produtos ('+arr.length+')</h3>'+arr.map(p=>{const nv=Array.isArray(p.variacoes)?p.variacoes.length:0,ng=Array.isArray(p.gruposAdicionais)?p.gruposAdicionais.length:0;return '<div class="item"><div><b>'+esc(p.nome)+'</b> <span class="badge '+(p.ativo===false?'off':'')+'">'+(p.ativo===false?'Indisponível':'Disponível')+'</span><div class="muted">'+esc(p.categoria)+' · '+esc(p.descricao||'Sem descrição')+'</div><div class="price">'+money(p.preco)+'</div>'+(nv||ng?'<div class="summary">'+nv+' variação(ões) · '+ng+' grupo(s) de adicionais</div>':'')+'</div><div><button class="btn secondary" onclick=\'editar('+JSON.stringify(p).replace(/'/g,"&#39;")+')\'>Editar</button><button class="btn '+(p.ativo===false?'green':'danger')+'" onclick="alternar(\''+p.id+'\','+(p.ativo!==false)+')">'+(p.ativo===false?'Disponibilizar':'Indisponível')+'</button></div></div>'}).join(''):'<div class="card muted">Nenhum produto cadastrado ainda.</div>'}catch(e){$('lista').innerHTML='<div class="card">Leitura bloqueada: '+esc(e.message)+'</div>'}}function editar(p){novo(p)}async function alternar(id,atual){try{await lojaRef.collection('cardapio').doc(id).update({ativo:!atual,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});await listar()}catch(e){alert('Alteração bloqueada: '+e.message)}}function mostrarImportacao(){const x=$('importar');x.classList.remove('hidden');x.innerHTML='<h3>Importar cardápio</h3><p class="muted">Escolha como deseja trazer os produtos. Todos os formatos validados permanecem separados para não interferir um no outro.</p><div class="import-options"><div class="import-option"><b>📷 Imagem com IA</b><span class="muted">JPG, PNG ou WEBP.</span><br><button class="btn" onclick="importarImagem()">Importar imagem</button></div><div class="import-option"><b>📄 PDF / Excel / CSV</b><span class="muted">PDF com texto, XLSX, XLS e CSV.</span><br><button class="btn" onclick="importarArquivo()">Importar arquivo</button></div><div class="import-option"><b>📝 Colar lista</b><span class="muted">Categoria ; Produto ; Preço ; Descrição.</span><br><button class="btn secondary" onclick="mostrarTexto()">Importar texto</button></div></div><div id="textoArea" class="hidden"><textarea id="textoImport" rows="8" placeholder="Lanches ; X-Burguer ; 18,90 ; Pão, carne, queijo"></textarea><br><button class="btn" onclick="importarTexto()">Importar e salvar</button></div><button class="btn secondary" onclick="xImport()">Fechar</button>'}function mostrarTexto(){$('textoArea').classList.remove('hidden')}function importarImagem(){location.href='importar-cardapio-imagem-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)+'&v=opcoes1'}function importarArquivo(){location.href='importar-cardapio-arquivo-v2-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)+'&v=opcoes1'}function xImport(){$('importar').classList.add('hidden')}async function importarTexto(){const linhas=$('textoImport').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!linhas.length)return alert('Cole pelo menos um produto.');const batch=db.batch();let n=0;for(const l of linhas){const a=l.split(';').map(x=>x.trim());const preco=num(a[2]);if(a[0]?.length>=2&&a[1]?.length>=2&&Number.isFinite(preco)){const r=lojaRef.collection('cardapio').doc();batch.set(r,{categoria:a[0],nome:a[1],preco,descricao:a[3]||'',ativo:true,criadoEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});n++}}if(!n)return alert('Nenhuma linha válida.');try{await batch.commit();xImport();alert(n+' produto(s) importado(s) ✅');await listar()}catch(e){alert('Importação bloqueada: '+e.message)}}function voltar(){location.href='painel-estabelecimento-firebase-teste.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}iniciar();</script></body></html>
