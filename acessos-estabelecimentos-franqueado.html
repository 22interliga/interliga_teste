<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessos dos Estabelecimentos — Firebase Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:16px 20px}.title{font-size:22px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.notice{margin:18px auto 14px;max-width:1120px;padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;border-radius:12px}.wrap{padding:0 18px 18px;max-width:1120px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.num{font-size:24px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px;height:max-content}.badge.off{background:#ef444422;color:#ff8c9d}.cred{margin-top:12px;padding:11px;background:#0b1423;border:1px solid #263449;border-radius:10px}.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.uid{font-family:monospace;font-size:11px;word-break:break-all}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;margin-top:10px}.btn.gray{background:#253247}.btn.red{background:#b91c1c}.btn.green{background:#15803d}.btn:disabled{opacity:.55;cursor:not-allowed}.lock{text-align:center;padding:35px}.bad{font-size:22px;color:#ff6680;font-weight:900}.warn{margin-top:14px;padding:11px;border:1px solid #f59e0b66;background:#f59e0b14;color:#ffd36a;border-radius:10px;font-size:12px}.okmsg{margin-top:12px;padding:10px;border:1px solid #22c55e66;background:#22c55e14;color:#8bf0ad;border-radius:9px;font-size:12px}@media(max-width:720px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="title" id="title">Estabelecimentos · Acessos</div><div class="sub" id="city">Firebase Homologação</div></div><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — o franqueado pode bloquear ou liberar somente acessos vinculados à própria franquia. Senhas nunca são exibidas nem armazenadas nesta tela.</div><div class="wrap"><div id="app"><div class="card">Carregando estabelecimentos...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);let auth,db,perfil,lojas=[],acessos=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function appFranqueado(){const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw new Error('Configuração Firebase de homologação não carregada.');try{return firebase.app('interligaFranqueadoHomologacao')}catch(_){return firebase.initializeApp(cfg,'interligaFranqueadoHomologacao')}}async function alternar(uid,novoAtivo){const a=acessos.find(x=>x.uid===uid);if(!a)return alert('Acesso não encontrado.');const acao=novoAtivo?'LIBERAR':'BLOQUEAR';if(!confirm(acao+' o acesso do estabelecimento '+(a.lojaId||'')+'?'))return;try{await db.collection('usuariosEstabelecimentos').doc(uid).update({ativo:novoAtivo});await carregar(true);alert(novoAtivo?'Acesso liberado com sucesso.':'Acesso bloqueado com sucesso.')}catch(e){alert('Não foi possível alterar o acesso: '+e.message)}}function render(){const vinculados=new Map(acessos.map(a=>[String(a.lojaId||''),a]));const ativos=acessos.filter(a=>a.ativo===true).length;$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+lojas.length+'</div><div class="small">Estabelecimentos da franquia</div></div><div class="card"><div class="num">'+acessos.length+'</div><div class="small">Acessos Firebase vinculados</div></div><div class="card"><div class="num">'+ativos+'</div><div class="small">Acessos ativos</div></div></div><div class="grid">'+lojas.map(l=>{const a=vinculados.get(l.id);const ativoLoja=l.ativo!==false;return'<div class="card"><div class="row"><div><b>'+esc(l.nome||l.id)+'</b><div class="small">Loja: '+esc(l.id)+'</div></div><span class="badge '+(ativoLoja?'':'off')+'">'+(ativoLoja?'Estabelecimento ativo':'Estabelecimento inativo')+'</span></div><div class="cred">'+(a?'<div class="line"><span class="small">Acesso Firebase</span><b>'+(a.ativo===true?'Ativo':'Bloqueado')+'</b></div><div class="line"><span class="small">Perfil</span><b>'+esc(a.perfil||'—')+'</b></div><div class="small" style="margin-top:7px">UID autenticado</div><div class="uid">'+esc(a.uid)+'</div>':'<div class="small">Nenhum usuário Firebase vinculado a este estabelecimento.</div>')+'</div>'+(a?'<button class="btn '+(a.ativo===true?'red':'green')+'" onclick="alternar(\''+esc(a.uid)+'\','+(a.ativo===true?'false':'true')+')">'+(a.ativo===true?'Bloquear acesso':'Liberar acesso')+'</button> ':'')+'<a class="btn gray" href="login-estabelecimento-firebase-teste.html" target="_blank">Abrir login do estabelecimento</a></div>'}).join('')+'</div><div class="warn">Segurança: esta tela só pode alterar o campo <b>ativo</b> do vínculo de um estabelecimento da mesma franquia. UID, perfil, lojaId e franquiaId permanecem protegidos pelas Firestore Rules.</div>'}async function carregar(silencioso){try{const app=appFranqueado();auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(u=>{off();u?resolve(u):reject(new Error('Sessão do franqueado não encontrada. Faça login novamente.'))},reject)});const u=auth.currentUser;const ps=await db.collection('franqueados').doc(u.uid).get({source:'server'});if(!ps.exists)throw new Error('Cadastro de franqueado não encontrado para o UID autenticado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw new Error('Perfil de franqueado não autorizado.');const urlF=qs('franquia');if(urlF&&urlF!==perfil.franquiaId)throw new Error('A URL não corresponde à franquia autenticada.');$('title').textContent='Estabelecimentos · Acessos · '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · UID '+u.uid+' · franquia '+perfil.franquiaId;const est=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get();lojas=est.docs.map(d=>({id:d.id,...d.data()}));const ac=await db.collection('usuariosEstabelecimentos').where('franquiaId','==',perfil.franquiaId).get();acessos=ac.docs.map(d=>({uid:d.id,...d.data()}));render()}catch(e){if(!silencioso)$('app').innerHTML='<div class="card lock"><div class="bad">Acesso não carregado</div><p>'+esc(e.message)+'</p><div class="small">Se a mensagem for “Missing or insufficient permissions”, publique as regras novas da homologação antes de testar novamente.</div></div>';else throw e}}carregar(false);</script></body></html>
