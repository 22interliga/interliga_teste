<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessos dos Estabelecimentos — Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{padding:18px}.title{font-size:22px;font-weight:900}.small{font-size:12px;color:#9da9ba}.notice{margin:0 18px 14px;padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px}.wrap{padding:0 18px 18px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px;height:max-content}.badge.off{background:#ef444422;color:#ff8c9d}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;margin-top:10px}.btn.gray{background:#253247}.cred{margin-top:10px;padding:11px;background:#0b1423;border:1px solid #263449;border-radius:10px}.cred b{color:#fff}.empty,.lock{text-align:center;padding:35px}.bad{font-size:24px;color:#ff6680;font-weight:900}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="title" id="title">Estabelecimentos</div><div class="small" id="city"></div></div><div class="notice">AMBIENTE DE TESTE — o franqueado gera usuário e senha separados para cada estabelecimento da própria franquia.</div><div class="wrap"><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function db(){return read('interliga_interfood_'+fid())}function blocked(){let m=read('interliga_mensalidade_'+fid());if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function slug(s){return String(s||'loja').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)||'loja'}function chave(){return'interliga_acessos_estabelecimentos_'+fid()}function loginUrl(){return location.origin+location.pathname.replace('acessos-estabelecimentos-franqueado.html','login-estabelecimento-teste.html')+'?franquia='+encodeURIComponent(fid())}function gerar(loja){let a=read(chave()),s=String(Math.floor(100000+Math.random()*900000)),u=slug(loja.nome)+String(loja.id).slice(-3);a[loja.id]={usuario:u,senha:s,ativo:true,criadoEm:new Date().toISOString()};write(chave(),a);render()}function alternar(id){let a=read(chave());if(a[id]){a[id].ativo=a[id].ativo===false;write(chave(),a);render()}}function copiar(txt){navigator.clipboard?.writeText(txt).then(()=>alert('Copiado.')).catch(()=>prompt('Copie:',txt))}function render(){let c=cfg(),d=db(),ls=d.estabelecimentos||[],a=read(chave()),url=loginUrl();$('title').textContent='Acessos · '+(c.nomeInterfood||'Interfood');$('city').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');if(blocked()){$('app').innerHTML='<div class="card lock"><div class="bad">Painel bloqueado</div><p>A mensalidade desta franquia está em atraso.</p></div>';return}if(!ls.length){$('app').innerHTML='<div class="card empty">Nenhum estabelecimento cadastrado nesta franquia.</div>';return}$('app').innerHTML='<div class="grid">'+ls.map(x=>{let ac=a[x.id];return'<div class="card"><div class="row"><div><b>'+esc(x.nome)+'</b><div class="small">'+esc(x.categoria)+' · Entrega: '+esc(x.entrega)+'</div></div><span class="badge '+(x.status==='Ativo'?'':'off')+'">'+esc(x.status)+'</span></div>'+(ac?'<div class="cred"><div class="small">Usuário</div><b>'+esc(ac.usuario)+'</b><div class="small" style="margin-top:7px">Senha</div><b>'+esc(ac.senha)+'</b><div class="small" style="margin-top:7px">Acesso: '+(ac.ativo===false?'Bloqueado':'Ativo')+'</div></div><button class="btn" onclick="copiar(\''+String(ac.usuario).replace(/'/g,'')+'\')">Copiar usuário</button> <button class="btn" onclick="copiar(\''+String(ac.senha).replace(/'/g,'')+'\')">Copiar senha</button> <button class="btn gray" onclick="alternar(\''+String(x.id).replace(/'/g,'')+'\')">'+(ac.ativo===false?'Liberar':'Bloquear')+'</button> <button class="btn gray" onclick="gerar({id:\''+String(x.id).replace(/'/g,'')+'\',nome:\''+String(x.nome).replace(/'/g,'')+'\'})">Gerar nova senha</button>':'<button class="btn" onclick="gerar({id:\''+String(x.id).replace(/'/g,'')+'\',nome:\''+String(x.nome).replace(/'/g,'')+'\'})">Gerar acesso</button>')+'<div class="small" style="margin-top:10px">Login único da franquia:</div><div class="cred">'+esc(url)+'</div><a class="btn" href="'+esc(url)+'" target="_blank">Abrir tela de login</a></div>'}).join('')+'</div>'}render();window.addEventListener('storage',render);setInterval(render,1200)</script></body></html>
