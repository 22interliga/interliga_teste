<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessos dos Estabelecimentos — Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{padding:18px}.title{font-size:22px;font-weight:900}.small{font-size:12px;color:#9da9ba}.notice{margin:0 18px 14px;padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px}.wrap{padding:0 18px 18px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:15px}.row{display:flex;justify-content:space-between;gap:12px}.badge{padding:5px 8px;border-radius:99px;background:#22c55e22;color:#62e993;font-size:11px;height:max-content}.badge.off{background:#ef444422;color:#ff8c9d}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;margin-top:10px}.linkbox{margin-top:10px;padding:9px;background:#0b1423;border:1px solid #263449;border-radius:9px;font-size:11px;word-break:break-all;color:#a8bad0}.empty{text-align:center;padding:35px}.lock{text-align:center;padding:40px}.bad{font-size:24px;color:#ff6680;font-weight:900}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="title" id="title">Estabelecimentos</div><div class="small" id="city"></div></div><div class="notice">AMBIENTE DE TESTE — cada estabelecimento recebe acesso vinculado somente à sua franquia e à sua própria loja.</div><div class="wrap"><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function db(){return read('interliga_interfood_'+fid())}function blocked(){let m=read('interliga_mensalidade_'+fid());if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function painelUrl(loja){return location.origin+location.pathname.replace('acessos-estabelecimentos-franqueado.html','painel-estabelecimento-teste.html')+'?franquia='+encodeURIComponent(fid())+'&loja='+encodeURIComponent(loja.id)}function copiar(id){let u=painelUrl(id);navigator.clipboard?.writeText(u).then(()=>alert('Link copiado.')).catch(()=>prompt('Copie o link:',u))}function render(){let c=cfg(),d=db(),ls=d.estabelecimentos||[];$('title').textContent='Acessos · '+(c.nomeInterfood||'Interfood');$('city').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');if(blocked()){$('app').innerHTML='<div class="card lock"><div class="bad">Painel bloqueado</div><p>A mensalidade desta franquia está em atraso.</p></div>';return}if(!ls.length){$('app').innerHTML='<div class="card empty">Nenhum estabelecimento cadastrado nesta franquia.</div>';return}$('app').innerHTML='<div class="grid">'+ls.map(x=>{let u=painelUrl(x);return'<div class="card"><div class="row"><div><b>'+esc(x.nome)+'</b><div class="small">'+esc(x.categoria)+' · Entrega: '+esc(x.entrega)+'</div></div><span class="badge '+(x.status==='Ativo'?'':'off')+'">'+esc(x.status)+'</span></div><div class="linkbox">'+esc(u)+'</div><a class="btn" href="'+esc(u)+'" target="_blank">Abrir painel da loja</a> <button class="btn" onclick="copiar({id:\''+String(x.id).replace(/'/g,'')+'\'})">Copiar link</button></div>'}).join('')+'</div>'}render();window.addEventListener('storage',render);setInterval(render,1200)</script></body></html>
