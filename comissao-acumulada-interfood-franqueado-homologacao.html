<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comissão Acumulada · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px}.brand{font-size:23px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#fff}.wrap{max-width:1180px;margin:auto;padding:20px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;border-radius:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:12px}.num{font-size:24px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}.sel{padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px;width:100%}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.4fr .7fr .9fr .8fr .9fr;gap:8px;align-items:center;padding:11px 8px;border-bottom:1px solid #243047}.tr.head{font-size:12px;color:#94a3b8;font-weight:700}.right{text-align:right}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#22c55e1c;color:#86efac;font-size:11px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#3c4b61;color:#fff;font-weight:800;cursor:pointer}.actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:25px}.loading{display:flex;align-items:center;gap:12px;min-height:72px}.spinner{width:22px;height:22px;border:3px solid #334155;border-top-color:var(--p);border-radius:50%;animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.tr{grid-template-columns:1.4fr .8fr .9fr}.tr>*:nth-child(4),.tr>*:nth-child(5){display:none}}@media(max-width:480px){.stats{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand" id="brand">Comissão Acumulada · Interfood</div><div class="sub" id="city">Homologação</div></div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — visão consolidada das comissões já congeladas nos fechamentos da franquia autenticada.</div><div class="actions"><button class="btn" onclick="voltar()">← Voltar ao financeiro</button></div><div id="app"><div class="card loading"><div class="spinner"></div><div><b>Carregando comissões...</b><div class="small" id="loadingText">Validando sua sessão.</div></div></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=fbe5d193"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k),APP_NAME='interligaFranqueadoHomologacao',API='https://us-central1-interliga-homologacao-eb0f2.cloudfunctions.net/gerenciarFechamentosInterfood';let app,auth,db,perfil,lojas=[],fechamentos=[];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function voltar(){location.href='financeiro-interfood-franqueado-homologacao.html?franquia='+encodeURIComponent(perfil?.franquiaId||qs('franquia')||'')}function loading(t){const el=$('loadingText');if(el)el.textContent=t}async function api(body){const token=await auth.currentUser.getIdToken();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...body,franquiaId:perfil.franquiaId})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível concluir.');return j}function millisData(txt){if(!txt)return 0;const d=new Date(txt+'T00:00:00-03:00');return Number.isNaN(d.getTime())?0:d.getTime()}function render(){const lojaId=$('fLoja')?.value||'',status=$('fStatus')?.value||'',periodo=$('fPeriodo')?.value||'todos';let inicio=0;if(periodo!=='todos'){if(periodo==='hoje'){const d=new Date();d.setHours(0,0,0,0);inicio=d.getTime()}if(periodo==='7')inicio=Date.now()-7*86400000;if(periodo==='30')inicio=Date.now()-30*86400000}const base=fechamentos.filter(f=>(!lojaId||f.lojaId===lojaId)&&(!status||f.status===status)&&(!inicio||millisData(f.fimTexto)>=inicio));const vendas=base.reduce((a,f)=>a+Number(f.vendas||0),0),com=base.reduce((a,f)=>a+Number(f.comissao||0),0),rep=base.reduce((a,f)=>a+Number(f.repasse||0),0),pago=base.filter(f=>f.status==='Pago').reduce((a,f)=>a+Number(f.comissao||0),0);const porLoja=lojas.filter(l=>!lojaId||l.id===lojaId).map(l=>{const xs=base.filter(f=>f.lojaId===l.id),v=xs.reduce((a,f)=>a+Number(f.vendas||0),0),c=xs.reduce((a,f)=>a+Number(f.comissao||0),0),r=xs.reduce((a,f)=>a+Number(f.repasse||0),0);const taxas=[...new Set(xs.map(f=>Number(f.taxaComissao||0).toLocaleString('pt-BR')+'%'))].join(', ');return'<div class="tr"><div><b>'+esc(l.nome||l.id)+'</b><div class="small">'+esc(l.categoria||'Estabelecimento')+'</div></div><div>'+xs.length+' fechamento(s)</div><div class="right"><b>'+money(v)+'</b></div><div class="right">'+(taxas||'—')+'<div class="small">'+money(c)+'</div></div><div class="right"><b>'+money(r)+'</b></div></div>'}).join('');$('app').innerHTML='<div class="stats"><div class="card"><div class="num">'+base.length+'</div><div class="small">Fechamentos filtrados</div></div><div class="card"><div class="num">'+money(vendas)+'</div><div class="small">Vendas fechadas</div></div><div class="card"><div class="num">'+money(com)+'</div><div class="small">Comissão acumulada</div></div><div class="card"><div class="num">'+money(pago)+'</div><div class="small">Comissão em fechamentos pagos</div></div></div><div class="filters"><select id="fLoja" class="sel" onchange="render()"><option value="">Todos os estabelecimentos</option>'+lojas.map(l=>'<option value="'+esc(l.id)+'" '+(l.id===lojaId?'selected':'')+'>'+esc(l.nome||l.id)+'</option>').join('')+'</select><select id="fStatus" class="sel" onchange="render()"><option value="" '+(!status?'selected':'')+'>Todos os status</option><option value="Pendente" '+(status==='Pendente'?'selected':'')+'>Pendente</option><option value="Pago" '+(status==='Pago'?'selected':'')+'>Pago</option></select><select id="fPeriodo" class="sel" onchange="render()"><option value="todos" '+(periodo==='todos'?'selected':'')+'>Todo o período</option><option value="hoje" '+(periodo==='hoje'?'selected':'')+'>Hoje</option><option value="7" '+(periodo==='7'?'selected':'')+'>Últimos 7 dias</option><option value="30" '+(periodo==='30'?'selected':'')+'>Últimos 30 dias</option></select></div><div class="card table"><div class="tr head"><div>Estabelecimento</div><div>Fechamentos</div><div class="right">Vendas</div><div class="right">Comissão</div><div class="right">Repasses</div></div>'+porLoja+(porLoja?'':'<div class="empty">Nenhum dado neste filtro.</div>')+'</div><div class="card small">Totais filtrados: vendas <b>'+money(vendas)+'</b> · comissão <b>'+money(com)+'</b> · repasses <b>'+money(rep)+'</b>. Os valores vêm dos fechamentos já registrados e não são recalculados com a taxa atual da loja.</div>'}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);loading('Validando sua sessão.');await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});loading('Confirmando acesso da franquia.');const ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');$('brand').textContent='Comissão Acumulada · Interfood '+perfil.franquiaId;$('city').textContent=(perfil.nome||'Franqueado')+' · franquia '+perfil.franquiaId;loading('Carregando estabelecimentos e fechamentos.');const [es,j]=await Promise.all([db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get(),api({acao:'listar'})]);lojas=es.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));fechamentos=j.fechamentos||[];render()}catch(e){$('app').innerHTML='<div class="card"><h2>Acesso bloqueado</h2><p>'+esc(e.message||e)+'</p></div>'}}carregar();</script></body></html>
