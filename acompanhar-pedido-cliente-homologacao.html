<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido · Interfood Homologação</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd);margin-bottom:12px}.muted{color:var(--muted)}.status{font-size:28px;font-weight:900;margin:8px 0 16px}.status.cancelado{color:#ff7188}.linha{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #263246}.linha:last-child{border-bottom:0}.etapas{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}.etapa{font-size:11px;text-align:center;padding:9px 5px;border-radius:8px;border:1px solid var(--bd);color:var(--muted)}.etapa.ativa{border-color:#ff6b00;color:#fff;background:#ff6b0022}.cancelbox{margin-top:16px;border:1px solid #ff718866;background:#ff718812;border-radius:10px;padding:12px;color:#ff9aac}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;padding:12px;background:#b42318;color:#fff;font-weight:900;cursor:pointer}.bad{color:#ff7188}@media(max-width:700px){.etapas{grid-template-columns:1fr 1fr}.linha{flex-direction:column}}</style></head><body><div class="top">Interfood · Acompanhar pedido</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — somente o cliente que criou o pedido pode visualizar este acompanhamento.</div><div id="app" class="card">Carregando pedido...</div></div><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const q=new URLSearchParams(location.search),fid=q.get('franquia'),loja=q.get('loja'),pedido=q.get('pedido'),appEl=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao';const fb=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=fb.auth(),db=fb.firestore();const etapas=['Novo','Confirmado','Em preparo','Pronto','Entregador aceitou','Coletado','Saiu para entrega','Concluído'];let refPedido=null;function render(d){const x=d.data()||{},idx=etapas.indexOf(x.status),encerrado=['Recusado','Cancelado'].includes(x.status),podeCancelar=['Novo','Confirmado'].includes(x.status);appEl.innerHTML='<div class="muted">Pedido</div><div><b>'+esc(x.numero||d.id)+'</b></div><div class="status '+(encerrado?'cancelado':'')+'">'+esc(x.status||'Sem status')+'</div><div class="linha"><span>Cliente</span><b>'+esc(x.cliente||'—')+'</b></div><div class="linha"><span>Valor</span><b>'+money(x.valor)+'</b></div><div class="linha"><span>Entrega</span><b>'+esc(x.entrega||'—')+'</b></div><div class="linha"><span>Pagamento</span><b>'+esc(x.pagamento||'—')+'</b></div>'+(x.endereco?'<div class="linha"><span>Endereço</span><b>'+esc(x.endereco)+'</b></div>':'')+(x.entregador&&x.entregador.nome?'<div class="linha"><span>Entregador</span><b>'+esc(x.entregador.nome)+'</b></div>':'')+(encerrado?'<div class="cancelbox"><b>Pedido '+esc(x.status.toLowerCase())+'.</b><br>Motivo: '+esc(x.motivoCancelamento||'Não informado')+'</div>':'<div class="etapas">'+etapas.map((e,i)=>'<div class="etapa '+(i<=idx?'ativa':'')+'">'+esc(e)+'</div>').join('')+'</div>')+(podeCancelar?'<button class="btn" onclick="cancelarPedido()">Cancelar pedido</button>':'');}async function cancelarPedido(){if(!refPedido||!auth.currentUser)return;const motivo=prompt('Informe o motivo do cancelamento:');if(motivo===null)return;const m=motivo.trim();if(m.length<3){alert('Informe um motivo com pelo menos 3 caracteres.');return}if(!confirm('Confirmar cancelamento deste pedido?'))return;try{await refPedido.update({status:'Cancelado',motivoCancelamento:m,canceladoPor:auth.currentUser.uid,canceladoEm:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert('Não foi possível cancelar: '+(e.message||e))}}async function iniciar(){try{if(!fid||!loja||!pedido)throw new Error('Link de acompanhamento incompleto.');let u=auth.currentUser;if(!u){await new Promise((resolve,reject)=>{const off=auth.onAuthStateChanged(x=>{off();x?resolve(x):reject(new Error('Sessão do cliente não encontrada.'))},reject)});}refPedido=db.collection('franquias').doc(fid).collection('estabelecimentos').doc(loja).collection('pedidos').doc(pedido);refPedido.onSnapshot(s=>{if(!s.exists){appEl.innerHTML='<div class="bad"><b>Pedido não encontrado.</b></div>';return}render(s)},e=>{appEl.innerHTML='<div class="bad"><b>Não foi possível acompanhar:</b> '+esc(e.message||e)+'</div>'});}catch(e){appEl.innerHTML='<div class="bad"><b>Não foi possível acompanhar:</b> '+esc(e.message||e)+'</div>';}}iniciar();</script></body></html>
