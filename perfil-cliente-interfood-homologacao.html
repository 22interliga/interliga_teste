<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 20px;font-size:22px;font-weight:900}.wrap{max-width:720px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--bd)}label{display:block;margin:13px 0 6px;color:var(--muted);font-size:13px}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:#0a1322;color:#fff;font-size:16px}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.sec{background:#334155}.ok{color:#62e993;margin-top:12px}.bad{color:#ff7188;margin-top:12px}.small{color:var(--muted);font-size:12px}</style></head><body><div class="top">Interfood · Meu perfil</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — você pode atualizar somente os dados da própria conta.</div><div class="card"><label>Nome</label><input id="nome" maxlength="120"><label>Telefone</label><input id="telefone" maxlength="30"><label>E-mail</label><input id="email" disabled><div class="small">O e-mail de acesso não é alterado por esta tela.</div><button class="btn" id="salvar" onclick="salvarPerfil()">Salvar alterações</button><button class="btn sec" onclick="voltar()">Voltar</button><div id="msg"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script>const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId==='interliga-mobilidade')throw new Error('Configuração de homologação inválida.');const appName='interligaClienteHomologacao',app=firebase.apps.find(a=>a.name===appName)||firebase.initializeApp(cfg,appName),auth=app.auth(),db=app.firestore();const q=new URLSearchParams(location.search),fid=q.get('franquia')||'candeias',loja=q.get('loja')||'ljc6GjET9wAoBBdQNE8g',nomeLoja=q.get('nome')||'TESTE TESTE';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function voltar(){location.href='painel-cliente-interfood-homologacao.html?franquia='+encodeURIComponent(fid)+'&loja='+encodeURIComponent(loja)+'&nome='+encodeURIComponent(nomeLoja)}auth.onAuthStateChanged(async u=>{if(!u||u.isAnonymous){location.href='login-cliente-firebase-teste.html';return}try{const s=await db.collection('clientes').doc(u.uid).get();if(!s.exists||s.data().perfil!=='cliente'||s.data().ativo!==true)throw new Error('Cliente sem acesso ativo.');const p=s.data();nome.value=p.nome||'';telefone.value=p.telefone||'';email.value=u.email||p.email||''}catch(e){msg.innerHTML='<div class="bad">'+esc(e.message||e)+'</div>'}});async function salvarPerfil(){const u=auth.currentUser;if(!u)return;const n=nome.value.trim(),t=telefone.value.trim();if(n.length<2){msg.innerHTML='<div class="bad">Informe seu nome corretamente.</div>';return}salvar.disabled=true;salvar.textContent='Salvando...';try{await db.collection('clientes').doc(u.uid).update({nome:n,telefone:t,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<div class="ok">Perfil atualizado com sucesso ✅</div>'}catch(e){msg.innerHTML='<div class="bad">Não foi possível salvar: '+esc(e.message||e)+'</div>'}finally{salvar.disabled=false;salvar.textContent='Salvar alterações'}}</script></body></html>
