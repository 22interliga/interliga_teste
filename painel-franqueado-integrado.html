<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Franqueado — Integrado</title><style>:root{--p:#1270c2;--bg:#060c1a;--bar:#0d1728;--bd:#263449}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Arial,sans-serif;color:#fff}.shell{height:100%;display:flex;flex-direction:column}.nav{min-height:58px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 14px;flex:0 0 auto;flex-wrap:wrap}.brand{font-weight:900;margin-right:auto}.city{font-size:11px;color:#9fb0c8;font-weight:400}.btn{border:1px solid var(--bd);background:#15233a;color:#dbe6f4;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.active{background:var(--p);color:#fff}.stage{flex:1;min-height:0}.stage iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:720px){.brand{width:100%;margin-bottom:3px}.btn{flex:1}.stage{min-height:0}}</style></head><body><div class="shell"><div class="nav"><div class="brand"><span id="nome">Painel do Franqueado</span><div class="city" id="cidade"></div></div><button id="bPainel" class="btn active" onclick="abrir('painel')">Painel</button><button id="bAuditoria" class="btn" onclick="abrir('auditoria')">Interfood · Auditoria</button><button id="bAcessos" class="btn" onclick="abrir('acessos')">Estabelecimentos · Acessos</button></div><div class="stage"><iframe id="frame" title="Área do Franqueado"></iframe></div></div><script>const $=x=>document.getElementById(x);function fid(){let id=new URLSearchParams(location.search).get('franquia')||'madre';return /^[a-z0-9_-]+$/i.test(id)?id:'madre'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function identidade(){let c=cfg();$('nome').textContent=(c.nomeApp||'Painel do Franqueado')+' · Franqueado';$('cidade').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.corPrimaria||'#1270c2')}function ativo(tipo){['Painel','Auditoria','Acessos'].forEach(x=>$('b'+x).classList.toggle('active',x.toLowerCase()===tipo))}function abrir(tipo){let id=fid();ativo(tipo);if(tipo==='auditoria')$('frame').src='auditoria-interfood-franqueado.html?franquia='+encodeURIComponent(id)+'&embed=1&v=10f13dc5';else if(tipo==='acessos')$('frame').src='acessos-estabelecimentos-franqueado.html?franquia='+encodeURIComponent(id)+'&embed=1&v=38f0eb4b';else $('frame').src='painel-franqueado-link.html?franquia='+encodeURIComponent(id)+'&embed=1&v=21e68178'}identidade();abrir('painel');window.addEventListener('storage',identidade)</script></body></html>
