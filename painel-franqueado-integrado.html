<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Franqueado — Integrado</title><style>:root{--p:#1270c2;--bg:#060c1a;--bar:#0d1728;--bd:#263449}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Arial,sans-serif;color:#fff}.shell{height:100%;display:flex;flex-direction:column}.nav{min-height:58px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 14px;flex:0 0 auto;flex-wrap:wrap}.brand{font-weight:900;margin-right:auto}.city{font-size:11px;color:#9fb0c8;font-weight:400}.btn{border:1px solid var(--bd);background:#15233a;color:#dbe6f4;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.active{background:var(--p);color:#fff}.stage{flex:1;min-height:0}.stage iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:720px){.brand{width:100%;margin-bottom:3px}.btn{flex:1}.stage{min-height:0}}</style></head><body><div class="shell"><div class="nav"><div class="brand"><span id="nome">Painel do Franqueado</span><div class="city" id="cidade"></div></div><button id="bPainel" class="btn active" onclick="abrir('painel')">Painel</button><button id="bAuditoria" class="btn" onclick="abrir('auditoria')">Interfood · Auditoria</button><button id="bAcessos" class="btn" onclick="abrir('acessos')">Estabelecimentos · Acessos</button></div><div class="stage"><iframe id="frame" title="Área do Franqueado"></iframe></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=2026.09.16.1"></script><script>const $=x=>document.getElementById(x);const APP_NAME='interligaFranqueadoHomologacao';let app,auth,db,franquiaAtual=null;function fid(){let id=new URLSearchParams(location.search).get('franquia')||'';return /^[a-z0-9_-]+$/i.test(id)?id:''}async function identidade(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg||cfg.projectId!=='interliga-homologacao-eb0f2')throw new Error('Configuração de homologação inválida.');try{app=firebase.app(APP_NAME)}catch(_){app=firebase.initializeApp(cfg,APP_NAME)}auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);const u=auth.currentUser;if(!u){location.href='login-franqueado-firebase-teste.html';return}const ps=await db.collection('franqueados').doc(u.uid).get({source:'server'});if(!ps.exists)throw new Error('Franqueado não cadastrado.');const perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw new Error('Perfil de franqueado inválido ou inativo.');const urlId=fid();if(urlId&&urlId!==perfil.franquiaId)throw new Error('Acesso a outra franquia bloqueado.');franquiaAtual=perfil.franquiaId;const fs=await db.collection('franquias').doc(franquiaAtual).get({source:'server'});if(!fs.exists)throw new Error('Franquia não encontrada.');const c={id:fs.id,...fs.data()};$('nome').textContent=(c.nomeApp||'Painel do Franqueado')+' · Franqueado';$('cidade').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.corPrimaria||'#1270c2')}catch(e){console.error(e);alert(e.message||e);location.href='login-franqueado-firebase-teste.html'}}function ativo(tipo){['Painel','Auditoria','Acessos'].forEach(x=>$('b'+x).classList.toggle('active',x.toLowerCase()===tipo))}function abrir(tipo){let id=franquiaAtual||fid();ativo(tipo);if(tipo==='auditoria')$('frame').src='auditoria-interfood-franqueado.html?franquia='+encodeURIComponent(id)+'&embed=1&v=10f13dc5';else if(tipo==='acessos')$('frame').src='acessos-estabelecimentos-franqueado.html?franquia='+encodeURIComponent(id)+'&embed=1&v=87b08d9a';else $('frame').src='painel-franqueado-link.html?franquia='+encodeURIComponent(id)+'&embed=1&v=21e68178'}identidade().then(()=>{if(franquiaAtual)abrir('painel')})</script></body></html>
