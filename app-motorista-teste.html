<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motorista — Teste Franquia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07101f;color:#fff}.top{padding:18px;background:#1270c2;display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:13px;background:#fff;display:grid;place-items:center;color:#111;overflow:hidden;font-weight:900}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;opacity:.8}.wrap{max-width:520px;margin:auto;padding:18px}.test{padding:10px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:14px}.card{background:#101827;border:1px solid #2b3648;border-radius:18px;padding:18px;margin-bottom:14px}.status{font-size:25px;font-weight:900}.ok{color:#45d483}.warn{color:#ffd166}.bad{color:#ff5c7a}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#1270c2;color:#fff;font-weight:900;margin-top:10px}.lock{text-align:center;padding:35px 18px}.lock .icon{font-size:55px}.small{font-size:12px;color:#9da9ba}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#ffffff12;margin-top:8px}</style></head><body><div class="top"><div id="logo" class="logo">IL</div><div><div id="brand" class="brand">Motorista</div><div id="city" class="sub"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — consulta somente a franquia ativa neste navegador.</div><div id="content"></div></div><script>const $=x=>document.getElementById(x);function cfg(){let id=localStorage.getItem('interliga_franquia_atual')||'madre';try{return{id,...JSON.parse(localStorage.getItem('interliga_franquia_'+id)||'{}')}}catch(e){return{id}}}function mensal(id){try{return JSON.parse(localStorage.getItem('interliga_mensalidade_'+id)||'{}')}catch(e){return{}}}function state(m){if(m.pago)return'liberado';if(!m.vencimento)return'liberado';let h=new Date();h.setHours(0,0,0,0);let v=new Date(m.vencimento+'T00:00:00'),d=Math.floor((h-v)/86400000);return d>2?'bloqueado':d>0?'carencia':'liberado'}function render(){let c=cfg(),m=mensal(c.id),s=state(m);$('brand').textContent=(c.nomeApp||'Interliga')+' · Motorista';$('city').textContent=c.cidade||c.id;let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IL';document.querySelector('.top').style.background=c.coresAreas?.header||c.corPrimaria||'#1270c2';if(s==='bloqueado')$('content').innerHTML='<div class="card lock"><div class="icon">🔒</div><div class="status bad">Operação temporariamente indisponível</div><p>O aplicativo Motorista desta franquia está temporariamente bloqueado.</p><p class="small">Entre em contato com a administração local. Seus dados permanecem preservados.</p></div>';else $('content').innerHTML='<div class="card"><div class="status '+(s==='carencia'?'warn':'ok')+'">● '+(s==='carencia'?'Operação ativa':'Motorista online')+'</div><span class="pill">Franquia: '+c.id+'</span><p>'+(s==='carencia'?'Aplicativo ainda está funcionando durante a carência da franquia.':'Aplicativo liberado para receber corridas.')+'</p><button class="btn">Ficar disponível para corridas</button></div><div class="card"><b>Configuração recebida da franquia</b><p class="small">As regras locais de corrida e precificação permanecem vinculadas somente a esta base.</p></div>'} }render();window.addEventListener('storage',render);</script></body></html>
