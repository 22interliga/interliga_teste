<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conferência de pedidos · Interfood</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#9da9ba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:23px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:20px}.notice,.card{border-radius:14px}.notice{padding:11px;border:1px solid #22c55e66;background:#22c55e18;color:#86efac;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 180px;gap:10px}.inp{width:100%;padding:11px;background:#172235;color:#fff;border:1px solid var(--bd);border-radius:9px}.small{font-size:12px;color:var(--muted)}.pedido{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #243047}.pedido:last-child{border-bottom:0}.valor{font-weight:900}.ok{color:#86efac}.warn{color:#fbbf24}.err{color:#fca5a5}.resumo{padding:11px;border-radius:10px;background:#0b1424;border:1px solid #334155;margin:10px 0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#22c55e1c;color:#86efac;font-size:11px;font-weight:800;margin-left:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top">Conferência de pedidos · Interfood</div><div class="wrap"><div class="notice">HOMOLOGAÇÃO — consulta somente leitura. Não registra fechamento e não altera pedidos.</div><div class="card"><div class="grid"><select id="loja" class="inp" onchange="listar()"><option>Carregando...</option></select><input id="data" type="date" class="inp" value="2026-09-05" onchange="listar()"></div></div><div id="out" class="card">Carregando...</div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="interfood-homologacao-refresh.js?v=2026.09.05.1"></script><script src="firebase-interfood-config-teste.js?v=2026.09.05.1"></script><script>const $=x=>document.getElementById(x),qs=k=>new URLSearchParams(location.search).get(k);const APP='interligaFranqueadoHomologacao',API='https://us-central1-interliga-homologacao-eb0f2.cloudfunctions.net/gerenciarFechamentosInterfood';let app,auth,db,perfil,lojas=[];const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function diaBahia(ts){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bahia',year:'numeric',month:'2-digit',day:'2-digit'}).format(ts.toDate())}catch{return''}}async function api(body){const token=await auth.currentUser.getIdToken();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...body,franquiaId:perfil.franquiaId})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Não foi possível consultar.');return j}async function listar(){if(!perfil)return;const lojaId=$('loja').value,data=$('data').value;if(!lojaId||!data)return;$('out').innerHTML='Consultando pedidos concluídos e resumo financeiro seguro...';try{const lref=db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(lojaId);const [ps,j]=await Promise.all([lref.collection('pedidos').where('status','==','Concluído').get({source:'server'}),api({acao:'disponiveis',lojaId})]);const todos=[];ps.forEach(d=>{const p=d.data()||{},ts=p.concluidoEm||p.criadoEm;if(ts&&diaBahia(ts)===data)todos.push({id:d.id,numero:p.numero||d.id,valor:Number(p.valor||0),concluidoEm:ts})});todos.sort((a,b)=>(a.concluidoEm?.toMillis?.()||0)-(b.concluidoEm?.toMillis?.()||0));const totalTodos=todos.reduce((a,x)=>a+x.valor,0);const resumo=(j.disponiveis?.datas||[]).find(x=>x.data===data)||{quantidadePedidos:0,vendas:0};const bate=Number(resumo.quantidadePedidos||0)===todos.length&&Math.round(Number(resumo.vendas||0)*100)===Math.round(totalTodos*100);$('out').innerHTML='<h2 style="margin-top:0">Conferência em '+esc(data.split('-').reverse().join('/'))+'</h2><div class="resumo"><b>Disponíveis para fechamento pelo servidor:</b> '+Number(resumo.quantidadePedidos||0)+' pedido(s) · '+money(resumo.vendas)+'</div><div class="resumo"><b>Concluídos encontrados nesta data:</b> '+todos.length+' pedido(s) · '+money(totalTodos)+(bate?'<span class="tag">Valores conferem</span>':'')+'</div>'+(bate?'<p class="ok"><b>Conferência positiva:</b> os pedidos listados abaixo correspondem ao resumo disponível para fechamento.</p>':'<p class="warn"><b>Atenção:</b> existem pedidos concluídos nesta data que podem já estar em fechamento anterior. O resumo seguro acima continua sendo a referência para o fechamento.</p>')+(todos.length?todos.map(x=>'<div class="pedido"><div><b>'+esc(x.numero)+'</b><div class="small">ID: '+esc(x.id)+'</div></div><div class="valor">'+money(x.valor)+'</div></div>').join(''):'<div class="small">Nenhum pedido concluído encontrado nesta data.</div>')}catch(e){$('out').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}async function carregar(){try{const cfg=window.INTERFOOD_FIREBASE_TEST_CONFIG;if(!cfg)throw Error('Configuração Firebase não carregada.');try{app=firebase.app(APP)}catch(_){app=firebase.initializeApp(cfg,APP)}auth=app.auth();db=app.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await new Promise((ok,no)=>{const t=setTimeout(()=>no(Error('Sessão do franqueado não carregou.')),5000),off=auth.onAuthStateChanged(u=>{if(!u)return;clearTimeout(t);off();ok()},no)});const ps=await db.collection('franqueados').doc(auth.currentUser.uid).get({source:'server'});if(!ps.exists)throw Error('Cadastro de franqueado não encontrado.');perfil=ps.data()||{};if(perfil.ativo!==true||perfil.perfil!=='franqueado'||!perfil.franquiaId)throw Error('Franqueado inválido ou inativo.');if(qs('franquia')&&qs('franquia')!==perfil.franquiaId)throw Error('Acesso bloqueado para outra franquia.');const es=await db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').get({source:'server'});lojas=es.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id)));$('loja').innerHTML=lojas.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.nome||l.id)+'</option>').join('');const teste=lojas.find(l=>String(l.nome||'').toUpperCase()==='TESTE TESTE');if(teste)$('loja').value=teste.id;await listar()}catch(e){$('out').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'}}carregar();</script></body></html>
