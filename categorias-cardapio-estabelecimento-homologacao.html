<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interfood · Categorias</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648;--muted:#aab4c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{background:var(--p);padding:18px 22px;font-size:22px;font-weight:900}.wrap{max-width:850px;margin:auto;padding:20px}.notice,.card{border-radius:14px;padding:16px;margin-bottom:14px}.notice{border:1px solid #22c55e66;background:#22c55e18;color:#8bf0ad}.card{background:var(--card);border:1px solid var(--bd)}input{width:100%;padding:12px;border:1px solid #344158;border-radius:9px;background:#0b1424;color:#fff;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 120px;gap:10px}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;margin:5px}.sec{background:#3c4b61}.danger{background:#b42318}.green{background:#15803d}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #263247;padding:13px 0}.item:first-child{border-top:0}.muted{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#22c55e22;color:#86efac}.off{background:#ef444422;color:#fda4af}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.btn{margin-left:0}}</style></head><body><div class="top">Interfood · Categorias do cardápio</div><div class="wrap"><div class="notice">AMBIENTE DE HOMOLOGAÇÃO — categorias exclusivas deste estabelecimento.</div><div class="card"><h2 id="titulo">Carregando...</h2><p class="muted">Crie as seções que o cliente verá e defina a ordem de exibição.</p><div class="grid"><label>Nome da categoria<input id="nome" maxlength="100" placeholder="Ex.: Pizzas"></label><label>Ordem<input id="ordem" type="number" min="1" value="1"></label></div><button class="btn" onclick="salvar()">+ Adicionar categoria</button><button class="btn sec" onclick="voltar()">Voltar ao cardápio</button><div id="msg"></div></div><div class="card"><h3>Categorias cadastradas</h3><div id="lista" class="muted">Carregando...</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-interfood-config-teste.js?v=7b9ac687"></script><script src="firebase-auth-interfood-teste.js?v=89df59c9"></script><script>const qs=k=>new URLSearchParams(location.search).get(k),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let db,auth,perfil,lojaRef;async function iniciar(){try{({db,auth}=await InterfoodAuthTeste.iniciar());await new Promise((ok,no)=>{const off=auth.onAuthStateChanged(u=>{off();u?ok():no(Error('Faça login como estabelecimento.'))},no)});const p=await db.collection('usuariosEstabelecimentos').doc(auth.currentUser.uid).get({source:'server'});if(!p.exists)throw Error('Vínculo não encontrado.');perfil=p.data();if(perfil.ativo!==true||perfil.perfil!=='estabelecimento')throw Error('Acesso não autorizado.');if(qs('franquia')!==perfil.franquiaId||qs('loja')!==perfil.lojaId)throw Error('A URL não corresponde à loja autenticada.');lojaRef=db.collection('franquias').doc(perfil.franquiaId).collection('estabelecimentos').doc(perfil.lojaId);const l=await lojaRef.get({source:'server'});$('titulo').textContent=(l.data()?.nome||'Estabelecimento')+' · Categorias';await listar()}catch(e){$('msg').innerHTML='<p style="color:#ff7188">'+esc(e.message||e)+'</p>'}}async function salvar(){try{const nome=$('nome').value.trim(),ordem=Number($('ordem').value);if(nome.length<2)return alert('Informe o nome da categoria.');if(!Number.isInteger(ordem)||ordem<1||ordem>999)return alert('Informe uma ordem entre 1 e 999.');await lojaRef.collection('categoriasCardapio').add({nome,ordem,ativo:true,criadoEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});$('nome').value='';$('ordem').value=String(ordem+1);$('msg').innerHTML='<p style="color:#62e993">Categoria criada com sucesso ✅</p>';await listar()}catch(e){$('msg').innerHTML='<p style="color:#ff7188">Não foi possível salvar: '+esc(e.message||e)+'</p>'}}async function listar(){const s=await lojaRef.collection('categoriasCardapio').get(),a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));a.sort((x,y)=>Number(x.ordem||999)-Number(y.ordem||999)||(x.nome||'').localeCompare(y.nome||''));$('lista').innerHTML=a.length?a.map(x=>'<div class="item"><div><b>'+esc(x.nome)+'</b> <span class="badge '+(x.ativo===false?'off':'')+'">'+(x.ativo===false?'Inativa':'Ativa')+'</span><div class="muted">Ordem: '+Number(x.ordem||0)+'</div></div><div><button class="btn sec" onclick="mover(\''+x.id+'\','+Number(x.ordem||1)+',-1)">↑</button><button class="btn sec" onclick="mover(\''+x.id+'\','+Number(x.ordem||1)+',1)">↓</button><button class="btn '+(x.ativo===false?'green':'danger')+'" onclick="alternar(\''+x.id+'\','+(x.ativo!==false)+')">'+(x.ativo===false?'Ativar':'Desativar')+'</button></div></div>').join(''):'Nenhuma categoria cadastrada.'}async function mover(id,ordem,d){await lojaRef.collection('categoriasCardapio').doc(id).update({ordem:Math.max(1,Math.min(999,ordem+d)),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});await listar()}async function alternar(id,atual){await lojaRef.collection('categoriasCardapio').doc(id).update({ativo:!atual,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()});await listar()}function voltar(){location.href='cardapio-estabelecimento-homologacao.html?franquia='+encodeURIComponent(perfil.franquiaId)+'&loja='+encodeURIComponent(perfil.lojaId)}iniciar();</script></body></html>
