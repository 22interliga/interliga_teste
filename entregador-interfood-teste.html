<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entregador Interfood — Teste</title><style>:root{--p:#ff6b00;--bg:#07101f;--card:#101827;--bd:#2b3648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{padding:16px 20px;background:var(--p);display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;background:#fff;color:#111;border-radius:12px;display:grid;place-items:center;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand{font-size:21px;font-weight:900}.sub,.small{font-size:12px;color:#9da9ba}.top .sub{color:#fff;opacity:.85}.wrap{max-width:900px;margin:auto;padding:18px}.test{padding:11px;border:1px solid #f59e0b88;background:#f59e0b18;color:#ffd36a;border-radius:12px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 9px;border-radius:99px;background:#f59e0b22;color:#ffd166;font-size:11px}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer;margin-top:12px}.btn.gray{background:#263449}.lock{text-align:center;padding:40px}.bad{font-size:24px;color:#ff6680;font-weight:900}.empty{text-align:center;padding:35px;color:#9da9ba}@media(max-width:600px){.row{flex-direction:column;align-items:flex-start}.btn{width:100%}}</style></head><body><div class="top"><div class="logo" id="logo">IF</div><div><div id="brand" class="brand">Entregador Interfood</div><div id="sub" class="sub"></div></div></div><div class="wrap"><div class="test">AMBIENTE DE TESTE — entregas somente da franquia deste link.</div><div id="app"></div></div><script>const $=x=>document.getElementById(x);function fid(){return new URLSearchParams(location.search).get('franquia')||'candeias'}function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function cfg(){let id=fid(),d=read('interliga_franquia_'+id);return{id,...d}}function db(){return read('interliga_interfood_'+fid())}function mensal(){return read('interliga_mensalidade_'+fid())}function block(){let m=mensal();if(m.pago===true||!m.vencimento)return false;let h=new Date();h.setHours(0,0,0,0);return Math.floor((h-new Date(m.vencimento+'T00:00:00'))/86400000)>2}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function st(id,s){let d=db(),p=(d.pedidos||[]).find(x=>x.id===id);if(p){p.status=s;p.entregadorStatus=s;write('interliga_interfood_'+fid(),d);render()}}function render(){let c=cfg(),d=db();$('brand').textContent='Entregador · '+(c.nomeInterfood||'Interfood');$('sub').textContent=c.cidade||c.id;document.documentElement.style.setProperty('--p',c.coresAreas?.interfood||c.corDestaque||'#ff6b00');let l=c.logoData||c.logoUrl||'';$('logo').innerHTML=l?'<img src="'+l+'">':'IF';if(block()){$('app').innerHTML='<div class="card lock"><div style="font-size:50px">🔒</div><div class="bad">Operação temporariamente indisponível</div><p>Entregas desta franquia estão bloqueadas.</p></div>';return}let ps=(d.pedidos||[]).filter(p=>p.entrega==='Interfood'&&['Pronto','Entregador aceitou','Coletado','Saiu para entrega'].includes(p.status));if(!ps.length){$('app').innerHTML='<div class="card empty"><b>Nenhuma entrega disponível agora.</b><p>Quando um estabelecimento marcar um pedido Interfood como <b>Pronto</b>, ele aparecerá aqui.</p></div>';return}$('app').innerHTML=ps.map(p=>'<div class="card"><div class="row"><div><b>Pedido '+p.id+'</b><div class="small">Retirada: '+p.loja+'</div><div style="margin-top:7px">Valor do pedido: '+money(p.valor)+'</div></div><span class="badge">'+p.status+'</span></div>'+(p.status==='Pronto'?'<button class="btn" onclick="st(\''+p.id+'\',\'Entregador aceitou\')">Aceitar entrega</button>':'')+(p.status==='Entregador aceitou'?'<button class="btn" onclick="st(\''+p.id+'\',\'Coletado\')">Confirmar coleta</button>':'')+(p.status==='Coletado'?'<button class="btn" onclick="st(\''+p.id+'\',\'Saiu para entrega\')">Iniciar entrega</button>':'')+(p.status==='Saiu para entrega'?'<button class="btn" onclick="st(\''+p.id+'\',\'Concluído\')">Confirmar entrega</button>':'')+'</div>').join('')}render();window.addEventListener('storage',render);setInterval(render,1500)</script></body></html>
